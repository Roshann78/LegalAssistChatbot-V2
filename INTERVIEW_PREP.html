l).\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-16-pytest-pytest-asyncio-ruff-pre-commit-detect-secrets\">16. pytest, pytest-asyncio, ruff, pre-commit, detect-secrets\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> Test runner, async test support, a very fast linter and formatter, git hook runner, and a secret scanner.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> 218 tests in 16 files; \u003ccode>asyncio_mode = \"auto\"\u003c/code>; \u003ccode>-m \"not slow\"\u003c/code> by default so real-model tests are opt-in. \u003ccode>ruff check .\u003c/code> gates CI. \u003ccode>scripts/check_staged.py\u003c/code> blocks staging \u003ccode>.env\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> pytest collects \u003ccode>test_*.py\u003c/code>, injects fixtures (\u003ccode>conftest.py\u003c/code> builds a tmp-path \u003ccode>Settings\u003c/code> and a fixture corpus indexed with the hashing embedder). Time and sleep are injected, so no test waits.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>unittest\u003c/em> is more verbose; \u003cem>flake8 + black + isort\u003c/em> is three tools versus ruff.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-17-uv-hatchling-github-actions\">17. uv, hatchling, GitHub Actions\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> \u003ccode>uv\u003c/code> is a fast Python package manager; \u003ccode>hatchling\u003c/code> is the build backend; GitHub Actions runs CI.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> \u003ccode>uv sync\u003c/code> gives reproducible installs (lock file stale at present, a known item). CI has three jobs: test (ruff, pytest, staged guard, advisory \u003ccode>pip-audit\u003c/code>, eval smoke gate), web (typecheck, build) and docker (image build).\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> The eval gate runs \u003ccode>python -m legal_rag.eval run --config G1_prompt_v2 ... --min hit@5=0.9 mrr=0.8 abstention_acc=0.9 citation_valid=0.9\u003c/code> on the fixture corpus; a regression fails the job and uploads the report as an artifact.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>pip + requirements.txt\u003c/em> has no lock or resolver speed; \u003cem>Poetry\u003c/em> works but is slower.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-18-docker-multi-stage\">18. Docker (multi-stage)\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> Container packaging. The \u003ccode>Dockerfile\u003c/code> has a build stage that installs the package into \u003ccode>/install\u003c/code>, and a runtime stage on \u003ccode>python:3.11-slim\u003c/code> that copies it, creates a non-root user (uid 1000), copies \u003ccode>data/\u003c/code>, and defines a \u003ccode>/health\u003c/code> healthcheck.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> Reproducible deployment; the compose file adds an \u003ccode>index-data\u003c/code> volume and an \u003ccode>ingest\u003c/code> profile for one-shot ingestion.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> Layers are cached; the slim base and multi-stage copy keep the image small; running as non-root limits blast radius.\u003c/p>\n\u003cp>\u003cstrong>Honest status.\u003c/strong> I haven't run the build here. The Dockerfile also installs without the \u003ccode>embeddings\u003c/code> extra, so the default MiniLM model would fail inside the container until the extra is added.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-19-llm-llama-3-3-70b-versatile-on-groq\">19. LLM: llama-3.3-70b-versatile on Groq\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> A 70-billion-parameter open-weights chat model served on Groq's inference hardware through an OpenAI-compatible API.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> Fast token streaming and a free tier suit a demo. Defaults: temperature 0.1 (low variance for factual answers), \u003ccode>max_tokens\u003c/code> 2,048, 30 s timeout.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> I send a system prompt containing the numbered passages inside \u003ccode>&lt;passages&gt;...&lt;/passages&gt;\u003c/code> and the user's question; the model generates tokens autoregressively, which I forward as SSE \u003ccode>token\u003c/code> events.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>GPT/Claude\u003c/em> are strong but paid; a local model would need a GPU. The provider is behind \u003ccode>LLMClient\u003c/code>, so switching is a small adapter.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-cheat-sheet\">Cheat sheet\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technology\u003c/th>\u003cth>Category\u003c/th>\u003cth>One-liner\u003c/th>\u003cth>\"Why not X?\"\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>FastAPI / Uvicorn\u003c/td>\u003ctd>Web framework / server\u003c/td>\u003ctd>Async ASGI with validation and OpenAPI\u003c/td>\u003ctd>Flask is WSGI: no native async streaming\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SSE\u003c/td>\u003ctd>Streaming protocol\u003c/td>\u003ctd>One-way text frames over HTTP\u003c/td>\u003ctd>WebSockets add bidirectional state I don't need\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pydantic v2 / pydantic-settings\u003c/td>\u003ctd>Validation / config\u003c/td>\u003ctd>Typed models and env-driven settings\u003c/td>\u003ctd>dataclasses don't validate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>httpx\u003c/td>\u003ctd>HTTP client\u003c/td>\u003ctd>Async client; easy to mock with \u003ccode>MockTransport\u003c/code>\u003c/td>\u003ctd>requests is sync; SDKs hide behaviour\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retry with jitter\u003c/td>\u003ctd>Resilience\u003c/td>\u003ctd>Retry only transient errors, never mid-stream\u003c/td>\u003ctd>Generic retry would duplicate streamed text\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PyMuPDF\u003c/td>\u003ctd>PDF parsing\u003c/td>\u003ctd>Fast, page-aware text extraction\u003c/td>\u003ctd>pdfminer slower; OCR is a different problem\u003c/td>\u003c/tr>\u003ctr>\u003ctd>all-MiniLM-L6-v2\u003c/td>\u003ctd>Dense embeddings\u003c/td>\u003ctd>384-d, 256-token, CPU-friendly\u003c/td>\u003ctd>Larger models are slower; no bake-off run yet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hashing embedder\u003c/td>\u003ctd>Test embeddings\u003c/td>\u003ctd>Deterministic bag-of-words, 512-d\u003c/td>\u003ctd>A real model needs a download in CI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BM25\u003c/td>\u003ctd>Sparse retrieval\u003c/td>\u003ctd>tf saturation, idf, length norm\u003c/td>\u003ctd>TF-IDF lacks saturation and normalisation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RRF (k0=60)\u003c/td>\u003ctd>Rank fusion\u003c/td>\u003ctd>Sum of \u003ccode>1/(60+rank)\u003c/code>\u003c/td>\u003ctd>Score mixing needs calibration\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qdrant\u003c/td>\u003ctd>Vector DB\u003c/td>\u003ctd>HNSW dense + IDF sparse + payload filters\u003c/td>\u003ctd>pgvector ties to Postgres; Pinecone is hosted only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQLite\u003c/td>\u003ctd>Cache\u003c/td>\u003ctd>Embedding cache keyed by model + hash\u003c/td>\u003ctd>Redis needs a server\u003c/td>\u003c/tr>\u003ctr>\u003ctd>YAML manifest\u003c/td>\u003ctd>Registry\u003c/td>\u003ctd>Source of truth, edited as text\u003c/td>\u003ctd>Re-dumping loses comments\u003c/td>\u003c/tr>\u003ctr>\u003ctd>asyncio + threads\u003c/td>\u003ctd>Concurrency\u003c/td>\u003ctd>Event loop for I/O, threads for CPU\u003c/td>\u003ctd>CPU in handlers would block all requests\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Next.js / React / TS\u003c/td>\u003ctd>UI\u003c/td>\u003ctd>Typed streaming interface\u003c/td>\u003ctd>Streamlit is harder to customise\u003c/td>\u003c/tr>\u003ctr>\u003ctd>pytest / ruff / pre-commit\u003c/td>\u003ctd>Quality\u003c/td>\u003ctd>218 tests, lint, secret guard\u003c/td>\u003ctd>flake8+black+isort = three tools\u003c/td>\u003c/tr>\u003ctr>\u003ctd>uv / GitHub Actions\u003c/td>\u003ctd>Tooling / CI\u003c/td>\u003ctd>Fast installs, 3-job pipeline with eval gate\u003c/td>\u003ctd>pip lacks a lock and resolver speed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Docker multi-stage\u003c/td>\u003ctd>Packaging\u003c/td>\u003ctd>Slim non-root image with healthcheck\u003c/td>\u003ctd>Never built here; missing embeddings extra\u003c/td>\u003c/tr>\u003ctr>\u003ctd>llama-3.3-70b on Groq\u003c/td>\u003ctd>LLM\u003c/td>\u003ctd>Fast streaming, temp 0.1\u003c/td>\u003ctd>Paid APIs cost; local needs a GPU\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","toc":[{"level":2,"text":"1. FastAPI, Starlette and Uvicorn (ASGI)","id":"s2-1-fastapi-starlette-and-uvicorn-asgi"},{"level":2,"text":"2. Server-Sent Events (SSE)","id":"s2-2-server-sent-events-sse"},{"level":2,"text":"3. Pydantic v2 and pydantic-settings","id":"s2-3-pydantic-v2-and-pydantic-settings"},{"level":2,"text":"4. httpx (and the Groq API)","id":"s2-4-httpx-and-the-groq-api"},{"level":2,"text":"5. Retry with exponential backoff and jitter (llm/resilience.py)","id":"s2-5-retry-with-exponential-backoff-and-jitter-llm-resilience-p"},{"level":2,"text":"6. PyMuPDF (fitz)","id":"s2-6-pymupdf-fitz"},{"level":2,"text":"7. Sentence-Transformers and all-MiniLM-L6-v2","id":"s2-7-sentence-transformers-and-all-minilm-l6-v2"},{"level":2,"text":"8. The hashing embedder","id":"s2-8-the-hashing-embedder"},{"level":2,"text":"9. BM25 (sparse retrieval)","id":"s2-9-bm25-sparse-retrieval"},{"level":2,"text":"10. Reciprocal Rank Fusion","id":"s2-10-reciprocal-rank-fusion"},{"level":2,"text":"11. Qdrant","id":"s2-11-qdrant"},{"level":2,"text":"12. SQLite (embedding cache)","id":"s2-12-sqlite-embedding-cache"},{"level":2,"text":"13. YAML manifest and text-level editing","id":"s2-13-yaml-manifest-and-text-level-editing"},{"level":2,"text":"14. asyncio and threading","id":"s2-14-asyncio-and-threading"},{"level":2,"text":"15. Next.js, React and TypeScript","id":"s2-15-next-js-react-and-typescript"},{"level":2,"text":"16. pytest, pytest-asyncio, ruff, pre-commit, detect-secrets","id":"s2-16-pytest-pytest-asyncio-ruff-pre-commit-detect-secrets"},{"level":2,"text":"17. uv, hatchling, GitHub Actions","id":"s2-17-uv-hatchling-github-actions"},{"level":2,"text":"18. Docker (multi-stage)","id":"s2-18-docker-multi-stage"},{"level":2,"text":"19. LLM: llama-3.3-70b-versatile on Groq","id":"s2-19-llm-llama-3-3-70b-versatile-on-groq"},{"level":2,"text":"Cheat sheet","id":"s2-cheat-sheet"}],"entries":[{"id":"s2-technology-deep-dive","heading":"Technology Deep Dive","text":"For each technology: what it is, why it is in this project, how it works inside, and why not the alternative. Project references are to this repository. ---"},{"id":"s2-1-fastapi-starlette-and-uvicorn-asgi","heading":"1. FastAPI, Starlette and Uvicorn (ASGI)","text":"What it is. FastAPI is a Python web framework built on Starlette (the ASGI toolkit) and Pydantic. Uvicorn is the ASGI server that runs it. Why I chose it. I need async streaming responses (SSE), request validation, and generated OpenAPI docs ( /docs , which I screenshotted for the report). create_app() in api/main.py:82 is an application factory, so tests inject fakes. How it works internally. ASGI is a calling convention: an app is async def app(scope, receive, send) . Uvicorn parses the HTTP request, builds scope , and calls the app; the app sends http.response.start and http.response.body messages. FastAPI routes the scope to a path operation, validates the body with a Pydantic model, and for a StreamingResponse iterates an async generator, sending each yielded string as a body chunk with more_body=True . My AbuseControlMiddleware ( api/security.py ) is a pure ASGI middleware: it inspects scope[\"headers\"] and either calls the next app or sends its own 413/429 messages, which avoids the overhead and quirks of BaseHTTPMiddleware . Why not the alternative. Flask is WSGI: no native async streaming, so SSE needs workarounds. Django is heavier than I need. Raw Starlette would work, but I'd lose automatic validation and OpenAPI. ---"},{"id":"s2-2-server-sent-events-sse","heading":"2. Server-Sent Events (SSE)","text":"What it is. A one-way text stream over HTTP with Content-Type: text/event-stream , framed as event: name\\ndata: {...}\\n\\n . Why. The answer flows server to client only. SSE gives incremental tokens with a plain HTTP request and works through proxies that allow streaming. My events: token , citations , abstained , done , error ( api/streaming.py:format_sse ). How it works. The server keeps the response open and writes frames as tokens arrive; a blank line ends a frame. The browser EventSource API can only issue GET, so web/lib/api.ts uses fetch with a ReadableStream reader and parses frames itself. Why not WebSockets. Bidirectional framing and connection state I don't need. Why not long-polling. Higher latency and more requests. ---"},{"id":"s2-3-pydantic-v2-and-pydantic-settings","heading":"3. Pydantic v2 and pydantic-settings","text":"What it is. Runtime data validation based on type hints (v2 core is written in Rust). pydantic-settings loads settings from environment variables and .env . Why. One typed definition for the manifest ( DocumentRecord ), request bodies ( AskRequest , FeedbackRequest ), responses ( ErrorResponse ) and configuration ( Settings , about 70 fields). SecretStr keeps API keys out of logs and dumps. field_validator handles llm_provider , retrieval modes and CORS parsing. How it works. Models compile to a validator schema at class creation; validation coerces and checks types, constraints ( ge , le , pattern , max_length ) and runs custom validators, raising ValidationError with per-field locations (my manifest loader reports [('field',)] for each bad record). In settings, NoDecode stops pydantic-settings from forcing JSON decoding on a list field, so my own validator can accept comma-separated values. Why not the alternative. dataclasses give no validation. Marshmallow is a separate schema layer and wouldn't integrate with FastAPI's OpenAPI generation. ---"},{"id":"s2-4-httpx-and-the-groq-api","heading":"4. httpx (and the Groq API)","text":"What it is. An async-capable HTTP client. Groq exposes an OpenAI-compatible chat-completions endpoint at https://api.groq.com/openai/v1 . Why. GroqClient ( llm/groq_client.py ) posts {model, messages, temperature, max_tokens, stream} with a bearer token, so no vendor SDK is needed. Tests use httpx.MockTransport to return canned status codes and streaming bodies with no network. How it works. With stream: true the server returns SSE lines data: {\"choices\":[{\"delta\":{\"content\":\"...\"}}]} ending with data: [DONE] ; the client reads aiter_lines() , parses each JSON line and yields the content delta. HTTP errors map to typed exceptions: 401/403 → LLMAuthError , 429 → LLMRateLimitError(retry_after) , 5xx → LLMProviderError(status) , timeouts → LLMTimeoutError . Why not the alternative. The official groq / openai SDKs add a dependency and hide behaviour I want to test. requests is synchronous and can't stream asynchronously. ---"},{"id":"s2-5-retry-with-exponential-backoff-and-jitter-llm-resilience-p","heading":"5. Retry with exponential backoff and jitter (llm/resilience.py)","text":"What it is. A wrapper class ResilientLLMClient around any LLMClient . Why. Providers return 429 and transient 5xx. is_transient_error retries only timeouts, rate limits and 5xx, never 401/403/4xx ( resilience.py:25 ). How it works. Wait = min(min_wait · 2^attempt + U(0, 0.5·min_wait), max_wait) , or the provider's Retry-After when present ( calculate_backoff , line 43). Defaults: 3 retries, 0.5 s to 8 s. For streams, the key rule is lines 123-136: once any token has been yielded, an exception is re-raised without retry, because restarting would duplicate or corrupt text the user already saw. Before the first token it's safe to retry. Why not the alternative. Libraries like tenacity are fine, but the stream rule is domain-specific, and the sleep functions need to be injectable for instant tests. ---"},{"id":"s2-6-pymupdf-fitz","heading":"6. PyMuPDF (fitz)","text":"What it is. Python bindings for MuPDF, a C PDF renderer and text extractor. Why. Fast text extraction with page numbers and no external services. parse_pdf ( ingestion/parser.py ) reads page.get_text(\"text\") per page and marks pages with under 50 characters as low_text . classify.py also reads PDF metadata and the first three pages. How it works. MuPDF parses the PDF's page content streams and font encodings, then reconstructs text in reading order. It extracts embedded text only; scanned pages without a text layer return nothing, which is why I flag low-text pages. Why not the alternative. pdfminer.six is slower and more verbose; PyPDF is weaker at layout. OCR stacks (Tesseract) solve a different problem and aren't in this codebase. Note the licence (AGPL or commercial): worth checking before commercial deployment. ---"},{"id":"s2-7-sentence-transformers-and-all-minilm-l6-v2","heading":"7. Sentence-Transformers and all-MiniLM-L6-v2","text":"What it is. A library for sentence embeddings; all-MiniLM-L6-v2 is a 6-layer, 384-dimensional transformer distilled from MiniLM and trained with contrastive learning on over a billion sentence pairs. It truncates input at 256 word pieces by default. Why. Small and CPU-friendly (about 90 MB), a strong baseline, and it's the default embedding_model . My chunk_max_tokens of 256 lines up with its input limit. It sits behind the Embedder interface ( retrieval/embedder.py ), and I call encode(..., normalize_embeddings=True, batch_size=32) . How it works. The text is tokenised into word pieces, passed through the transformer, and the token outputs are mean-pooled into one vector; normalisation makes it unit length so a dot product equals cosine similarity. Similar meanings land close together in the 384-dimensional space. Why not the alternative. OpenAI embeddings add cost and send text off-box. Larger models (bge, e5-large) are better on benchmarks but slower; I haven't run a bake-off on my real corpus (the bakeoff command exists), so I can't claim MiniLM is optimal. Known limitation: an embedding model doesn't know an acronym the text never contains. That caused the \"DPDP\" failure. ---"},{"id":"s2-8-the-hashing-embedder","heading":"8. The hashing embedder","text":"What it is. A deterministic bag-of-words embedder: each token is MD5-hashed to one of 512 buckets with a ±1 sign, then the vector is L2-normalised ( embedder.py:25-50 ). Why. CI and tests must not download a model. It's explicitly not semantic: it only captures word overlap. How it works. The \"hashing trick\" avoids a vocabulary; the sign bit reduces collision bias. Two texts sharing words have a positive dot product. Why not the alternative. Random vectors don't preserve overlap; a real model needs a download and nondeterministic hardware paths. ---"},{"id":"s2-9-bm25-sparse-retrieval","heading":"9. BM25 (sparse retrieval)","text":"What it is. A ranking function: score = Σ idf(t) · tf·(k1+1) / (tf + k1·(1 − b + b·len/avglen)) . Why. Exact identifiers (\"Section 66A\", \"Data Fiduciary\") matter in law. The in-memory store implements it in pure Python with k1 = 1.5 , b = 0.75 ( memory_store.py:121-143 ); Qdrant uses hashed term counts plus an IDF modifier ( qdrant_store.py:31 ). How it works. Term frequency saturates (diminishing returns for repeats), IDF down-weights common terms, and length normalisation stops long chunks winning by volume. Caveat in my code: I rebuild the term counters and document frequencies on every query, an O(corpus) cost I'd cache. Why not the alternative. Elasticsearch/OpenSearch is more infrastructure than a local project needs. TF-IDF lacks saturation and length normalisation. ---"},{"id":"s2-10-reciprocal-rank-fusion","heading":"10. Reciprocal Rank Fusion","text":"What it is. A rank-aggregation method: RRF(d) = Σ w_i / (k0 + rank_i(d)) with k0 = 60 ( hybrid.py:13-28 ). Why. Combines the dense and sparse lists without calibrating scores. It also keeps the maximum dense score per chunk so the abstention gate still sees a cosine value. How it works. Each list contributes a smaller amount the lower a chunk ranks; chunks that appear in both lists get two contributions. Then cap_per_doc limits each document to 3 results for diversity. Why not the alternative. Weighted score fusion needs normalisation of incomparable scores; learned rankers need training data I don't have. ---"},{"id":"s2-11-qdrant","heading":"11. Qdrant","text":"What it is. An open-source vector database written in Rust. Why. An optional backend ( vector_store_backend=qdrant ) for scale: named vectors ( dense cosine, sparse with IDF), payload filters, and local or server mode. My adapter ( retrieval/qdrant_store.py ) derives deterministic UUID5 point IDs from chunk IDs so upserts overwrite, and stores the config fingerprint in collection metadata. How it works. Dense vectors are indexed with HNSW (a layered proximity graph) for approximate nearest-neighbour search; payload fields marked as keyword indexes make filtered queries ( domain , status , section_or_article_no ) fast. Sparse vectors are stored as index/value lists and scored with a dot product, with Modifier.IDF applying inverse document frequency server-side. Why not the alternative. Chroma/FAISS are fine for prototypes but lack Qdrant's filtering and hybrid support; pgvector ties me to Postgres; Pinecone is hosted-only. I haven't benchmarked them against each other. ---"},{"id":"s2-12-sqlite-embedding-cache","heading":"12. SQLite (embedding cache)","text":"What it is. An embedded, serverless SQL database in a single file (stdlib sqlite3 ). Why. ingestion/cache.py stores emb(model, key, vec) with primary key (model, key) . Re-indexing a changed document only embeds new text; switching models doesn't collide. How it works. WAL-less default journaling, a B-tree on the primary key; reads batch 500 keys per IN (...) query; vectors are stored as JSON text. Why not the alternative. Redis adds a server; a pickle file isn't concurrent-safe or queryable; Postgres is overkill. ---"},{"id":"s2-13-yaml-manifest-and-text-level-editing","heading":"13. YAML manifest and text-level editing","text":"What it is. A human-editable document registry parsed with PyYAML. Why. Metadata needs review in git and manual overrides (marking an Act superseded). manifest_edit.py appends, removes and re-hashes entries as text , so comments and ordering survive. How it works. append_entries detects the list indentation of the existing file and prefixes the dumped entry with a comment; remove_entry finds the entry's block by indentation; replace_file_hash replaces a unique 64-hex string. Why not the alternative. Re-dumping with yaml.safe_dump would drop comments and reorder keys; ruamel.yaml preserves them but adds a dependency. ---"},{"id":"s2-14-asyncio-and-threading","heading":"14. asyncio and threading","text":"What it is. Cooperative concurrency ( asyncio ) plus OS threads for CPU work. Why. The event loop must never block. prepare() (embedding plus search) runs via asyncio.to_thread ; the LLM stream is natively async; background cleanup is an asyncio.create_task . The session store uses asyncio.Lock ; the upload store and metrics use threading.Lock because threads touch them. How it works. to_thread submits to the default thread-pool executor and awaits the future, freeing the loop. A cancelled request raises CancelledError , which I re-raise so cleanup in finally runs and metrics still record. Why not the alternative. Running CPU work directly in the handler would freeze every other request; multiprocessing would complicate in-memory state. ---"},{"id":"s2-15-next-js-react-and-typescript","heading":"15. Next.js, React and TypeScript","text":"What it is. React is a UI library; Next.js a framework on top of it (routing, bundling); TypeScript adds static types. Why. web/ (Next ^16.4.6, React ^19.3.1, TS ^5.9.3) provides Ask, Metrics and Documents pages. Types in lib/types.ts mirror the API's event shapes so changes break the build, not production. CI runs npm run typecheck and npm run build . How it works. The App Router maps app/page.tsx , app/metrics/page.tsx and app/documents/page.tsx to routes; client components keep shared state in a context ( AppContext ); lib/api.ts consumes the SSE stream with a ReadableStream reader. Why not the alternative. The older static page ( frontend/index.html , 134 lines, still served at /ui ) has no types or components. Streamlit/Gradio would be faster to build but harder to customise (clickable citation markers, source panel). ---"},{"id":"s2-16-pytest-pytest-asyncio-ruff-pre-commit-detect-secrets","heading":"16. pytest, pytest-asyncio, ruff, pre-commit, detect-secrets","text":"What it is. Test runner, async test support, a very fast linter and formatter, git hook runner, and a secret scanner. Why. 218 tests in 16 files; asyncio_mode = \"auto\" ; -m \"not slow\" by default so real-model tests are opt-in. ruff check . gates CI. scripts/check_staged.py blocks staging .env . How it works. pytest collects test_ .py , injects fixtures ( conftest.py builds a tmp-path Settings and a fixture corpus indexed with the hashing embedder). Time and sleep are injected, so no test waits. Why not the alternative. unittest is more verbose; flake8 + black + isort is three tools versus ruff. ---"},{"id":"s2-17-uv-hatchling-github-actions","heading":"17. uv, hatchling, GitHub Actions","text":"What it is. uv is a fast Python package manager; hatchling is the build backend; GitHub Actions runs CI. Why. uv sync gives reproducible installs (lock file stale at present, a known item). CI has three jobs: test (ruff, pytest, staged guard, advisory pip-audit , eval smoke gate), web (typecheck, build) and docker (image build). How it works. The eval gate runs python -m legal_rag.eval run --config G1_prompt_v2 ... --min hit@5=0.9 mrr=0.8 abstention_acc=0.9 citation_valid=0.9 on the fixture corpus; a regression fails the job and uploads the report as an artifact. Why not the alternative. pip + requirements.txt has no lock or resolver speed; Poetry works but is slower. ---"},{"id":"s2-18-docker-multi-stage","heading":"18. Docker (multi-stage)","text":"What it is. Container packaging. The Dockerfile has a build stage that installs the package into /install , and a runtime stage on python:3.11-slim that copies it, creates a non-root user (uid 1000), copies data/ , and defines a /health healthcheck. Why. Reproducible deployment; the compose file adds an index-data volume and an ingest profile for one-shot ingestion. How it works. Layers are cached; the slim base and multi-stage copy keep the image small; running as non-root limits blast radius. Honest status. I haven't run the build here. The Dockerfile also installs without the embeddings extra, so the default MiniLM model would fail inside the container until the extra is added. ---"},{"id":"s2-19-llm-llama-3-3-70b-versatile-on-groq","heading":"19. LLM: llama-3.3-70b-versatile on Groq","text":"What it is. A 70-billion-parameter open-weights chat model served on Groq's inference hardware through an OpenAI-compatible API. Why. Fast token streaming and a free tier suit a demo. Defaults: temperature 0.1 (low variance for factual answers), max_tokens 2,048, 30 s timeout. How it works. I send a system prompt containing the numbered passages inside \u003cpassages ...\u003c/passages and the user's question; the model generates tokens autoregressively, which I forward as SSE token events. Why not the alternative. GPT/Claude are strong but paid; a local model would need a GPU. The provider is behind LLMClient , so switching is a small adapter. ---"},{"id":"s2-cheat-sheet","heading":"Cheat sheet","text":"Technology Category One-liner \"Why not X?\" --- --- --- --- FastAPI / Uvicorn Web framework / server Async ASGI with validation and OpenAPI Flask is WSGI: no native async streaming SSE Streaming protocol One-way text frames over HTTP WebSockets add bidirectional state I don't need Pydantic v2 / pydantic-settings Validation / config Typed models and env-driven settings dataclasses don't validate httpx HTTP client Async client; easy to mock with MockTransport requests is sync; SDKs hide behaviour Retry with jitter Resilience Retry only transient errors, never mid-stream Generic retry would duplicate streamed text PyMuPDF PDF parsing Fast, page-aware text extraction pdfminer slower; OCR is a different problem all-MiniLM-L6-v2 Dense embeddings 384-d, 256-token, CPU-friendly Larger models are slower; no bake-off run yet Hashing embedder Test embeddings Deterministic bag-of-words, 512-d A real model needs a download in CI BM25 Sparse retrieval tf saturation, idf, length norm TF-IDF lacks saturation and normalisation RRF (k0=60) Rank fusion Sum of 1/(60+rank) Score mixing needs calibration Qdrant Vector DB HNSW dense + IDF sparse + payload filters pgvector ties to Postgres; Pinecone is hosted only SQLite Cache Embedding cache keyed by model + hash Redis needs a server YAML manifest Registry Source of truth, edited as text Re-dumping loses comments asyncio + threads Concurrency Event loop for I/O, threads for CPU CPU in handlers would block all requests Next.js / React / TS UI Typed streaming interface Streamlit is harder to customise pytest / ruff / pre-commit Quality 218 tests, lint, secret guard flake8+black+isort = three tools uv / GitHub Actions Tooling / CI Fast installs, 3-job pipeline with eval gate pip lacks a lock and resolver speed Docker multi-stage Packaging Slim non-root image with healthcheck Never built here; missing embeddings extra llama-3.3-70b on Groq LLM Fast streaming, temp 0.1 Paid APIs cost; local needs a GPU"}]},{"title":"System Design","file":"INTERVIEW_SYSTEM_DESIGN.md","html":"\u003ch1 id=\"s3-system-design-and-scaling\">System Design and Scaling\u003c/h1>\n\u003cp>Numbers marked \u003cstrong>(measured)\u003c/strong> come from this repo or from my real run. Numbers marked \u003cstrong>(estimate)\u003c/strong> are back-of-envelope and should be presented as such.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s3-1-current-architecture-topology\">1. Current architecture (topology)\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\"> Browser (Next.js :3010 / static /ui)\n        │  HTTPS, SSE\n        ▼\n ┌──────────────────────────────── 1 process (uvicorn, 1 worker) ─────────────────────────────┐\n │  Middleware: RequestID → AbuseControl (per-IP 60/min, body ≤ 1 MB, upload ≤ 5 MB) → CORS   │\n │  FastAPI routes                                                                            │\n │     │ asyncio.to_thread                  │ async                                           │\n │     ▼                                    ▼                                                 │\n │  Pipeline.prepare()                  LLM stream (ResilientLLMClient → GroqClient)          │\n │   ├ understand (rules)                   │ httpx → Groq API (external, internet)           │\n │   ├ embed query (MiniLM, in-process)     │                                                 │\n │   ├ dense scan + BM25 (in-memory store, ~27k chunks)                                       │\n │   └ RRF → cap → pin sections → gate                                                        │\n │                                                                                            │\n │  In-process state: sessions (TTL 3600s, ≤1000) · uploads (TTL 1800s, ≤50) · metrics        │\n │  (last 1000 samples/stage) · rate-limit windows                                            │\n └───────────────┬────────────────────────────────────────────────────────────────────────────┘\n                 │ files\n   data/processed/index.json (chunks + vectors) · data/cache/embeddings.sqlite\n   data/manifest.yaml · data/raw/{legal,banking}/*.pdf · data/processed/feedback.jsonl\u003c/code>\u003c/pre>\n\u003cp>Offline: \u003ccode>python -m legal_rag.ingestion sync\u003c/code> writes the same files; \u003ccode>AUTO_SYNC_ON_STARTUP=true\u003c/code> runs it inside start-up.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s3-2-bottleneck-analysis\">2. Bottleneck analysis\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Component\u003c/th>\u003cth>Limit / single point of failure\u003c/th>\u003cth>Evidence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Single uvicorn process\u003c/td>\u003ctd>One process, one machine: no redundancy; a crash drops every session and upload\u003c/td>\u003ctd>\u003ccode>api/main.py\u003c/code> builds all state in \u003ccode>app.state\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>LLM provider (Groq)\u003c/td>\u003ctd>External dependency; dominates latency (generation p50 about 1.1 s of 1.14 s total)\u003c/td>\u003ctd>Metrics screenshot, 3 requests \u003cstrong>(measured)\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Dense search\u003c/td>\u003ctd>Full scan, O(N·d) per query in pure Python (\u003ccode>memory_store.py:111-119\u003c/code>)\u003c/td>\u003ctd>code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>BM25\u003c/td>\u003ctd>Term counters and document frequencies rebuilt per query over all chunks (\u003ccode>memory_store.py:126-129\u003c/code>)\u003c/td>\u003ctd>code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Index load\u003c/td>\u003ctd>Whole \u003ccode>index.json\u003c/code> read and held in RAM at start (\u003ccode>InMemoryVectorStore.load\u003c/code>)\u003c/td>\u003ctd>code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Embedding model\u003c/td>\u003ctd>Loaded in every process; CPU inference for each query (and each upload chunk)\u003c/td>\u003ctd>\u003ccode>embedder.py\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Sessions / uploads\u003c/td>\u003ctd>Process-local; lost on restart; not shared across replicas\u003c/td>\u003ctd>\u003ccode>sessions.py\u003c/code>, \u003ccode>uploads.py\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Rate limiter and metrics\u003c/td>\u003ctd>Per-process dicts; limits multiply with replicas\u003c/td>\u003ctd>\u003ccode>security.py\u003c/code>, \u003ccode>metrics.py\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>File writes\u003c/td>\u003ctd>Feedback appended to a local JSONL; trace lookup scans a file linearly\u003c/td>\u003ctd>\u003ccode>routes.py:236\u003c/code>, \u003ccode>tracing.py:44\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Ingestion\u003c/td>\u003ctd>Single-threaded, embeds sequentially in batches of 64\u003c/td>\u003ctd>\u003ccode>indexer.py:_embed\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>11\u003c/td>\u003ctd>Observed retrieval spread\u003c/td>\u003ctd>Median 38 ms but p95 2.5 s in 3 samples, unexplained \u003cstrong>(measured)\u003c/strong>\u003c/td>\u003ctd>Metrics screenshot\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"s3-3-scaling-strategies-per-bottleneck\">3. Scaling strategies per bottleneck\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Bottleneck\u003c/th>\u003cth>Strategy\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1 Single process\u003c/td>\u003ctd>Several uvicorn workers or replicas behind a load balancer; health from \u003ccode>/health\u003c/code>, traffic gating from \u003ccode>/ready\u003c/code>\u003c/td>\u003ctd>Needs 7 and 8 solved first\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 LLM latency\u003c/td>\u003ctd>Stream (done), cap \u003ccode>max_tokens\u003c/code>, shorter context, response cache for repeated questions, provider fallback behind \u003ccode>LLMClient\u003c/code>\u003c/td>\u003ctd>A cache needs a key of (question, corpus fingerprint, prompt version)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 Dense scan\u003c/td>\u003ctd>Qdrant (already an adapter) with HNSW ANN; or NumPy matrix multiply as a cheap first step\u003c/td>\u003ctd>NumPy over 27k×384 float32 is a single matrix-vector product\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4 BM25\u003c/td>\u003ctd>Build and cache statistics at index load; update incrementally on upsert; or use Qdrant sparse\u003c/td>\u003ctd>Removes per-query O(corpus)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5 Index load\u003c/td>\u003ctd>Use Qdrant server mode; or memory-map vectors\u003c/td>\u003ctd>Memory store is for local use\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 Embedding\u003c/td>\u003ctd>Batch queries, ONNX or quantised model, or a dedicated embedding service; GPU if QPS justifies\u003c/td>\u003ctd>Keep the \u003ccode>Embedder\u003c/code> interface\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7 Sessions\u003c/td>\u003ctd>Redis with TTL (interface \u003ccode>SessionStore\u003c/code> already abstract)\u003c/td>\u003ctd>\u003ccode>InMemorySessionStore\u003c/code> is one implementation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8 Rate limit/metrics\u003c/td>\u003ctd>Redis counters at the gateway; Prometheus for metrics\u003c/td>\u003ctd>Don't rely on per-process counts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9 Files\u003c/td>\u003ctd>Append to a queue or database; index traces by request ID\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10 Ingestion\u003c/td>\u003ctd>Worker pool for parse and embed; keep the embedding cache; batch up to model limits\u003c/td>\u003ctd>Already idempotent, so safe to parallelise by document\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Corpus growth\u003c/td>\u003ctd>Shard by domain (legal/banking) or by document family; filters already exist\u003c/td>\u003ctd>Payload indexes are created for 6 fields\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"s3-4-target-architectures\">4. Target architectures\u003c/h2>\n\u003ch3 id=\"s3-4-1-today-10x-about-300k-chunks-tens-of-concurrent-users\">4.1 Today → 10x (about 300k chunks, tens of concurrent users)\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-\"> Users ─► CDN/Vercel (Next.js) ─► API (3 replicas) ─► Qdrant (1 node, HNSW)\n                                     │                    ▲\n                                     ├──► Redis (sessions, uploads index refs, rate limit)\n                                     ├──► Groq API (retry/backoff, fallback provider)\n                                     └──► Embedding model in-process (CPU)\n Ingestion job (worker) ──► embeddings cache (shared volume/SQLite→Postgres) ──► Qdrant\u003c/code>\u003c/pre>\n\u003cp>Changes: Qdrant instead of the memory store; Redis for session and rate-limit state; build the BM25 index once or use Qdrant sparse; add a cross-encoder reranker over the top 30 only if the measured precision demands it.\u003c/p>\n\u003ch3 id=\"s3-4-2-100x-about-3m-chunks-hundreds-of-concurrent-users\">4.2 100x (about 3M chunks, hundreds of concurrent users)\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-\"> Users ─► CDN ─► API Gateway (auth, global rate limit, request IDs)\n                      │\n              ┌───────┴────────┐\n              ▼                ▼\n        API pods (N, autoscaled on RPS)     Embedding service (GPU/ONNX, batched)\n              │  │  │                              ▲\n              │  │  └─► Redis cluster (sessions, cache) │\n              │  └────► Qdrant cluster (sharded by domain, replicated)\n              └──────► LLM gateway (queue, quotas, provider fallback, response cache)\n Ingestion pipeline: object storage (PDFs) → queue → parse/embed workers → Qdrant\n Observability: Prometheus + Grafana, trace store keyed by request ID, eval-in-CI + nightly golden run\u003c/code>\u003c/pre>\n\u003ch3 id=\"s3-4-3-1000x-about-30m-chunks-thousands-of-concurrent-users\">4.3 1000x (about 30M chunks, thousands of concurrent users)\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-\"> Global CDN ─► Regional gateways ─► Stateless API fleet (multi-region)\n                                       │\n        ┌──────────────┬───────────────┼───────────────┬────────────────┐\n        ▼              ▼               ▼               ▼                ▼\n   Query cache     Embedding      Qdrant shards    LLM routing       Feedback/trace\n   (semantic +     fleet (GPU)    (per domain +    (multi-provider,  pipeline (Kafka →\n   exact)                         per doc family)  self-hosted tier) warehouse)\n Corpus: versioned snapshots, blue/green index swaps keyed by config fingerprint\n Eval: continuous regression runs on a frozen golden set; answer sampling by judge model\u003c/code>\u003c/pre>\n\u003cp>Fingerprint-based swaps matter here: build the new index offline under a new fingerprint, validate, then switch traffic, instead of mutating the live index.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s3-5-failure-scenarios\">5. Failure scenarios\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>What fails\u003c/th>\u003cth>What happens today\u003c/th>\u003cth>What I'd do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Groq returns 429 or 5xx before the first token\u003c/td>\u003ctd>\u003ccode>ResilientLLMClient\u003c/code> retries up to 3 times with backoff and \u003ccode>Retry-After\u003c/code>; then SSE \u003ccode>error\u003c/code> \u003ccode>LLM_ERROR\u003c/code>\u003c/td>\u003ctd>Fallback provider; surface \"try again\" in the UI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Groq fails mid-stream\u003c/td>\u003ctd>No retry; error propagates; client shows partial text plus an error event\u003c/td>\u003ctd>Mark the partial answer unverified in the UI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invalid or missing API key\u003c/td>\u003ctd>\u003ccode>LLMAuthError\u003c/code>; \u003ccode>/ready\u003c/code> reports \u003ccode>llm: not_ready\u003c/code>\u003c/td>\u003ctd>Alert on readiness\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Embedding model fails to load\u003c/td>\u003ctd>Startup catches it, components become placeholders, \u003ccode>/ready\u003c/code> 503, \u003ccode>/v1/ask\u003c/code> 503\u003c/td>\u003ctd>Alert; fall back to sparse-only mode (not implemented)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Index file missing\u003c/td>\u003ctd>Same as above, or \u003ccode>AUTO_SYNC_ON_STARTUP\u003c/code> builds it\u003c/td>\u003ctd>Bake the index into the image\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Index built with a different embedder\u003c/td>\u003ctd>Sync refuses (\"run sync --force\"), but the API can still load and serve the stale file\u003c/td>\u003ctd>Make the mismatch fail readiness\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Process crash\u003c/td>\u003ctd>All sessions, uploads and metrics lost\u003c/td>\u003ctd>Redis for sessions; restart policy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disk full\u003c/td>\u003ctd>Feedback write raises inside a thread; ask path unaffected\u003c/td>\u003ctd>Alert on disk; send feedback to a queue\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qdrant down (if used)\u003c/td>\u003ctd>Store calls raise, ask returns \u003ccode>STREAM_ERROR\u003c/code>; \u003ccode>/ready\u003c/code> only checks local flags\u003c/td>\u003ctd>Make \u003ccode>/ready\u003c/code> ping the store; circuit breaker\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Malformed or huge upload\u003c/td>\u003ctd>413/415/422 before indexing; temp dir removed even on failure\u003c/td>\u003ctd>Virus scanning if public\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Abusive client\u003c/td>\u003ctd>429 with \u003ccode>Retry-After\u003c/code>; per-IP window\u003c/td>\u003ctd>Gateway-level limits, authenticated quotas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Slow client on SSE\u003c/td>\u003ctd>Server writes back-pressured by the transport\u003c/td>\u003ctd>Timeout idle streams\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"s3-6-capacity-planning-back-of-envelope\">6. Capacity planning (back-of-envelope)\u003c/h2>\n\u003cp>\u003cstrong>Index size\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Chunks \u003cstrong>26,974 (measured)\u003c/strong>, average text 75 to 169 tokens, about 640 characters average on one document \u003cstrong>(measured)\u003c/strong>.\u003c/li>\u003cli>Vectors: 26,974 × 384 floats = 10.36M floats. As float32 that's about 41 MB \u003cstrong>(estimate)\u003c/strong>. Held as Python lists of floats, roughly 8 B pointer + 24 B float object per value, about 330 MB \u003cstrong>(estimate)\u003c/strong>.\u003c/li>\u003cli>\u003ccode>index.json\u003c/code> stores vectors as JSON text, on the order of 150 to 250 MB \u003cstrong>(estimate)\u003c/strong>; load time scales with it.\u003c/li>\u003cli>Scale to 10x (270k chunks): about 410 MB as float32, which is why Qdrant (compact float32 + HNSW) is the next step.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Latency budget\u003c/strong> (3-request sample, \u003cstrong>measured\u003c/strong>): total p50 1,144 ms = generation 1,105 + retrieval 38 + understanding 0.1. The LLM is about 97% of the budget at p50.\u003c/p>\n\u003cp>\u003cstrong>Throughput\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Load test with a fake 20 ms/token LLM and a 4-document corpus: \u003cstrong>8.8 req/s at 10 clients, 0 errors (measured)\u003c/strong>. That tests the API layer, not the real model.\u003c/li>\u003cli>For the real system, concurrency is bounded by (a) provider rate limits, (b) CPU for query embedding and dense search in threads, (c) the default rate limit of 60 requests per minute per IP.\u003c/li>\u003cli>Rule of thumb: concurrent in-flight requests ≈ QPS × latency. At 5 QPS and about 1.5 s per request, about 8 requests are in flight; async handles that easily, but each needs a retrieval thread slice.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Memory per replica (estimate):\u003c/strong> index (about 0.3 to 0.5 GB at 27k chunks) + MiniLM and its runtime (hundreds of MB) + Python overhead; plan 1 to 2 GB per replica for the current corpus.\u003c/p>\n\u003cp>\u003cstrong>Ingestion time\u003c/strong>\u003c/p>\n\u003cul>\u003cli>My first real sync of 10 PDFs on the repo's hashing embedder produced 12,828 chunks in about 19 s \u003cstrong>(measured, hashing embedder)\u003c/strong>; a second run that skipped everything took about 4 s \u003cstrong>(measured)\u003c/strong>. With MiniLM on CPU, embedding dominates and the model download adds a one-time cost.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Cost model.\u003c/strong> Cost per question ≈ input tokens (≤ 12,000 characters of context, about 3,000 tokens \u003cstrong>(estimate)\u003c/strong> plus the question) + output up to 2,048 tokens. I haven't measured the cost per query (\u003ccode>price_in_per_1k\u003c/code> and \u003ccode>price_out_per_1k\u003c/code> exist in settings but are 0 by default).\u003c/p>","toc":[{"level":2,"text":"1. Current architecture (topology)","id":"s3-1-current-architecture-topology"},{"level":2,"text":"2. Bottleneck analysis","id":"s3-2-bottleneck-analysis"},{"level":2,"text":"3. Scaling strategies per bottleneck","id":"s3-3-scaling-strategies-per-bottleneck"},{"level":2,"text":"4. Target architectures","id":"s3-4-target-architectures"},{"level":3,"text":"4.1 Today → 10x (about 300k chunks, tens of concurrent users)","id":"s3-4-1-today-10x-about-300k-chunks-tens-of-concurrent-users"},{"level":3,"text":"4.2 100x (about 3M chunks, hundreds of concurrent users)","id":"s3-4-2-100x-about-3m-chunks-hundreds-of-concurrent-users"},{"level":3,"text":"4.3 1000x (about 30M chunks, thousands of concurrent users)","id":"s3-4-3-1000x-about-30m-chunks-thousands-of-concurrent-users"},{"level":2,"text":"5. Failure scenarios","id":"s3-5-failure-scenarios"},{"level":2,"text":"6. Capacity planning (back-of-envelope)","id":"s3-6-capacity-planning-back-of-envelope"}],"entries":[{"id":"s3-system-design-and-scaling","heading":"System Design and Scaling","text":"Numbers marked (measured) come from this repo or from my real run. Numbers marked (estimate) are back-of-envelope and should be presented as such. ---"},{"id":"s3-1-current-architecture-topology","heading":"1. Current architecture (topology)","text":"Browser (Next.js :3010 / static /ui) │ HTTPS, SSE ▼ ┌──────────────────────────────── 1 process (uvicorn, 1 worker) ─────────────────────────────┐ │ Middleware: RequestID → AbuseControl (per-IP 60/min, body ≤ 1 MB, upload ≤ 5 MB) → CORS │ │ FastAPI routes │ │ │ asyncio.to_thread │ async │ │ ▼ ▼ │ │ Pipeline.prepare() LLM stream (ResilientLLMClient → GroqClient) │ │ ├ understand (rules) │ httpx → Groq API (external, internet) │ │ ├ embed query (MiniLM, in-process) │ │ │ ├ dense scan + BM25 (in-memory store, ~27k chunks) │ │ └ RRF → cap → pin sections → gate │ │ │ │ In-process state: sessions (TTL 3600s, ≤1000) · uploads (TTL 1800s, ≤50) · metrics │ │ (last 1000 samples/stage) · rate-limit windows │ └───────────────┬────────────────────────────────────────────────────────────────────────────┘ │ files data/processed/index.json (chunks + vectors) · data/cache/embeddings.sqlite data/manifest.yaml · data/raw/{legal,banking}/ .pdf · data/processed/feedback.jsonl Offline: python -m legal_rag.ingestion sync writes the same files; AUTO_SYNC_ON_STARTUP=true runs it inside start-up. ---"},{"id":"s3-2-bottleneck-analysis","heading":"2. Bottleneck analysis","text":"Component Limit / single point of failure Evidence --- --- --- --- 1 Single uvicorn process One process, one machine: no redundancy; a crash drops every session and upload api/main.py builds all state in app.state 2 LLM provider (Groq) External dependency; dominates latency (generation p50 about 1.1 s of 1.14 s total) Metrics screenshot, 3 requests (measured) 3 Dense search Full scan, O(N·d) per query in pure Python ( memory_store.py:111-119 ) code 4 BM25 Term counters and document frequencies rebuilt per query over all chunks ( memory_store.py:126-129 ) code 5 Index load Whole index.json read and held in RAM at start ( InMemoryVectorStore.load ) code 6 Embedding model Loaded in every process; CPU inference for each query (and each upload chunk) embedder.py 7 Sessions / uploads Process-local; lost on restart; not shared across replicas sessions.py , uploads.py 8 Rate limiter and metrics Per-process dicts; limits multiply with replicas security.py , metrics.py 9 File writes Feedback appended to a local JSONL; trace lookup scans a file linearly routes.py:236 , tracing.py:44 10 Ingestion Single-threaded, embeds sequentially in batches of 64 indexer.py:_embed 11 Observed retrieval spread Median 38 ms but p95 2.5 s in 3 samples, unexplained (measured) Metrics screenshot ---"},{"id":"s3-3-scaling-strategies-per-bottleneck","heading":"3. Scaling strategies per bottleneck","text":"Bottleneck Strategy Notes --- --- --- 1 Single process Several uvicorn workers or replicas behind a load balancer; health from /health , traffic gating from /ready Needs 7 and 8 solved first 2 LLM latency Stream (done), cap max_tokens , shorter context, response cache for repeated questions, provider fallback behind LLMClient A cache needs a key of (question, corpus fingerprint, prompt version) 3 Dense scan Qdrant (already an adapter) with HNSW ANN; or NumPy matrix multiply as a cheap first step NumPy over 27k×384 float32 is a single matrix-vector product 4 BM25 Build and cache statistics at index load; update incrementally on upsert; or use Qdrant sparse Removes per-query O(corpus) 5 Index load Use Qdrant server mode; or memory-map vectors Memory store is for local use 6 Embedding Batch queries, ONNX or quantised model, or a dedicated embedding service; GPU if QPS justifies Keep the Embedder interface 7 Sessions Redis with TTL (interface SessionStore already abstract) InMemorySessionStore is one implementation 8 Rate limit/metrics Redis counters at the gateway; Prometheus for metrics Don't rely on per-process counts 9 Files Append to a queue or database; index traces by request ID 10 Ingestion Worker pool for parse and embed; keep the embedding cache; batch up to model limits Already idempotent, so safe to parallelise by document Corpus growth Shard by domain (legal/banking) or by document family; filters already exist Payload indexes are created for 6 fields ---"},{"id":"s3-4-1-today-10x-about-300k-chunks-tens-of-concurrent-users","heading":"4.1 Today → 10x (about 300k chunks, tens of concurrent users)","text":"Users ─► CDN/Vercel (Next.js) ─► API (3 replicas) ─► Qdrant (1 node, HNSW) │ ▲ ├──► Redis (sessions, uploads index refs, rate limit) ├──► Groq API (retry/backoff, fallback provider) └──► Embedding model in-process (CPU) Ingestion job (worker) ──► embeddings cache (shared volume/SQLite→Postgres) ──► Qdrant Changes: Qdrant instead of the memory store; Redis for session and rate-limit state; build the BM25 index once or use Qdrant sparse; add a cross-encoder reranker over the top 30 only if the measured precision demands it."},{"id":"s3-4-2-100x-about-3m-chunks-hundreds-of-concurrent-users","heading":"4.2 100x (about 3M chunks, hundreds of concurrent users)","text":"Users ─► CDN ─► API Gateway (auth, global rate limit, request IDs) │ ┌───────┴────────┐ ▼ ▼ API pods (N, autoscaled on RPS) Embedding service (GPU/ONNX, batched) │ │ │ ▲ │ │ └─► Redis cluster (sessions, cache) │ │ └────► Qdrant cluster (sharded by domain, replicated) └──────► LLM gateway (queue, quotas, provider fallback, response cache) Ingestion pipeline: object storage (PDFs) → queue → parse/embed workers → Qdrant Observability: Prometheus + Grafana, trace store keyed by request ID, eval-in-CI + nightly golden run"},{"id":"s3-4-3-1000x-about-30m-chunks-thousands-of-concurrent-users","heading":"4.3 1000x (about 30M chunks, thousands of concurrent users)","text":"Global CDN ─► Regional gateways ─► Stateless API fleet (multi-region) │ ┌──────────────┬───────────────┼───────────────┬────────────────┐ ▼ ▼ ▼ ▼ ▼ Query cache Embedding Qdrant shards LLM routing Feedback/trace (semantic + fleet (GPU) (per domain + (multi-provider, pipeline (Kafka → exact) per doc family) self-hosted tier) warehouse) Corpus: versioned snapshots, blue/green index swaps keyed by config fingerprint Eval: continuous regression runs on a frozen golden set; answer sampling by judge model Fingerprint-based swaps matter here: build the new index offline under a new fingerprint, validate, then switch traffic, instead of mutating the live index. ---"},{"id":"s3-5-failure-scenarios","heading":"5. Failure scenarios","text":"What fails What happens today What I'd do --- --- --- Groq returns 429 or 5xx before the first token ResilientLLMClient retries up to 3 times with backoff and Retry-After ; then SSE error LLM_ERROR Fallback provider; surface \"try again\" in the UI Groq fails mid-stream No retry; error propagates; client shows partial text plus an error event Mark the partial answer unverified in the UI Invalid or missing API key LLMAuthError ; /ready reports llm: not_ready Alert on readiness Embedding model fails to load Startup catches it, components become placeholders, /ready 503, /v1/ask 503 Alert; fall back to sparse-only mode (not implemented) Index file missing Same as above, or AUTO_SYNC_ON_STARTUP builds it Bake the index into the image Index built with a different embedder Sync refuses (\"run sync --force\"), but the API can still load and serve the stale file Make the mismatch fail readiness Process crash All sessions, uploads and metrics lost Redis for sessions; restart policy Disk full Feedback write raises inside a thread; ask path unaffected Alert on disk; send feedback to a queue Qdrant down (if used) Store calls raise, ask returns STREAM_ERROR ; /ready only checks local flags Make /ready ping the store; circuit breaker Malformed or huge upload 413/415/422 before indexing; temp dir removed even on failure Virus scanning if public Abusive client 429 with Retry-After ; per-IP window Gateway-level limits, authenticated quotas Slow client on SSE Server writes back-pressured by the transport Timeout idle streams ---"},{"id":"s3-6-capacity-planning-back-of-envelope","heading":"6. Capacity planning (back-of-envelope)","text":"Index size - Chunks 26,974 (measured) , average text 75 to 169 tokens, about 640 characters average on one document (measured) . - Vectors: 26,974 × 384 floats = 10.36M floats. As float32 that's about 41 MB (estimate) . Held as Python lists of floats, roughly 8 B pointer + 24 B float object per value, about 330 MB (estimate) . - index.json stores vectors as JSON text, on the order of 150 to 250 MB (estimate) ; load time scales with it. - Scale to 10x (270k chunks): about 410 MB as float32, which is why Qdrant (compact float32 + HNSW) is the next step. Latency budget (3-request sample, measured ): total p50 1,144 ms = generation 1,105 + retrieval 38 + understanding 0.1. The LLM is about 97% of the budget at p50. Throughput - Load test with a fake 20 ms/token LLM and a 4-document corpus: 8.8 req/s at 10 clients, 0 errors (measured) . That tests the API layer, not the real model. - For the real system, concurrency is bounded by (a) provider rate limits, (b) CPU for query embedding and dense search in threads, (c) the default rate limit of 60 requests per minute per IP. - Rule of thumb: concurrent in-flight requests ≈ QPS × latency. At 5 QPS and about 1.5 s per request, about 8 requests are in flight; async handles that easily, but each needs a retrieval thread slice. Memory per replica (estimate): index (about 0.3 to 0.5 GB at 27k chunks) + MiniLM and its runtime (hundreds of MB) + Python overhead; plan 1 to 2 GB per replica for the current corpus. Ingestion time - My first real sync of 10 PDFs on the repo's hashing embedder produced 12,828 chunks in about 19 s (measured, hashing embedder) ; a second run that skipped everything took about 4 s (measured) . With MiniLM on CPU, embedding dominates and the model download adds a one-time cost. Cost model. Cost per question ≈ input tokens (≤ 12,000 characters of context, about 3,000 tokens (estimate) plus the question) + output up to 2,048 tokens. I haven't measured the cost per query ( price_in_per_1k and price_out_per_1k exist in settings but are 0 by default)."}]},{"title":"Whiteboard","file":"INTERVIEW_WHITEBOARD.md","html":"\u003ch1 id=\"s4-whiteboard-and-visual-playbook\">Whiteboard and Visual Playbook\u003c/h1>\n\u003ch2 id=\"s4-quick-reference-what-to-draw-when\">Quick reference: what to draw when\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interviewer says\u003c/th>\u003cth>Draw\u003c/th>\u003cth>Time\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\"Give me the architecture\"\u003c/td>\u003ctd>Diagram 1: system architecture\u003c/td>\u003ctd>2 min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"Walk me through a request\"\u003c/td>\u003ctd>Diagram 2: request lifecycle (sequence)\u003c/td>\u003ctd>2 min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"How does data get in?\"\u003c/td>\u003ctd>Diagram 3: ingestion and sync flow\u003c/td>\u003ctd>2 min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"What does your data look like?\"\u003c/td>\u003ctd>Diagram 4: manifest, chunk and index schema\u003c/td>\u003ctd>1.5 min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"How would this scale?\"\u003c/td>\u003ctd>Diagram 5: scaling path\u003c/td>\u003ctd>2.5 min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"What if X fails?\"\u003c/td>\u003ctd>Diagram 6: failure handling\u003c/td>\u003ctd>2 min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"Why hybrid / why this store?\"\u003c/td>\u003ctd>Diagram 7: trade-off comparison\u003c/td>\u003ctd>1.5 min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"How do you chunk legal text?\"\u003c/td>\u003ctd>Diagram 8: chunking decision tree\u003c/td>\u003ctd>1.5 min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"Explain rank fusion\"\u003c/td>\u003ctd>Diagram 9: RRF worked example\u003c/td>\u003ctd>1 min\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Rule: always draw boxes left to right (user → API → pipeline → stores), name each box with the file that implements it, and finish by marking the one weak spot you'd fix first.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s4-diagram-1-system-architecture\">Diagram 1: System architecture\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\">   ┌──────────┐   SSE    ┌───────────────────────────┐        ┌──────────────┐\n   │ Browser  │◄────────►│ FastAPI (api/main.py)     │───────►│ Groq LLM     │\n   │ Next.js  │  POST    │  middleware → routes      │ stream │ (external)   │\n   └──────────┘          └───────────┬───────────────┘        └──────────────┘\n                                     │ prepare() in thread\n                          ┌──────────▼───────────┐\n                          │ RAGPipeline          │\n                          │ understand→retrieve  │\n                          │ →gate→prompt→validate│\n                          └──────────┬───────────┘\n                    ┌────────────────┴───────────────┐\n              ┌─────▼──────┐                   ┌─────▼──────┐\n              │ Embedder   │                   │ VectorStore│\n              │ MiniLM     │                   │ memory|Qdrant\n              └────────────┘                   └─────▲──────┘\n                                                     │ upsert\n   data/raw/*.pdf ─► sync ─► classify ─► chunk ─► embed (SQLite cache)\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Drawing order\u003c/strong>\u003c/p>\n\u003col>\u003cli>Draw the Browser box on the left and the Groq box on the far right.\u003c/li>\u003cli>Draw the FastAPI box in the middle; write \"middleware: request ID, rate limit, CORS\" inside it.\u003c/li>\u003cli>Draw the arrow Browser ↔ FastAPI labelled \"POST /v1/ask, SSE tokens back\".\u003c/li>\u003cli>Draw RAGPipeline under FastAPI with its five stages.\u003c/li>\u003cli>Draw Embedder and VectorStore under the pipeline; write \"memory | Qdrant\" on the store.\u003c/li>\u003cli>Draw the ingestion path along the bottom feeding the store.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Narration.\u003c/strong> \"A question goes from the browser to FastAPI. After rate-limit and size checks, the pipeline rewrites the question, embeds it, searches the store, decides whether the evidence is good enough, and only then calls Groq. Tokens stream back over SSE. Offline, \u003ccode>sync\u003c/code> turns PDFs into chunks and vectors in the same store.\"\u003c/p>\n\u003chr>\n\u003ch2 id=\"s4-diagram-2-request-lifecycle\">Diagram 2: Request lifecycle\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\">Browser        API/middleware      Pipeline            Store        Groq\n  │ POST /v1/ask    │                 │                  │            │\n  ├────────────────►│ id, rate, size  │                  │            │\n  │                 ├────────────────►│ understand       │            │\n  │                 │                 ├─ dense+BM25 ────►│            │\n  │                 │                 │◄── results ──────┤            │\n  │                 │                 │ RRF→cap→pin      │            │\n  │                 │                 │ best dense &lt; thr?│            │\n  │◄─ abstained ────┤◄── abstain ─────┤  (yes: stop)     │            │\n  │                 │                 │ build prompt [1..n]           │\n  │                 ├──────────────── stream ───────────────────────►│\n  │◄── token ×N ────┤◄──────────── tokens ──────────────────────────┤\n  │                 │ validate [n] against passages                  │\n  │◄─ citations ────┤  (strip invalid, add currency notes)           │\n  │◄─ done ─────────┤  (latency, request_id, disclaimer)             │\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Drawing order\u003c/strong>\u003c/p>\n\u003col>\u003cli>Draw five vertical lifelines: Browser, API, Pipeline, Store, Groq.\u003c/li>\u003cli>Draw the request arrow and label the middleware checks.\u003c/li>\u003cli>Draw understand → retrieve → results.\u003c/li>\u003cli>Draw the diamond-style decision \"best dense score &lt; threshold?\" with the early \u003ccode>abstained\u003c/code> branch.\u003c/li>\u003cli>Draw the Groq stream and the token arrows back to the browser.\u003c/li>\u003cli>Draw the last two events: \u003ccode>citations\u003c/code> then \u003ccode>done\u003c/code>.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Narration.\u003c/strong> \"Everything before the LLM is deterministic and cheap: rules, an embedding, two searches, a gate. That's why abstention costs nothing in tokens. After streaming, I validate citation numbers server-side and send the cleaned answer in the \u003ccode>citations\u003c/code> event.\"\u003c/p>\n\u003chr>\n\u003ch2 id=\"s4-diagram-3-ingestion-and-sync-flow\">Diagram 3: Ingestion and sync flow\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\"> data/raw/{legal,banking}/*.pdf|txt        (drop files here)\n            │\n            ▼\n   discover (recursive) ──► known? (manifest path)\n            │ no                       │ yes\n            ▼                          ▼\n   classify.py                 hash changed?\n   domain/type/title/year        │yes        │no\n            │                    ▼           ▼\n   append to manifest      refresh hash     SKIP\n   (text, keeps edits)           │\n            └─────────┬──────────┘\n                      ▼\n              validate manifest\n                      ▼\n          fingerprint == index?  ──no──► \"run sync --force\"\n                      │yes\n                      ▼\n   parse (PyMuPDF) → normalize JSON → chunk (s0..s3) → embed (SQLite cache)\n                      ▼\n           upsert NEW chunks → delete STALE chunks → persist index\n                      ▼\n        summary: added / updated / skipped / removed / low-text / chunks\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Drawing order.\u003c/strong> (1) the folder at the top; (2) the \"known?\" fork; (3) the classify branch on the left; (4) the hash branch on the right; (5) validation and the fingerprint diamond; (6) the four processing boxes in a row; (7) the safe-order write; (8) the summary.\u003c/p>\n\u003cp>\u003cstrong>Narration.\u003c/strong> \"I made ingestion idempotent and incremental. A file is processed only if it's new or its hash changed. A config fingerprint refuses to mix embedders. New chunks are written before stale ones are deleted, so a crash never leaves a document empty.\"\u003c/p>\n\u003chr>\n\u003ch2 id=\"s4-diagram-4-data-model\">Diagram 4: Data model\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\"> manifest.yaml (source of truth)           data/processed/&lt;doc_id&gt;.json\n ┌───────────────────────────┐             ┌────────────────────────┐\n │ doc_id (slug, PK)         │             │ pages[ blocks[type,text]]\n │ title, doc_type, domain   │──parse────► │ stats{low_text_pages}  │\n │ path, file_hash (sha256)  │             │ source_file_hash       │\n │ status, superseded_by     │             │ parser_version         │\n │ year, source_url, ...     │             └───────────┬────────────┘\n └─────────────┬─────────────┘                         │ chunk\n               │ metadata copied                       ▼\n               │                      ┌──────────────────────────────────┐\n               └─────────────────────►│ Chunk                            │\n                                      │ chunk_id = doc:strategy:00042    │\n                                      │ text, embed_text (\"Title &gt; Sec\") │\n                                      │ metadata: section_or_article_no, │\n                                      │  heading_path, page_start/end,   │\n                                      │  chunk_type, status, domain,     │\n                                      │  file_hash, config_fingerprint   │\n                                      │ vector (384-d)                   │\n                                      └───────────────┬──────────────────┘\n                                                      │\n                  index.json (memory)  |  Qdrant: vectors {dense cosine, sparse IDF}\n                                       |  payload indexes: domain, doc_type, status,\n                                       |  doc_id, chunk_id, section_or_article_no\n data/cache/embeddings.sqlite: emb(model, key=sha256(text), vec)  PK (model,key)\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Drawing order.\u003c/strong> (1) manifest box; (2) arrow to the normalized JSON; (3) arrow to the Chunk box; (4) list the six metadata fields that drive filters and citations; (5) the two storage backends; (6) the SQLite cache off to the side.\u003c/p>\n\u003cp>\u003cstrong>Narration.\u003c/strong> \"The manifest is the source of truth and the index is derived. Every chunk carries the document's metadata plus its section and page, which is what makes filtering by status or domain and citing the exact page possible.\"\u003c/p>\n\u003chr>\n\u003ch2 id=\"s4-diagram-5-scaling-path\">Diagram 5: Scaling path\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\"> TODAY                       10x                         100x / 1000x\n ┌───────────────┐   ┌──────────────────────┐   ┌────────────────────────────────┐\n │ 1 process     │   │ LB → API ×3          │   │ Gateway → API fleet (autoscale)│\n │ memory index  │──►│ Qdrant (1 node, HNSW)│──►│ Qdrant cluster (shard by domain)│\n │ in-proc state │   │ Redis: sessions,     │   │ Redis cluster                  │\n │ MiniLM in-proc│   │  rate limit          │   │ Embedding service (GPU/ONNX)   │\n └───────────────┘   │ worker: ingestion    │   │ LLM gateway: queue, fallback,  │\n   bottleneck:       └──────────────────────┘   │  response cache                │\n   O(N) scan, BM25      bottleneck: LLM          └────────────────────────────────┘\n   rebuilt per query,   latency + rate limits        bottleneck: cost + provider limits\n   state in memory\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Drawing order.\u003c/strong> Three columns left to right. Under each, write its bottleneck in one line. Add the fix arrow between columns.\u003c/p>\n\u003cp>\u003cstrong>Narration.\u003c/strong> \"Today's limits are in the in-memory store and process-local state. First fix is Qdrant plus Redis, which my interfaces already allow. After that the bottleneck is the LLM: queueing, caching, fallback providers, and cost.\"\u003c/p>\n\u003chr>\n\u003ch2 id=\"s4-diagram-6-failure-handling\">Diagram 6: Failure handling\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\"> LLM call ──► transient? (timeout, 429, 5xx)\n                 │yes                         │no (401/403/4xx)\n                 ▼                            ▼\n          before first token?            raise typed error\n            │yes        │no                    │\n            ▼           ▼                      ▼\n   backoff+jitter    abort, no retry     SSE error LLM_ERROR\n   (≤3 tries,        (partial text        (generic message +\n    Retry-After)      already shown)        request_id)\n\n Startup ──► embedder/index load fails? ──► placeholders, /ready 503, /v1/ask 503\n Request ──► rate &gt; 60/min/IP ──► 429 + Retry-After\n          ──► body too large ──► 413\n Upload  ──► bad type/magic/size/pages/chunks ──► 415/413/422 (temp dir removed)\n Index   ──► fingerprint mismatch at sync ──► refuse, \"run sync --force\"\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Drawing order.\u003c/strong> (1) the LLM decision tree first, since it's the interesting one; (2) add the four one-line guards beneath.\u003c/p>\n\u003cp>\u003cstrong>Narration.\u003c/strong> \"Retries are conditional: only transient errors, only before the first token. After that I can't un-send text, so I surface an error event instead. Startup failures never crash the server; they flip readiness so an orchestrator stops routing traffic.\"\u003c/p>\n\u003chr>\n\u003ch2 id=\"s4-diagram-7-trade-off-comparison\">Diagram 7: Trade-off comparison\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\"> RETRIEVAL                      STORE\n ┌────────┬────────┬────────┐   ┌──────────────┬──────────────┬───────────────┐\n │        │ Dense  │ BM25   │   │              │ In-memory    │ Qdrant        │\n ├────────┼────────┼────────┤   ├──────────────┼──────────────┼───────────────┤\n │Synonyms│  good  │  poor  │   │ Setup        │ none         │ service/local │\n │Exact id│  poor  │  good  │   │ Search       │ O(N) scan    │ HNSW ANN      │\n │Acronym │  poor* │  poor* │   │ Filters      │ Python loop  │ payload index │\n │Cost    │  embed │  cheap │   │ Scale        │ ~10^4-10^5   │ 10^6+         │\n └────────┴────────┴────────┘   │ Persistence  │ JSON file    │ on disk/server│\n   Hybrid = both lists + RRF    └──────────────┴──────────────┴───────────────┘\n   *fixed by title-derived acronym expansion\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Drawing order.\u003c/strong> Draw the left table and fill the three rows; then the right table. Circle \"Hybrid = both + RRF\".\u003c/p>\n\u003cp>\u003cstrong>Narration.\u003c/strong> \"Neither retrieval mode wins on its own, so I fuse them. For storage I defaulted to zero setup and kept the interface so Qdrant is a config change when scale or filter speed matters.\"\u003c/p>\n\u003chr>\n\u003ch2 id=\"s4-diagram-8-chunking-decision-tree\">Diagram 8: Chunking decision tree\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\"> doc_type\n   ├─ statute | constitution | rule | scheme ─► s1: split at \"Section N\" / \"Article N\"\n   ├─ judgment ───────────────────────────────► s2: group numbered paragraphs (≤ 800 chars)\n   ├─ circular | master_direction | faq |\n   │  mapping_table | report ─────────────────► s3: split at headings\n   └─ anything else ──────────────────────────► s0: 800-char windows, 150 overlap\n every strategy: drop contents pages → cap 256 tokens → add prefix \"Title &gt; Section\"\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Drawing order.\u003c/strong> Root node \u003ccode>doc_type\u003c/code>, four branches, then the shared post-processing line.\u003c/p>\n\u003cp>\u003cstrong>Narration.\u003c/strong> \"Chunk boundaries follow how lawyers cite: sections for statutes, numbered paragraphs for judgments, headings for directions and reports. If no markers are found, a strategy falls back to plain windows.\"\u003c/p>\n\u003chr>\n\u003ch2 id=\"s4-diagram-9-rrf-worked-example\">Diagram 9: RRF worked example\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\"> dense list:  A(1)  B(2)  C(3)  D(4)\n sparse list: C(1)  A(2)  E(3)  B(4)\n\n score(A) = 1/(60+1) + 1/(60+2) = 0.01639 + 0.01613 = 0.03252\n score(C) = 1/(60+3) + 1/(60+1) = 0.01587 + 0.01639 = 0.03226\n score(B) = 1/(60+2) + 1/(60+4) = 0.01613 + 0.01563 = 0.03176\n score(D) = 1/(60+4)            = 0.01563\n score(E) = 1/(60+3)            = 0.01587\n\n fused: A, C, B, E, D  → cap 3 per doc → top-5\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Drawing order.\u003c/strong> Two ranked columns, then the formula, then the computed scores, then the fused order.\u003c/p>\n\u003cp>\u003cstrong>Narration.\u003c/strong> \"A chunk in both lists beats one that's top in a single list, and I never compare a cosine score to a BM25 score.\"\u003c/p>","toc":[{"level":2,"text":"Quick reference: what to draw when","id":"s4-quick-reference-what-to-draw-when"},{"level":2,"text":"Diagram 1: System architecture","id":"s4-diagram-1-system-architecture"},{"level":2,"text":"Diagram 2: Request lifecycle","id":"s4-diagram-2-request-lifecycle"},{"level":2,"text":"Diagram 3: Ingestion and sync flow","id":"s4-diagram-3-ingestion-and-sync-flow"},{"level":2,"text":"Diagram 4: Data model","id":"s4-diagram-4-data-model"},{"level":2,"text":"Diagram 5: Scaling path","id":"s4-diagram-5-scaling-path"},{"level":2,"text":"Diagram 6: Failure handling","id":"s4-diagram-6-failure-handling"},{"level":2,"text":"Diagram 7: Trade-off comparison","id":"s4-diagram-7-trade-off-comparison"},{"level":2,"text":"Diagram 8: Chunking decision tree","id":"s4-diagram-8-chunking-decision-tree"},{"level":2,"text":"Diagram 9: RRF worked example","id":"s4-diagram-9-rrf-worked-example"}],"entries":[{"id":"s4-quick-reference-what-to-draw-when","heading":"Quick reference: what to draw when","text":"Interviewer says Draw Time --- --- --- \"Give me the architecture\" Diagram 1: system architecture 2 min \"Walk me through a request\" Diagram 2: request lifecycle (sequence) 2 min \"How does data get in?\" Diagram 3: ingestion and sync flow 2 min \"What does your data look like?\" Diagram 4: manifest, chunk and index schema 1.5 min \"How would this scale?\" Diagram 5: scaling path 2.5 min \"What if X fails?\" Diagram 6: failure handling 2 min \"Why hybrid / why this store?\" Diagram 7: trade-off comparison 1.5 min \"How do you chunk legal text?\" Diagram 8: chunking decision tree 1.5 min \"Explain rank fusion\" Diagram 9: RRF worked example 1 min Rule: always draw boxes left to right (user → API → pipeline → stores), name each box with the file that implements it, and finish by marking the one weak spot you'd fix first. ---"},{"id":"s4-diagram-1-system-architecture","heading":"Diagram 1: System architecture","text":"┌──────────┐ SSE ┌───────────────────────────┐ ┌──────────────┐ │ Browser │◄────────►│ FastAPI (api/main.py) │───────►│ Groq LLM │ │ Next.js │ POST │ middleware → routes │ stream │ (external) │ └──────────┘ └───────────┬───────────────┘ └──────────────┘ │ prepare() in thread ┌──────────▼───────────┐ │ RAGPipeline │ │ understand→retrieve │ │ →gate→prompt→validate│ └──────────┬───────────┘ ┌────────────────┴───────────────┐ ┌─────▼──────┐ ┌─────▼──────┐ │ Embedder │ │ VectorStore│ │ MiniLM │ │ memory Qdrant └────────────┘ └─────▲──────┘ │ upsert data/raw/ .pdf ─► sync ─► classify ─► chunk ─► embed (SQLite cache) Drawing order 1. Draw the Browser box on the left and the Groq box on the far right. 2. Draw the FastAPI box in the middle; write \"middleware: request ID, rate limit, CORS\" inside it. 3. Draw the arrow Browser ↔ FastAPI labelled \"POST /v1/ask, SSE tokens back\". 4. Draw RAGPipeline under FastAPI with its five stages. 5. Draw Embedder and VectorStore under the pipeline; write \"memory Qdrant\" on the store. 6. Draw the ingestion path along the bottom feeding the store. Narration. \"A question goes from the browser to FastAPI. After rate-limit and size checks, the pipeline rewrites the question, embeds it, searches the store, decides whether the evidence is good enough, and only then calls Groq. Tokens stream back over SSE. Offline, sync turns PDFs into chunks and vectors in the same store.\" ---"},{"id":"s4-diagram-2-request-lifecycle","heading":"Diagram 2: Request lifecycle","text":"Browser API/middleware Pipeline Store Groq │ POST /v1/ask │ │ │ │ ├────────────────►│ id, rate, size │ │ │ │ ├────────────────►│ understand │ │ │ │ ├─ dense+BM25 ────►│ │ │ │ │◄── results ──────┤ │ │ │ │ RRF→cap→pin │ │ │ │ │ best dense \u003c thr?│ │ │◄─ abstained ────┤◄── abstain ─────┤ (yes: stop) │ │ │ │ │ build prompt [1..n] │ │ ├──────────────── stream ───────────────────────►│ │◄── token ×N ────┤◄──────────── tokens ──────────────────────────┤ │ │ validate [n] against passages │ │◄─ citations ────┤ (strip invalid, add currency notes) │ │◄─ done ─────────┤ (latency, request_id, disclaimer) │ Drawing order 1. Draw five vertical lifelines: Browser, API, Pipeline, Store, Groq. 2. Draw the request arrow and label the middleware checks. 3. Draw understand → retrieve → results. 4. Draw the diamond-style decision \"best dense score \u003c threshold?\" with the early abstained branch. 5. Draw the Groq stream and the token arrows back to the browser. 6. Draw the last two events: citations then done . Narration. \"Everything before the LLM is deterministic and cheap: rules, an embedding, two searches, a gate. That's why abstention costs nothing in tokens. After streaming, I validate citation numbers server-side and send the cleaned answer in the citations event.\" ---"},{"id":"s4-diagram-3-ingestion-and-sync-flow","heading":"Diagram 3: Ingestion and sync flow","text":"data/raw/{legal,banking}/ .pdf txt (drop files here) │ ▼ discover (recursive) ──► known? (manifest path) │ no │ yes ▼ ▼ classify.py hash changed? domain/type/title/year │yes │no │ ▼ ▼ append to manifest refresh hash SKIP (text, keeps edits) │ └─────────┬
