c/blockquote>\n\u003cp>\u003cstrong>A7. What are you most proud of?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>The ingestion design. It's incremental and safe: hashes decide what to re-process, a config fingerprint refuses to mix vectors from two embedders, new chunks are written before stale ones are deleted, and a \u003ccode>sync\u003c/code> command classifies new PDFs and updates the manifest without overwriting my manual edits.\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s1-b-architecture-and-design\">B. Architecture and design\u003c/h2>\n\u003cp>\u003cstrong>B1. Why RAG instead of fine-tuning?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Law changes, and I need to show sources. With RAG I update the corpus by dropping in a PDF, I can cite the exact passage, and I can mark a source superseded. Fine-tuning bakes knowledge into weights, can't cite, and goes stale.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>B2. Why hybrid retrieval?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Legal questions mix concepts, like \"what is data fiduciary,\" and exact identifiers, like \"Section 66A.\" Dense embeddings handle paraphrase but blur identifiers; BM25 matches exact terms but misses synonyms. Running both and fusing them covers both.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>B3. Why reciprocal rank fusion instead of a weighted sum?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Cosine similarity and BM25 scores live on different scales. RRF uses only rank positions, \u003ccode>weight / (60 + rank)\u003c/code>, so I don't have to calibrate scores. The constant 60 is the standard value from the original paper and it's \u003ccode>k0\u003c/code> in \u003ccode>hybrid.py\u003c/code>.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>B4. Why structure-aware chunking?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Fixed windows cut a proviso away from its section and mix two sections in one chunk. I split statutes on \u003ccode>Section N\u003c/code> and \u003ccode>Article N\u003c/code>, judgments on numbered paragraphs grouped up to 800 characters, and circulars and reports on headings. A recursive character splitter would be simpler but loses the structure that legal citations depend on.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>B5. What is the contextual prefix?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Each chunk's embedded text starts with \u003ccode>Title &gt; Section\u003c/code>, for example \"The Digital Personal Data Protection Act, 2023 &gt; Section 9\". It disambiguates \"Section 3\" across different Acts. The displayed text stays the original chunk text; only the embedded text carries the prefix.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>B6. How does the abstention gate work?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>After retrieval I take the maximum dense score across the results. If there are no results, or the best score is below \u003ccode>abstain_threshold\u003c/code>, I skip the LLM and return an explanation of what was searched. One honest caveat: the default threshold is 0.0, so by default it only abstains on an empty result. There's a \u003ccode>tune-abstain\u003c/code> command to pick a value on a dev split.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>B7. How do you handle laws that have been replaced?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Each document has a \u003ccode>status\u003c/code>: in_force, amended, superseded or repealed, plus an optional \u003ccode>superseded_by\u003c/code>. By default retrieval filters to in-force and amended sources, unless the question mentions IPC, CrPC or the Evidence Act. If a superseded passage is used, it's tagged in the prompt and returned as a currency note.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>B8. Why an interface for embedders and vector stores?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>It lets me swap implementations without touching the pipeline: a hashing embedder for tests, MiniLM for real use; an in-memory store by default, Qdrant optionally. The eval runner and the API share the same \u003ccode>build_retriever\u003c/code> factory, so experiments test the production code.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>B9. Why is the pipeline linear rather than an agent?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>For a fixed corpus, most legal questions are answered by one or two passages, and a linear pipeline is faster, cheaper and easier to test. An agent loop adds latency and failure modes. I kept the stages as separate callables so a loop could wrap them later.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>B10. How does the upload feature work without touching the corpus?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>An uploaded PDF or text file is validated, parsed in a temp directory, chunked and embedded into its own in-memory store, and registered under an unguessable \u003ccode>secrets.token_urlsafe(24)\u003c/code> ID with a 30-minute TTL. A question with that \u003ccode>upload_id\u003c/code> searches only that store, so one user's file never appears in another user's answer.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>B11. What does \u003ccode>create_app\u003c/code> do and why is it a factory?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>It builds the FastAPI app and lets me inject settings, an LLM client, an embedder, a vector store, a session store or a whole pipeline. Tests pass fakes, so none of them need a network or a model download.\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s1-c-security\">C. Security\u003c/h2>\n\u003cp>\u003cstrong>C1. How do you defend against prompt injection in retrieved passages?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>The prompt tells the model the passages are untrusted data and to never follow instructions in them. In code, \u003ccode>_escape\u003c/code> neutralises \u003ccode>&lt;passages&gt;\u003c/code> and \u003ccode>&lt;/passages&gt;\u003c/code> inside passage text so a document can't close the data block. I also keep five injection fixtures in \u003ccode>eval/injection/\u003c/code>, such as \"ignore previous\" and \"fake citation.\" I'd say this reduces risk; I haven't proven resistance against a real model.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>C2. How do you stop the model from citing sources that don't exist?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>I parse every \u003ccode>[n]\u003c/code> marker, check \u003ccode>1 &lt;= n &lt;= number of passages\u003c/code>, report invalid numbers, and strip the invalid markers from the final answer. The streamed tokens may briefly contain a bad marker, so the \u003ccode>citations\u003c/code> event carries a sanitised \u003ccode>answer\u003c/code> that the client uses to replace the displayed text.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>C3. How are secrets handled?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>\u003ccode>llm_api_key\u003c/code> and \u003ccode>admin_api_key\u003c/code> are \u003ccode>SecretStr\u003c/code>, so dumps show asterisks. The JSON logger runs a \u003ccode>SecretScrubber\u003c/code>, and a pre-commit hook plus \u003ccode>scripts/check_staged.py\u003c/code> block committing \u003ccode>.env\u003c/code>. CI verifies that guard with a self-check.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>C4. How is the admin API protected?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Admin routes need an \u003ccode>X-API-Key\u003c/code> header, compared with \u003ccode>secrets.compare_digest\u003c/code> to avoid timing leaks. If no admin key is configured, the routes return 403, so they're off by default.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>C5. How do you protect against abuse?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>A pure-ASGI middleware rejects oversized bodies from the \u003ccode>Content-Length\u003c/code> header with 413, and applies a sliding 60-second window per client IP, 60 requests per minute by default, returning 429 with \u003ccode>Retry-After\u003c/code>. Uploads are bounded separately: 5 MB, 100 pages, 2,000 chunks, \u003ccode>%PDF-\u003c/code> magic check, and the file name is never used as a path.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>C6. How do you handle CORS?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>\u003ccode>CORS_ORIGINS\u003c/code> is configurable, and I never set \u003ccode>allow_credentials\u003c/code> when the wildcard is used. I also fixed a startup crash where a comma-separated list wasn't parsed, with a regression test.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>C7. What about privacy of uploads?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>They live only in memory under an unguessable ID, expire after 30 minutes, and can be deleted immediately with a DELETE call. Tracing is opt-in and stores metadata but not prompt text. The honest caveat is that uploaded text and questions do go to an external LLM provider, Groq.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>C8. What error information do you expose?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Provider failures become a generic \u003ccode>LLM_ERROR\u003c/code> event with a request ID, with no provider details. Unhandled exceptions return the same \u003ccode>ErrorResponse\u003c/code> shape. Logs carry the request ID so I can trace a failure.\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s1-d-performance\">D. Performance\u003c/h2>\n\u003cp>\u003cstrong>D1. Why stream the answer?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>LLM generation is the slowest stage, around 1.1 seconds median in my three-request sample. Streaming with SSE shows the first token almost immediately instead of waiting for the full answer, and it lets me keep the connection open for the citation and done events.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>D2. Why SSE and not WebSockets?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>The data flows one way, server to client, so SSE is simpler and works over plain HTTP. In the browser I read it with \u003ccode>fetch\u003c/code> and a \u003ccode>ReadableStream\u003c/code> reader rather than \u003ccode>EventSource\u003c/code>, because \u003ccode>EventSource\u003c/code> can't send a POST body.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>D3. Where are the bottlenecks?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>The LLM call dominates latency. In the in-memory store, dense search scans every vector and BM25 statistics are rebuilt on every query in \u003ccode>sparse_search\u003c/code>, so retrieval is O(N) per question. That's fine at 27k chunks for a demo; for more I'd cache the BM25 index or use Qdrant.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>D4. How do you avoid blocking the event loop?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Retrieval and embedding are CPU-bound, so \u003ccode>prepare()\u003c/code> runs in \u003ccode>asyncio.to_thread\u003c/code>, as do uploads' parsing and feedback file writes. The LLM stream is natively async through \u003ccode>httpx\u003c/code>.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>D5. How does the embedding cache help?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>It's a SQLite table keyed by model and the SHA-256 of the text. Re-indexing a modified document only embeds chunks whose text changed; the rest are cache hits. Switching models doesn't mix entries because the model name is part of the key.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>D6. How would you reduce LLM cost and latency?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Cap \u003ccode>max_tokens\u003c/code>, keep the context budget at 12,000 characters, de-duplicate near-identical passages with a Jaccard threshold of 0.9, and abstain before calling the model when evidence is missing. I also track approximate output tokens per request in the metrics.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>D7. What latency numbers do you have?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>In a real three-request session the Metrics page showed a total median of about 1.14 seconds, generation about 1.1 seconds and retrieval about 38 ms, but retrieval p95 was 2.5 seconds. Three samples aren't a benchmark and I'd profile before explaining the spread. Separately, a load test with a fake LLM and a four-document fixture did 398 requests with zero errors at about 8.8 requests per second.\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s1-e-data\">E. Data\u003c/h2>\n\u003cp>\u003cstrong>E1. What is the manifest and why does it exist?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>\u003ccode>data/manifest.yaml\u003c/code> is the source of truth: one record per document with ID, title, type, domain, status, path and file hash. The index is derived from it, so I can rebuild the index at any time and review metadata changes in git.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>E2. How does the drop-in \u003ccode>sync\u003c/code> work?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>I drop a PDF into \u003ccode>data/raw/legal\u003c/code> or \u003ccode>data/raw/banking\u003c/code>. \u003ccode>sync\u003c/code> classifies it from the folder, file name, PDF metadata and first pages, appends an entry to the manifest as raw text, validates, then parses, chunks, embeds and indexes only that file. Unchanged files are skipped by hash; modified files are re-indexed and their stale chunks removed; deleted files only warn unless I pass \u003ccode>--prune\u003c/code>.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>E3. Why edit the manifest as text?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>If I re-dumped the YAML, I'd lose comments and could overwrite fields I edited by hand, like marking an Act superseded or adding a source URL. Appending raw text preserves everything; the only automatic change to an existing entry is refreshing its file hash when the file changes.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>E4. What's the config fingerprint?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>A 16-character SHA-256 over everything that changes index contents: embedder name and dimension, chunk strategy and its version, sizes, prefix flag, sparse method and parser version. The store records it, and a mismatch raises \u003ccode>FingerprintMismatchError\u003c/code>, telling me to run \u003ccode>sync --force\u003c/code>. It prevents mixing 512-dimension hashing vectors with 384-dimension MiniLM vectors.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>E5. Why write new chunks before deleting old ones?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>If the process dies between the two steps, the document still has its old chunks instead of none. \u003ccode>index_document\u003c/code> upserts the new chunks, then calls \u003ccode>delete_except\u003c/code> with the new chunk IDs.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>E6. How do chunk IDs work?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>\u003ccode>{doc_id}:{strategy_version}:{index:05d}\u003c/code>. They're deterministic, so re-indexing overwrites; in Qdrant I derive a UUID5 point ID from the chunk ID so upserts are idempotent.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>E7. Memory store or Qdrant, how do they differ?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>The memory store keeps chunks and vectors in dicts and persists a JSON file: dense search is a dot product over normalised vectors, sparse is BM25 computed in Python. Qdrant keeps named vectors, \u003ccode>dense\u003c/code> with cosine distance and \u003ccode>sparse\u003c/code> with hashed term counts and a server-side IDF modifier, plus keyword payload indexes for filters. Both implement the same interface.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>E8. What did you learn from your real ingestion run?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>21 documents gave 26,974 chunks, averaging 75 to 169 tokens with a maximum of 200. It also showed duplicates: the Companies Act, DPDP Act and PMLA each appear twice with identical counts, and the Constitution twice with different counts. Sync classifies by file, not content, so a duplicate check is the next fix.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>E9. How do you handle scanned PDFs?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>There's no OCR in this code. \u003ccode>parse_pdf\u003c/code> flags pages with under 50 characters as \u003ccode>low_text\u003c/code>, the sync summary lists them, and an upload with no extractable text is rejected.\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s1-f-language-and-framework-specifics-python-fastapi-typescript\">F. Language and framework specifics (Python, FastAPI, TypeScript)\u003c/h2>\n\u003cp>\u003cstrong>F1. How do you do dependency injection in FastAPI here?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Mostly through the \u003ccode>create_app\u003c/code> factory and \u003ccode>app.state\u003c/code>, not \u003ccode>Depends\u003c/code>. Shared objects, such as the LLM client, embedder, store and session store, are built once in the lifespan and read from \u003ccode>request.app.state\u003c/code>. \u003ccode>Depends\u003c/code> is used where it fits naturally, for \u003ccode>require_admin\u003c/code>.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>F2. What does the lifespan do?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>It creates one shared \u003ccode>httpx.AsyncClient\u003c/code>, wraps the LLM client in the resilience layer, loads the index and embedder (a failure flips readiness to not-ready instead of crashing), optionally runs the startup sync in a thread, builds the pipeline, starts a background session-cleanup task, and cleans everything up on shutdown.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>F3. How do you handle async and sync code together?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>The pipeline's \u003ccode>prepare()\u003c/code> is synchronous because retrieval is CPU work, so I call it through \u003ccode>asyncio.to_thread\u003c/code>. Streaming is an \u003ccode>async for\u003c/code> over the LLM's async generator. The session store uses an \u003ccode>asyncio.Lock\u003c/code>, while the upload store and metrics use \u003ccode>threading.Lock\u003c/code> because they're touched from threads.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>F4. How do you use Pydantic?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>For the manifest schema with enums and validators, request and response models, and settings with \u003ccode>pydantic-settings\u003c/code>. I used \u003ccode>Annotated[list[str], NoDecode]\u003c/code> plus a validator so list-valued environment variables accept comma-separated or JSON input.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>F5. How do you request IDs propagate?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>A \u003ccode>ContextVar\u003c/code> set by \u003ccode>RequestIDMiddleware\u003c/code> (\u003ccode>api/middleware.py\u003c/code>) holds the ID. The middleware validates an incoming \u003ccode>X-Request-ID\u003c/code>, generates one otherwise, and adds it to every response, error body and log line.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>F6. How does the frontend consume the stream?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>\u003ccode>web/lib/api.ts\u003c/code> POSTs with \u003ccode>fetch\u003c/code>, gets \u003ccode>res.body.getReader()\u003c/code>, decodes chunks, splits on blank lines, and parses \u003ccode>event:\u003c/code> and \u003ccode>data:\u003c/code> lines into typed events. The Ask page updates the answer as tokens arrive, then replaces the text with the sanitised answer from the \u003ccode>citations\u003c/code> event.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>F7. How do you test code that depends on time?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>I inject the clock. \u003ccode>InMemorySessionStore\u003c/code> and \u003ccode>UploadStore\u003c/code> take a \u003ccode>time_fn\u003c/code>, and the resilience client takes sleep functions, so TTL expiry and backoff are tested instantly, with no real waiting.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>F8. How do you mock the LLM?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>The Groq client uses \u003ccode>httpx\u003c/code>, so tests use \u003ccode>httpx.MockTransport\u003c/code> to return canned status codes and SSE bodies. There's also an \u003ccode>ExtractiveFakeLLM\u003c/code> for pipeline and eval smoke tests.\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s1-g-devops-and-deployment\">G. DevOps and deployment\u003c/h2>\n\u003cp>\u003cstrong>G1. What does CI do?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Three GitHub Actions jobs. \u003ccode>test\u003c/code> runs \u003ccode>uv sync\u003c/code>, ruff, pytest, a staged-file guard self-check, an advisory \u003ccode>pip-audit\u003c/code>, and an eval smoke run on the fixture corpus with thresholds \u003ccode>hit@5 ≥ 0.9, mrr ≥ 0.8, abstention_acc ≥ 0.9, citation_valid ≥ 0.9\u003c/code>. \u003ccode>web\u003c/code> runs \u003ccode>npm ci\u003c/code>, the TypeScript type check and the build. \u003ccode>docker\u003c/code> builds the image after tests pass.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>G2. Is it containerised?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>There's a multi-stage \u003ccode>python:3.11-slim\u003c/code> Dockerfile that runs as a non-root user with a \u003ccode>/health\u003c/code> healthcheck, and a compose file with a volume for the index and an \u003ccode>ingest\u003c/code> profile. I have to be upfront: I haven't been able to run the build here, and the Dockerfile doesn't install the \u003ccode>embeddings\u003c/code> extra yet, so a container with the default MiniLM model would fail until I add it.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>G3. How would you deploy it for free?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>API on Hugging Face Spaces (Docker, CPU, enough RAM for the model and index) with the index baked into the image at build time, the UI on Vercel pointing at the API URL, and a Groq free-tier key. The index must be built at image build because the free tier has no persistent disk.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>G4. What monitoring exists?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>\u003ccode>/health\u003c/code> and \u003ccode>/ready\u003c/code> probes, a \u003ccode>/v1/metrics\u003c/code> endpoint with p50 and p95 per stage, JSON logs with request IDs and stage timings on every ask, and optional JSONL traces that I can look up by request ID through an admin route. They're process-local; a production setup would export to Prometheus or similar.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>G5. How do you manage configuration across environments?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Everything is an environment variable with a safe default, validated by Pydantic at start-up. \u003ccode>.env.example\u003c/code> lists the knobs; \u003ccode>AUTO_SYNC_ON_STARTUP=true\u003c/code> is set there for local development and defaults to false in code.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>G6. What happens on start-up if the index is missing?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>The app still starts. The embedder and store are placeholders marked not-ready, \u003ccode>/ready\u003c/code> returns 503, and \u003ccode>/v1/ask\u003c/code> returns 503 with \"no index loaded.\" If \u003ccode>AUTO_SYNC_ON_STARTUP\u003c/code> is true, it builds the index from \u003ccode>data/raw\u003c/code> first.\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s1-h-improvements\">H. Improvements\u003c/h2>\n\u003cp>\u003cstrong>H1. What would you add next?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>First, a real golden set and measured baselines, because I haven't measured retrieval quality on the real corpus. Then tune the abstention threshold, de-duplicate documents during sync, cache the BM25 index, and fix the Docker build.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>H2. What technical debt do you have?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>The default abstention threshold of 0.0, per-query BM25 rebuilds in the memory store, process-local sessions and rate limits, a Dockerfile missing the embeddings extra, a stale \u003ccode>uv.lock\u003c/code>, and the old-to-new law mapping file not being populated.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>H3. How would you add OCR?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>I already detect low-text pages during parsing. I'd route those pages through an OCR step before normalisation, keep the OCR confidence in the page stats, and add a \u003ccode>text_quality\u003c/code> of \u003ccode>needs_ocr\u003c/code> handling plus a test with a scanned fixture.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>H4. How would you add multilingual support?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Add a language selector in the request, translate the query or use a multilingual embedder, and translate the answer while preserving citation markers, then verify that the marker set is identical before and after. I'd want bilingual legal review for terminology.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>H5. How would you check that a citation actually supports a claim?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Today I only check that the number exists. The offline judge in \u003ccode>eval/judge.py\u003c/code> already scores citation support with an LLM; I'd run a lightweight version online for high-risk answers, or sample it, trading latency for assurance.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>H6. How would you scale the corpus to 100k+ documents?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Switch to Qdrant server mode, add payload indexes for filters (already created for six fields), shard by domain, batch ingestion in workers, and put the embedding cache on shared storage. I'd also add a cross-encoder reranker over the top 30 to keep precision.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>H7. What would your v2 be?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>A measured baseline, deduplicated corpus, an agentic mode for multi-step questions behind a bounded loop, user accounts for document ownership, and Redis-backed sessions so I can run several replicas.\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s1-i-behavioural\">I. Behavioural\u003c/h2>\n\u003cp>\u003cstrong>I1. Tell me about the hardest bug.\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>A user asked \"what id dpdp act\" and the system answered that the passages had nothing about a DPDP Act, citing the Motor Vehicles Act. The Act's text never spells the acronym, so neither BM25 nor MiniLM matched it. I derived acronyms from manifest titles, expanded them in query understanding, and made the dense search embed the expansion too. I'm candid that I fixed the mechanism and added tests, but haven't measured its effect on a real golden set.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>I2. Describe a trade-off you made.\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Zero-infrastructure in-memory storage versus scalability. I accepted O(N) scans and Python BM25 to keep local setup trivial, and kept a Qdrant adapter behind the same interface so I can scale later without rewriting the pipeline.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>I3. Tell me about a mistake you caught.\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>While testing the sync command I built an index with the offline hashing embedder, 512 dimensions, in the same data folder my real backend reads, which uses MiniLM at 384. Queries were then compared against vectors from a different embedder, so retrieval was meaningless. The fingerprint exists to refuse mixing embedders at write time, but this showed that a stale index can still be loaded and served silently. My fix list includes making a fingerprint mismatch show as not-ready, and I now keep test indexes in temp directories.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>I4. How did you handle uncertainty or missing information?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>I separated what I can show from what I can't. For example, I don't quote retrieval-quality numbers because \u003ccode>eval/runs\u003c/code> is empty, and I mark the real-run figures, 21 documents and 26,974 chunks, as coming from my own run's screenshots.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>I5. How do you test your own work?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Tests first for the risky parts: fingerprint mismatches, safe-order replacement, streaming retry rules, upload limits, and sync behaviours like preserving manual manifest edits. Then lint and the CI eval gate. I also run the real thing by hand and compare against the screenshots.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>I6. How did you handle disagreement or feedback?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>When the interface looked broken I took the screenshot as the spec, reproduced it, and fixed it rather than defending the first version. Similarly, feedback that manual manifest editing was painful led directly to the drop-in sync workflow.\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s1-j-theory\">J. Theory\u003c/h2>\n\u003cp>\u003cstrong>J1. What is cosine similarity and why normalise vectors?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>It's the cosine of the angle between two vectors. If both are L2-normalised, cosine equals the dot product, so I can compute it as a plain dot product, which is what the memory store does. MiniLM is encoded with \u003ccode>normalize_embeddings=True\u003c/code> and my hashing embedder normalises explicitly.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>J2. Explain BM25.\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>A term-frequency scoring function with inverse document frequency and length normalisation: \u003ccode>idf · tf·(k1+1) / (tf + k1·(1 − b + b·len/avglen))\u003c/code>. I use \u003ccode>k1 = 1.5\u003c/code> and \u003ccode>b = 0.75\u003c/code>. \u003ccode>idf = log(1 + (N − df + 0.5)/(df + 0.5))\u003c/code>.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>J3. Why does RRF work?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Each list contributes \u003ccode>1/(60 + rank)\u003c/code>, so an item ranked high in either list scores well, and an item high in both scores best. It ignores raw scores, so it's robust to different scales. The constant dampens the advantage of the very top ranks.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>J4. What's the complexity of your retrieval?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>In-memory dense search is O(N·d) for N chunks of dimension d; BM25 as written is O(total tokens) because statistics are rebuilt per call, plus O(N log N) sorting. Qdrant replaces the dense scan with an approximate-nearest-neighbour index, giving sub-linear search.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>J5. CAP theorem, where does your system sit?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>It's a single-node system, so the question mostly doesn't apply yet. Sessions and uploads are process-local, so with replicas I'd trade consistency for availability unless I add shared state. The index is read-mostly and rebuilt offline, so eventual consistency across replicas is acceptable if they all load the same fingerprint.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>J6. What are precision@k, recall@k, MRR and nDCG?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Hit@k is whether any gold document appears in the top k; recall@k is the share of gold documents found; MRR is the mean of \u003ccode>1/rank\u003c/code> of the first gold hit; nDCG@k rewards putting gold items higher with a logarithmic discount. They're implemented in \u003ccode>eval/metrics.py\u003c/code>.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>J7. What's the difference between hallucination and unsupported citation?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Hallucination is stating something not in the sources. An unsupported citation is attaching a real passage number to a sentence the passage doesn't support. My online check catches non-existent numbers; checking support needs a judge, which I run offline.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>J8. Why exponential backoff with jitter?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>To avoid synchronised retries from many clients hammering a rate-limited service. I use \u003ccode>min_wait · 2^attempt\u003c/code> plus random jitter capped at \u003ccode>max_wait\u003c/code>, and honour a \u003ccode>Retry-After\u003c/code> header when the provider sends one. I only retry timeouts, 429 and 5xx.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>J9. What is idempotency and where do you rely on it?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Repeating an operation gives the same result. Ingestion relies on it: deterministic chunk IDs, content-hash skipping and upserts mean re-running \u003ccode>sync\u003c/code> on the same files changes nothing.\u003c/p>\u003c/blockquote>","toc":[{"level":2,"text":"A. Project overview","id":"s1-a-project-overview"},{"level":2,"text":"B. Architecture and design","id":"s1-b-architecture-and-design"},{"level":2,"text":"C. Security","id":"s1-c-security"},{"level":2,"text":"D. Performance","id":"s1-d-performance"},{"level":2,"text":"E. Data","id":"s1-e-data"},{"level":2,"text":"F. Language and framework specifics (Python, FastAPI, TypeScript)","id":"s1-f-language-and-framework-specifics-python-fastapi-typescript"},{"level":2,"text":"G. DevOps and deployment","id":"s1-g-devops-and-deployment"},{"level":2,"text":"H. Improvements","id":"s1-h-improvements"},{"level":2,"text":"I. Behavioural","id":"s1-i-behavioural"},{"level":2,"text":"J. Theory","id":"s1-j-theory"}],"entries":[{"id":"s1-interview-q-a-78-questions-answers-ready-to-speak","heading":"Interview Q&A (78 questions, answers ready to speak)","text":"All answers are first person and match the code in this repository. Where a limitation is real, the answer says so. ---"},{"id":"s1-a-project-overview","heading":"A. Project overview","text":"A1. What is this project? I built Legal Assist, a retrieval-augmented generation system for Indian legal and banking questions. It searches a corpus of statutes, judgments and RBI material, passes the best passages to an LLM, and streams back an answer with numbered citations. If the corpus doesn't support an answer, the system is designed to say so rather than guess. A2. Why did you build it? What problem does it solve? Plain LLMs answer legal questions confidently with no source, and Indian statutes and judgments are long and structured, so people struggle to find the exact provision. I wanted answers that are grounded, checkable through citations, and honest about gaps and about superseded law. A3. Who is it for? Non-lawyers who want a first, sourced pointer to the right provision. The prompt says \"plain language,\" the interface shows the source passage for every citation, and every response carries \"Informational only; not legal advice.\" A4. What is the end-to-end flow of a question? The browser POSTs to /v1/ask . I rewrite and expand the question, retrieve with dense and BM25 search, fuse the lists with reciprocal rank fusion, cap results per document, and pin exact section matches. A gate checks the best dense score; if it passes I build a numbered-passage prompt and stream Groq's tokens back over server-sent events. At the end I validate the citation numbers against the passages I actually supplied and send a citations event and a done event. A5. What's the scale of the project? About 6,500 lines of Python across 55 files in src/legal_rag , around 1,250 lines of TypeScript in the Next.js app, and 218 tests in 16 files. On my real run it indexed 21 documents into about 27,000 chunks. A6. What was your role? I designed and built the pipeline end to end: ingestion, retrieval, generation, the API, the evaluation harness, the CI, and the interface. I can walk through any module in detail. A7. What are you most proud of? The ingestion design. It's incremental and safe: hashes decide what to re-process, a config fingerprint refuses to mix vectors from two embedders, new chunks are written before stale ones are deleted, and a sync command classifies new PDFs and updates the manifest without overwriting my manual edits. ---"},{"id":"s1-b-architecture-and-design","heading":"B. Architecture and design","text":"B1. Why RAG instead of fine-tuning? Law changes, and I need to show sources. With RAG I update the corpus by dropping in a PDF, I can cite the exact passage, and I can mark a source superseded. Fine-tuning bakes knowledge into weights, can't cite, and goes stale. B2. Why hybrid retrieval? Legal questions mix concepts, like \"what is data fiduciary,\" and exact identifiers, like \"Section 66A.\" Dense embeddings handle paraphrase but blur identifiers; BM25 matches exact terms but misses synonyms. Running both and fusing them covers both. B3. Why reciprocal rank fusion instead of a weighted sum? Cosine similarity and BM25 scores live on different scales. RRF uses only rank positions, weight / (60 + rank) , so I don't have to calibrate scores. The constant 60 is the standard value from the original paper and it's k0 in hybrid.py . B4. Why structure-aware chunking? Fixed windows cut a proviso away from its section and mix two sections in one chunk. I split statutes on Section N and Article N , judgments on numbered paragraphs grouped up to 800 characters, and circulars and reports on headings. A recursive character splitter would be simpler but loses the structure that legal citations depend on. B5. What is the contextual prefix? Each chunk's embedded text starts with Title Section , for example \"The Digital Personal Data Protection Act, 2023 Section 9\". It disambiguates \"Section 3\" across different Acts. The displayed text stays the original chunk text; only the embedded text carries the prefix. B6. How does the abstention gate work? After retrieval I take the maximum dense score across the results. If there are no results, or the best score is below abstain_threshold , I skip the LLM and return an explanation of what was searched. One honest caveat: the default threshold is 0.0, so by default it only abstains on an empty result. There's a tune-abstain command to pick a value on a dev split. B7. How do you handle laws that have been replaced? Each document has a status : in_force, amended, superseded or repealed, plus an optional superseded_by . By default retrieval filters to in-force and amended sources, unless the question mentions IPC, CrPC or the Evidence Act. If a superseded passage is used, it's tagged in the prompt and returned as a currency note. B8. Why an interface for embedders and vector stores? It lets me swap implementations without touching the pipeline: a hashing embedder for tests, MiniLM for real use; an in-memory store by default, Qdrant optionally. The eval runner and the API share the same build_retriever factory, so experiments test the production code. B9. Why is the pipeline linear rather than an agent? For a fixed corpus, most legal questions are answered by one or two passages, and a linear pipeline is faster, cheaper and easier to test. An agent loop adds latency and failure modes. I kept the stages as separate callables so a loop could wrap them later. B10. How does the upload feature work without touching the corpus? An uploaded PDF or text file is validated, parsed in a temp directory, chunked and embedded into its own in-memory store, and registered under an unguessable secrets.token_urlsafe(24) ID with a 30-minute TTL. A question with that upload_id searches only that store, so one user's file never appears in another user's answer. B11. What does create_app do and why is it a factory? It builds the FastAPI app and lets me inject settings, an LLM client, an embedder, a vector store, a session store or a whole pipeline. Tests pass fakes, so none of them need a network or a model download. ---"},{"id":"s1-c-security","heading":"C. Security","text":"C1. How do you defend against prompt injection in retrieved passages? The prompt tells the model the passages are untrusted data and to never follow instructions in them. In code, _escape neutralises \u003cpassages and \u003c/passages inside passage text so a document can't close the data block. I also keep five injection fixtures in eval/injection/ , such as \"ignore previous\" and \"fake citation.\" I'd say this reduces risk; I haven't proven resistance against a real model. C2. How do you stop the model from citing sources that don't exist? I parse every [n] marker, check 1 \u003c= n \u003c= number of passages , report invalid numbers, and strip the invalid markers from the final answer. The streamed tokens may briefly contain a bad marker, so the citations event carries a sanitised answer that the client uses to replace the displayed text. C3. How are secrets handled? llm_api_key and admin_api_key are SecretStr , so dumps show asterisks. The JSON logger runs a SecretScrubber , and a pre-commit hook plus scripts/check_staged.py block committing .env . CI verifies that guard with a self-check. C4. How is the admin API protected? Admin routes need an X-API-Key header, compared with secrets.compare_digest to avoid timing leaks. If no admin key is configured, the routes return 403, so they're off by default. C5. How do you protect against abuse? A pure-ASGI middleware rejects oversized bodies from the Content-Length header with 413, and applies a sliding 60-second window per client IP, 60 requests per minute by default, returning 429 with Retry-After . Uploads are bounded separately: 5 MB, 100 pages, 2,000 chunks, %PDF- magic check, and the file name is never used as a path. C6. How do you handle CORS? CORS_ORIGINS is configurable, and I never set allow_credentials when the wildcard is used. I also fixed a startup crash where a comma-separated list wasn't parsed, with a regression test. C7. What about privacy of uploads? They live only in memory under an unguessable ID, expire after 30 minutes, and can be deleted immediately with a DELETE call. Tracing is opt-in and stores metadata but not prompt text. The honest caveat is that uploaded text and questions do go to an external LLM provider, Groq. C8. What error information do you expose? Provider failures become a generic LLM_ERROR event with a request ID, with no provider details. Unhandled exceptions return the same ErrorResponse shape. Logs carry the request ID so I can trace a failure. ---"},{"id":"s1-d-performance","heading":"D. Performance","text":"D1. Why stream the answer? LLM generation is the slowest stage, around 1.1 seconds median in my three-request sample. Streaming with SSE shows the first token almost immediately instead of waiting for the full answer, and it lets me keep the connection open for the citation and done events. D2. Why SSE and not WebSockets? The data flows one way, server to client, so SSE is simpler and works over plain HTTP. In the browser I read it with fetch and a ReadableStream reader rather than EventSource , because EventSource can't send a POST body. D3. Where are the bottlenecks? The LLM call dominates latency. In the in-memory store, dense search scans every vector and BM25 statistics are rebuilt on every query in sparse_search , so retrieval is O(N) per question. That's fine at 27k chunks for a demo; for more I'd cache the BM25 index or use Qdrant. D4. How do you avoid blocking the event loop? Retrieval and embedding are CPU-bound, so prepare() runs in asyncio.to_thread , as do uploads' parsing and feedback file writes. The LLM stream is natively async through httpx . D5. How does the embedding cache help? It's a SQLite table keyed by model and the SHA-256 of the text. Re-indexing a modified document only embeds chunks whose text changed; the rest are cache hits. Switching models doesn't mix entries because the model name is part of the key. D6. How would you reduce LLM cost and latency? Cap max_tokens , keep the context budget at 12,000 characters, de-duplicate near-identical passages with a Jaccard threshold of 0.9, and abstain before calling the model when evidence is missing. I also track approximate output tokens per request in the metrics. D7. What latency numbers do you have? In a real three-request session the Metrics page showed a total median of about 1.14 seconds, generation about 1.1 seconds and retrieval about 38 ms, but retrieval p95 was 2.5 seconds. Three samples aren't a benchmark and I'd profile before explaining the spread. Separately, a load test with a fake LLM and a four-document fixture did 398 requests with zero errors at about 8.8 requests per second. ---"},{"id":"s1-e-data","heading":"E. Data","text":"E1. What is the manifest and why does it exist? data/manifest.yaml is the source of truth: one record per document with ID, title, type, domain, status, path and file hash. The index is derived from it, so I can rebuild the index at any time and review metadata changes in git. E2. How does the drop-in sync work? I drop a PDF into data/raw/legal or data/raw/banking . sync classifies it from the folder, file name, PDF metadata and first pages, appends an entry to the manifest as raw text, validates, then parses, chunks, embeds and indexes only that file. Unchanged files are skipped by hash; modified files are re-indexed and their stale chunks removed; deleted files only warn unless I pass --prune . E3. Why edit the manifest as text? If I re-dumped the YAML, I'd lose comments and could overwrite fields I edited by hand, like marking an Act superseded or adding a source URL. Appending raw text preserves everything; the only automatic change to an existing entry is refreshing its file hash when the file changes. E4. What's the config fingerprint? A 16-character SHA-256 over everything that changes index contents: embedder name and dimension, chunk strategy and its version, sizes, prefix flag, sparse method and parser version. The store records it, and a mismatch raises FingerprintMismatchError , telling me to run sync --force . It prevents mixing 512-dimension hashing vectors with 384-dimension MiniLM vectors. E5. Why write new chunks before deleting old ones? If the process dies between the two steps, the document still has its old chunks instead of none. index_document upserts the new chunks, then calls delete_except with the new chunk IDs. E6. How do chunk IDs work? {doc_id}:{strategy_version}:{index:05d} . They're deterministic, so re-indexing overwrites; in Qdrant I derive a UUID5 point ID from the chunk ID so upserts are idempotent. E7. Memory store or Qdrant, how do they differ? The memory store keeps chunks and vectors in dicts and persists a JSON file: dense search is a dot product over normalised vectors, sparse is BM25 computed in Python. Qdrant keeps named vectors, dense with cosine distance and sparse with hashed term counts and a server-side IDF modifier, plus keyword payload indexes for filters. Both implement the same interface. E8. What did you learn from your real ingestion run? 21 documents gave 26,974 chunks, averaging 75 to 169 tokens with a maximum of 200. It also showed duplicates: the Companies Act, DPDP Act and PMLA each appear twice with identical counts, and the Constitution twice with different counts. Sync classifies by file, not content, so a duplicate check is the next fix. E9. How do you handle scanned PDFs? There's no OCR in this code. parse_pdf flags pages with under 50 characters as low_text , the sync summary lists them, and an upload with no extractable text is rejected. ---"},{"id":"s1-f-language-and-framework-specifics-python-fastapi-typescript","heading":"F. Language and framework specifics (Python, FastAPI, TypeScript)","text":"F1. How do you do dependency injection in FastAPI here? Mostly through the create_app factory and app.state , not Depends . Shared objects, such as the LLM client, embedder, store and session store, are built once in the lifespan and read from request.app.state . Depends is used where it fits naturally, for require_admin . F2. What does the lifespan do? It creates one shared httpx.AsyncClient , wraps the LLM client in the resilience layer, loads the index and embedder (a failure flips readiness to not-ready instead of crashing), optionally runs the startup sync in a thread, builds the pipeline, starts a background session-cleanup task, and cleans everything up on shutdown. F3. How do you handle async and sync code together? The pipeline's prepare() is synchronous because retrieval is CPU work, so I call it through asyncio.to_thread . Streaming is an async for over the LLM's async generator. The session store uses an asyncio.Lock , while the upload store and metrics use threading.Lock because they're touched from threads. F4. How do you use Pydantic? For the manifest schema with enums and validators, request and response models, and settings with pydantic-settings . I used Annotated[list[str], NoDecode] plus a validator so list-valued environment variables accept comma-separated or JSON input. F5. How do you request IDs propagate? A ContextVar set by RequestIDMiddleware ( api/middleware.py ) holds the ID. The middleware validates an incoming X-Request-ID , generates one otherwise, and adds it to every response, error body and log line. F6. How does the frontend consume the stream? web/lib/api.ts POSTs with fetch , gets res.body.getReader() , decodes chunks, splits on blank lines, and parses event: and data: lines into typed events. The Ask page updates the answer as tokens arrive, then replaces the text with the sanitised answer from the citations event. F7. How do you test code that depends on time? I inject the clock. InMemorySessionStore and UploadStore take a time_fn , and the resilience client takes sleep functions, so TTL expiry and backoff are tested instantly, with no real waiting. F8. How do you mock the LLM? The Groq client uses httpx , so tests use httpx.MockTransport to return canned status codes and SSE bodies. There's also an ExtractiveFakeLLM for pipeline and eval smoke tests. ---"},{"id":"s1-g-devops-and-deployment","heading":"G. DevOps and deployment","text":"G1. What does CI do? Three GitHub Actions jobs. test runs uv sync , ruff, pytest, a staged-file guard self-check, an advisory pip-audit , and an eval smoke run on the fixture corpus with thresholds hit@5 ≥ 0.9, mrr ≥ 0.8, abstention_acc ≥ 0.9, citation_valid ≥ 0.9 . web runs npm ci , the TypeScript type check and the build. docker builds the image after tests pass. G2. Is it containerised? There's a multi-stage python:3.11-slim Dockerfile that runs as a non-root user with a /health healthcheck, and a compose file with a volume for the index and an ingest profile. I have to be upfront: I haven't been able to run the build here, and the Dockerfile doesn't install the embeddings extra yet, so a container with the default MiniLM model would fail until I add it. G3. How would you deploy it for free? API on Hugging Face Spaces (Docker, CPU, enough RAM for the model and index) with the index baked into the image at build time, the UI on Vercel pointing at the API URL, and a Groq free-tier key. The index must be built at image build because the free tier has no persistent disk. G4. What monitoring exists? /health and /ready probes, a /v1/metrics endpoint with p50 and p95 per stage, JSON logs with request IDs and stage timings on every ask, and optional JSONL traces that I can look up by request ID through an admin route. They're process-local; a production setup would export to Prometheus or similar. G5. How do you manage configuration across environments? Everything is an environment variable with a safe default, validated by Pydantic at start-up. .env.example lists the knobs; AUTO_SYNC_ON_STARTUP=true is set there for local development and defaults to false in code. G6. What happens on start-up if the index is missing? The app still starts. The embedder and store are placeholders marked not-ready, /ready returns 503, and /v1/ask returns 503 with \"no index loaded.\" If AUTO_SYNC_ON_STARTUP is true, it builds the index from data/raw first. ---"},{"id":"s1-h-improvements","heading":"H. Improvements","text":"H1. What would you add next? First, a real golden set and measured baselines, because I haven't measured retrieval quality on the real corpus. Then tune the abstention threshold, de-duplicate documents during sync, cache the BM25 index, and fix the Docker build. H2. What technical debt do you have? The default abstention threshold of 0.0, per-query BM25 rebuilds in the memory store, process-local sessions and rate limits, a Dockerfile missing the embeddings extra, a stale uv.lock , and the old-to-new law mapping file not being populated. H3. How would you add OCR? I already detect low-text pages during parsing. I'd route those pages through an OCR step before normalisation, keep the OCR confidence in the page stats, and add a text_quality of needs_ocr handling plus a test with a scanned fixture. H4. How would you add multilingual support? Add a language selector in the request, translate the query or use a multilingual embedder, and translate the answer while preserving citation markers, then verify that the marker set is identical before and after. I'd want bilingual legal review for terminology. H5. How would you check that a citation actually supports a claim? Today I only check that the number exists. The offline judge in eval/judge.py already scores citation support with an LLM; I'd run a lightweight version online for high-risk answers, or sample it, trading latency for assurance. H6. How would you scale the corpus to 100k+ documents? Switch to Qdrant server mode, add payload indexes for filters (already created for six fields), shard by domain, batch ingestion in workers, and put the embedding cache on shared storage. I'd also add a cross-encoder reranker over the top 30 to keep precision. H7. What would your v2 be? A measured baseline, deduplicated corpus, an agentic mode for multi-step questions behind a bounded loop, user accounts for document ownership, and Redis-backed sessions so I can run several replicas. ---"},{"id":"s1-i-behavioural","heading":"I. Behavioural","text":"I1. Tell me about the hardest bug. A user asked \"what id dpdp act\" and the system answered that the passages had nothing about a DPDP Act, citing the Motor Vehicles Act. The Act's text never spells the acronym, so neither BM25 nor MiniLM matched it. I derived acronyms from manifest titles, expanded them in query understanding, and made the dense search embed the expansion too. I'm candid that I fixed the mechanism and added tests, but haven't measured its effect on a real golden set. I2. Describe a trade-off you made. Zero-infrastructure in-memory storage versus scalability. I accepted O(N) scans and Python BM25 to keep local setup trivial, and kept a Qdrant adapter behind the same interface so I can scale later without rewriting the pipeline. I3. Tell me about a mistake you caught. While testing the sync command I built an index with the offline hashing embedder, 512 dimensions, in the same data folder my real backend reads, which uses MiniLM at 384. Queries were then compared against vectors from a different embedder, so retrieval was meaningless. The fingerprint exists to refuse mixing embedders at write time, but this showed that a stale index can still be loaded and served silently. My fix list includes making a fingerprint mismatch show as not-ready, and I now keep test indexes in temp directories. I4. How did you handle uncertainty or missing information? I separated what I can show from what I can't. For example, I don't quote retrieval-quality numbers because eval/runs is empty, and I mark the real-run figures, 21 documents and 26,974 chunks, as coming from my own run's screenshots. I5. How do you test your own work? Tests first for the risky parts: fingerprint mismatches, safe-order replacement, streaming retry rules, upload limits, and sync behaviours like preserving manual manifest edits. Then lint and the CI eval gate. I also run the real thing by hand and compare against the screenshots. I6. How did you handle disagreement or feedback? When the interface looked broken I took the screenshot as the spec, reproduced it, and fixed it rather than defending the first version. Similarly, feedback that manual manifest editing was painful led directly to the drop-in sync workflow. ---"},{"id":"s1-j-theory","heading":"J. Theory","text":"J1. What is cosine similarity and why normalise vectors? It's the cosine of the angle between two vectors. If both are L2-normalised, cosine equals the dot product, so I can compute it as a plain dot product, which is what the memory store does. MiniLM is encoded with normalize_embeddings=True and my hashing embedder normalises explicitly. J2. Explain BM25. A term-frequency scoring function with inverse document frequency and length normalisation: idf · tf·(k1+1) / (tf + k1·(1 − b + b·len/avglen)) . I use k1 = 1.5 and b = 0.75 . idf = log(1 + (N − df + 0.5)/(df + 0.5)) . J3. Why does RRF work? Each list contributes 1/(60 + rank) , so an item ranked high in either list scores well, and an item high in both scores best. It ignores raw scores, so it's robust to different scales. The constant dampens the advantage of the very top ranks. J4. What's the complexity of your retrieval? In-memory dense search is O(N·d) for N chunks of dimension d; BM25 as written is O(total tokens) because statistics are rebuilt per call, plus O(N log N) sorting. Qdrant replaces the dense scan with an approximate-nearest-neighbour index, giving sub-linear search. J5. CAP theorem, where does your system sit? It's a single-node system, so the question mostly doesn't apply yet. Sessions and uploads are process-local, so with replicas I'd trade consistency for availability unless I add shared state. The index is read-mostly and rebuilt offline, so eventual consistency across replicas is acceptable if they all load the same fingerprint. J6. What are precision@k, recall@k, MRR and nDCG? Hit@k is whether any gold document appears in the top k; recall@k is the share of gold documents found; MRR is the mean of 1/rank of the first gold hit; nDCG@k rewards putting gold items higher with a logarithmic discount. They're implemented in eval/metrics.py . J7. What's the difference between hallucination and unsupported citation? Hallucination is stating something not in the sources. An unsupported citation is attaching a real passage number to a sentence the passage doesn't support. My online check catches non-existent numbers; checking support needs a judge, which I run offline. J8. Why exponential backoff with jitter? To avoid synchronised retries from many clients hammering a rate-limited service. I use min_wait · 2^attempt plus random jitter capped at max_wait , and honour a Retry-After header when the provider sends one. I only retry timeouts, 429 and 5xx. J9. What is idempotency and where do you rely on it? Repeating an operation gives the same result. Ingestion relies on it: deterministic chunk IDs, content-hash skipping and upserts mean re-running sync on the same files changes nothing."}]},{"title":"Tech Deep Dive","file":"INTERVIEW_TECH_DEEP_DIVE.md","html":"\u003ch1 id=\"s2-technology-deep-dive\">Technology Deep Dive\u003c/h1>\n\u003cp>For each technology: what it is, why it is in this project, how it works inside, and why not the alternative. Project references are to this repository.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-1-fastapi-starlette-and-uvicorn-asgi\">1. FastAPI, Starlette and Uvicorn (ASGI)\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> FastAPI is a Python web framework built on Starlette (the ASGI toolkit) and Pydantic. Uvicorn is the ASGI server that runs it.\u003c/p>\n\u003cp>\u003cstrong>Why I chose it.\u003c/strong> I need async streaming responses (SSE), request validation, and generated OpenAPI docs (\u003ccode>/docs\u003c/code>, which I screenshotted for the report). \u003ccode>create_app()\u003c/code> in \u003ccode>api/main.py:82\u003c/code> is an application factory, so tests inject fakes.\u003c/p>\n\u003cp>\u003cstrong>How it works internally.\u003c/strong> ASGI is a calling convention: an app is \u003ccode>async def app(scope, receive, send)\u003c/code>. Uvicorn parses the HTTP request, builds \u003ccode>scope\u003c/code>, and calls the app; the app sends \u003ccode>http.response.start\u003c/code> and \u003ccode>http.response.body\u003c/code> messages. FastAPI routes the scope to a path operation, validates the body with a Pydantic model, and for a \u003ccode>StreamingResponse\u003c/code> iterates an async generator, sending each yielded string as a body chunk with \u003ccode>more_body=True\u003c/code>. My \u003ccode>AbuseControlMiddleware\u003c/code> (\u003ccode>api/security.py\u003c/code>) is a \u003cem>pure ASGI\u003c/em> middleware: it inspects \u003ccode>scope[\"headers\"]\u003c/code> and either calls the next app or sends its own 413/429 messages, which avoids the overhead and quirks of \u003ccode>BaseHTTPMiddleware\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>Flask\u003c/em> is WSGI: no native async streaming, so SSE needs workarounds. \u003cem>Django\u003c/em> is heavier than I need. \u003cem>Raw Starlette\u003c/em> would work, but I'd lose automatic validation and OpenAPI.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-2-server-sent-events-sse\">2. Server-Sent Events (SSE)\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> A one-way text stream over HTTP with \u003ccode>Content-Type: text/event-stream\u003c/code>, framed as \u003ccode>event: name\\ndata: {...}\\n\\n\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> The answer flows server to client only. SSE gives incremental tokens with a plain HTTP request and works through proxies that allow streaming. My events: \u003ccode>token\u003c/code>, \u003ccode>citations\u003c/code>, \u003ccode>abstained\u003c/code>, \u003ccode>done\u003c/code>, \u003ccode>error\u003c/code> (\u003ccode>api/streaming.py:format_sse\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> The server keeps the response open and writes frames as tokens arrive; a blank line ends a frame. The browser \u003ccode>EventSource\u003c/code> API can only issue GET, so \u003ccode>web/lib/api.ts\u003c/code> uses \u003ccode>fetch\u003c/code> with a \u003ccode>ReadableStream\u003c/code> reader and parses frames itself.\u003c/p>\n\u003cp>\u003cstrong>Why not WebSockets.\u003c/strong> Bidirectional framing and connection state I don't need. \u003cstrong>Why not long-polling.\u003c/strong> Higher latency and more requests.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-3-pydantic-v2-and-pydantic-settings\">3. Pydantic v2 and pydantic-settings\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> Runtime data validation based on type hints (v2 core is written in Rust). \u003ccode>pydantic-settings\u003c/code> loads settings from environment variables and \u003ccode>.env\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> One typed definition for the manifest (\u003ccode>DocumentRecord\u003c/code>), request bodies (\u003ccode>AskRequest\u003c/code>, \u003ccode>FeedbackRequest\u003c/code>), responses (\u003ccode>ErrorResponse\u003c/code>) and configuration (\u003ccode>Settings\u003c/code>, about 70 fields). \u003ccode>SecretStr\u003c/code> keeps API keys out of logs and dumps. \u003ccode>field_validator\u003c/code> handles \u003ccode>llm_provider\u003c/code>, retrieval modes and CORS parsing.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> Models compile to a validator schema at class creation; validation coerces and checks types, constraints (\u003ccode>ge\u003c/code>, \u003ccode>le\u003c/code>, \u003ccode>pattern\u003c/code>, \u003ccode>max_length\u003c/code>) and runs custom validators, raising \u003ccode>ValidationError\u003c/code> with per-field locations (my manifest loader reports \u003ccode>[('field',)]\u003c/code> for each bad record). In settings, \u003ccode>NoDecode\u003c/code> stops pydantic-settings from forcing JSON decoding on a list field, so my own validator can accept comma-separated values.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>dataclasses\u003c/em> give no validation. \u003cem>Marshmallow\u003c/em> is a separate schema layer and wouldn't integrate with FastAPI's OpenAPI generation.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-4-httpx-and-the-groq-api\">4. httpx (and the Groq API)\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> An async-capable HTTP client. Groq exposes an OpenAI-compatible chat-completions endpoint at \u003ccode>https://api.groq.com/openai/v1\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> \u003ccode>GroqClient\u003c/code> (\u003ccode>llm/groq_client.py\u003c/code>) posts \u003ccode>{model, messages, temperature, max_tokens, stream}\u003c/code> with a bearer token, so no vendor SDK is needed. Tests use \u003ccode>httpx.MockTransport\u003c/code> to return canned status codes and streaming bodies with no network.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> With \u003ccode>stream: true\u003c/code> the server returns SSE lines \u003ccode>data: {\"choices\":[{\"delta\":{\"content\":\"...\"}}]}\u003c/code> ending with \u003ccode>data: [DONE]\u003c/code>; the client reads \u003ccode>aiter_lines()\u003c/code>, parses each JSON line and yields the content delta. HTTP errors map to typed exceptions: 401/403 → \u003ccode>LLMAuthError\u003c/code>, 429 → \u003ccode>LLMRateLimitError(retry_after)\u003c/code>, 5xx → \u003ccode>LLMProviderError(status)\u003c/code>, timeouts → \u003ccode>LLMTimeoutError\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> The official \u003ccode>groq\u003c/code>/\u003ccode>openai\u003c/code> SDKs add a dependency and hide behaviour I want to test. \u003cem>requests\u003c/em> is synchronous and can't stream asynchronously.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-5-retry-with-exponential-backoff-and-jitter-llm-resilience-p\">5. Retry with exponential backoff and jitter (\u003ccode>llm/resilience.py\u003c/code>)\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> A wrapper class \u003ccode>ResilientLLMClient\u003c/code> around any \u003ccode>LLMClient\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> Providers return 429 and transient 5xx. \u003ccode>is_transient_error\u003c/code> retries only timeouts, rate limits and 5xx, never 401/403/4xx (\u003ccode>resilience.py:25\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> Wait = \u003ccode>min(min_wait · 2^attempt + U(0, 0.5·min_wait), max_wait)\u003c/code>, or the provider's \u003ccode>Retry-After\u003c/code> when present (\u003ccode>calculate_backoff\u003c/code>, line 43). Defaults: 3 retries, 0.5 s to 8 s. For streams, the key rule is lines 123-136: once any token has been yielded, an exception is re-raised without retry, because restarting would duplicate or corrupt text the user already saw. Before the first token it's safe to retry.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> Libraries like \u003ccode>tenacity\u003c/code> are fine, but the stream rule is domain-specific, and the sleep functions need to be injectable for instant tests.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-6-pymupdf-fitz\">6. PyMuPDF (\u003ccode>fitz\u003c/code>)\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> Python bindings for MuPDF, a C PDF renderer and text extractor.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> Fast text extraction with page numbers and no external services. \u003ccode>parse_pdf\u003c/code> (\u003ccode>ingestion/parser.py\u003c/code>) reads \u003ccode>page.get_text(\"text\")\u003c/code> per page and marks pages with under 50 characters as \u003ccode>low_text\u003c/code>. \u003ccode>classify.py\u003c/code> also reads PDF metadata and the first three pages.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> MuPDF parses the PDF's page content streams and font encodings, then reconstructs text in reading order. It extracts embedded text only; scanned pages without a text layer return nothing, which is why I flag low-text pages.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>pdfminer.six\u003c/em> is slower and more verbose; \u003cem>PyPDF\u003c/em> is weaker at layout. \u003cem>OCR stacks\u003c/em> (Tesseract) solve a different problem and aren't in this codebase. Note the licence (AGPL or commercial): worth checking before commercial deployment.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-7-sentence-transformers-and-all-minilm-l6-v2\">7. Sentence-Transformers and \u003ccode>all-MiniLM-L6-v2\u003c/code>\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> A library for sentence embeddings; \u003ccode>all-MiniLM-L6-v2\u003c/code> is a 6-layer, 384-dimensional transformer distilled from MiniLM and trained with contrastive learning on over a billion sentence pairs. It truncates input at 256 word pieces by default.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> Small and CPU-friendly (about 90 MB), a strong baseline, and it's the default \u003ccode>embedding_model\u003c/code>. My \u003ccode>chunk_max_tokens\u003c/code> of 256 lines up with its input limit. It sits behind the \u003ccode>Embedder\u003c/code> interface (\u003ccode>retrieval/embedder.py\u003c/code>), and I call \u003ccode>encode(..., normalize_embeddings=True, batch_size=32)\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> The text is tokenised into word pieces, passed through the transformer, and the token outputs are mean-pooled into one vector; normalisation makes it unit length so a dot product equals cosine similarity. Similar meanings land close together in the 384-dimensional space.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>OpenAI embeddings\u003c/em> add cost and send text off-box. \u003cem>Larger models\u003c/em> (bge, e5-large) are better on benchmarks but slower; I haven't run a bake-off on my real corpus (the \u003ccode>bakeoff\u003c/code> command exists), so I can't claim MiniLM is optimal. \u003cstrong>Known limitation:\u003c/strong> an embedding model doesn't know an acronym the text never contains. That caused the \"DPDP\" failure.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-8-the-hashing-embedder\">8. The hashing embedder\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> A deterministic bag-of-words embedder: each token is MD5-hashed to one of 512 buckets with a ±1 sign, then the vector is L2-normalised (\u003ccode>embedder.py:25-50\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> CI and tests must not download a model. It's explicitly not semantic: it only captures word overlap.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> The \"hashing trick\" avoids a vocabulary; the sign bit reduces collision bias. Two texts sharing words have a positive dot product.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> Random vectors don't preserve overlap; a real model needs a download and nondeterministic hardware paths.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-9-bm25-sparse-retrieval\">9. BM25 (sparse retrieval)\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> A ranking function: \u003ccode>score = Σ idf(t) · tf·(k1+1) / (tf + k1·(1 − b + b·len/avglen))\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> Exact identifiers (\"Section 66A\", \"Data Fiduciary\") matter in law. The in-memory store implements it in pure Python with \u003ccode>k1 = 1.5\u003c/code>, \u003ccode>b = 0.75\u003c/code> (\u003ccode>memory_store.py:121-143\u003c/code>); Qdrant uses hashed term counts plus an IDF modifier (\u003ccode>qdrant_store.py:31\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> Term frequency saturates (diminishing returns for repeats), IDF down-weights common terms, and length normalisation stops long chunks winning by volume. \u003cstrong>Caveat in my code:\u003c/strong> I rebuild the term counters and document frequencies on every query, an O(corpus) cost I'd cache.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>Elasticsearch/OpenSearch\u003c/em> is more infrastructure than a local project needs. \u003cem>TF-IDF\u003c/em> lacks saturation and length normalisation.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-10-reciprocal-rank-fusion\">10. Reciprocal Rank Fusion\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> A rank-aggregation method: \u003ccode>RRF(d) = Σ w_i / (k0 + rank_i(d))\u003c/code> with \u003ccode>k0 = 60\u003c/code> (\u003ccode>hybrid.py:13-28\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> Combines the dense and sparse lists without calibrating scores. It also keeps the maximum dense score per chunk so the abstention gate still sees a cosine value.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> Each list contributes a smaller amount the lower a chunk ranks; chunks that appear in both lists get two contributions. Then \u003ccode>cap_per_doc\u003c/code> limits each document to 3 results for diversity.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>Weighted score fusion\u003c/em> needs normalisation of incomparable scores; \u003cem>learned rankers\u003c/em> need training data I don't have.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-11-qdrant\">11. Qdrant\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> An open-source vector database written in Rust.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> An optional backend (\u003ccode>vector_store_backend=qdrant\u003c/code>) for scale: named vectors (\u003ccode>dense\u003c/code> cosine, \u003ccode>sparse\u003c/code> with IDF), payload filters, and local or server mode. My adapter (\u003ccode>retrieval/qdrant_store.py\u003c/code>) derives deterministic UUID5 point IDs from chunk IDs so upserts overwrite, and stores the config fingerprint in collection metadata.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> Dense vectors are indexed with HNSW (a layered proximity graph) for approximate nearest-neighbour search; payload fields marked as keyword indexes make filtered queries (\u003ccode>domain\u003c/code>, \u003ccode>status\u003c/code>, \u003ccode>section_or_article_no\u003c/code>) fast. Sparse vectors are stored as index/value lists and scored with a dot product, with \u003ccode>Modifier.IDF\u003c/code> applying inverse document frequency server-side.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>Chroma/FAISS\u003c/em> are fine for prototypes but lack Qdrant's filtering and hybrid support; \u003cem>pgvector\u003c/em> ties me to Postgres; \u003cem>Pinecone\u003c/em> is hosted-only. I haven't benchmarked them against each other.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-12-sqlite-embedding-cache\">12. SQLite (embedding cache)\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> An embedded, serverless SQL database in a single file (stdlib \u003ccode>sqlite3\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> \u003ccode>ingestion/cache.py\u003c/code> stores \u003ccode>emb(model, key, vec)\u003c/code> with primary key \u003ccode>(model, key)\u003c/code>. Re-indexing a changed document only embeds new text; switching models doesn't collide.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> WAL-less default journaling, a B-tree on the primary key; reads batch 500 keys per \u003ccode>IN (...)\u003c/code> query; vectors are stored as JSON text.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> \u003cem>Redis\u003c/em> adds a server; \u003cem>a pickle file\u003c/em> isn't concurrent-safe or queryable; \u003cem>Postgres\u003c/em> is overkill.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-13-yaml-manifest-and-text-level-editing\">13. YAML manifest and text-level editing\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> A human-editable document registry parsed with PyYAML.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> Metadata needs review in git and manual overrides (marking an Act superseded). \u003ccode>manifest_edit.py\u003c/code> appends, removes and re-hashes entries as \u003cem>text\u003c/em>, so comments and ordering survive.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> \u003ccode>append_entries\u003c/code> detects the list indentation of the existing file and prefixes the dumped entry with a comment; \u003ccode>remove_entry\u003c/code> finds the entry's block by indentation; \u003ccode>replace_file_hash\u003c/code> replaces a unique 64-hex string.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> Re-dumping with \u003ccode>yaml.safe_dump\u003c/code> would drop comments and reorder keys; \u003ccode>ruamel.yaml\u003c/code> preserves them but adds a dependency.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-14-asyncio-and-threading\">14. asyncio and threading\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> Cooperative concurrency (\u003ccode>asyncio\u003c/code>) plus OS threads for CPU work.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> The event loop must never block. \u003ccode>prepare()\u003c/code> (embedding plus search) runs via \u003ccode>asyncio.to_thread\u003c/code>; the LLM stream is natively async; background cleanup is an \u003ccode>asyncio.create_task\u003c/code>. The session store uses \u003ccode>asyncio.Lock\u003c/code>; the upload store and metrics use \u003ccode>threading.Lock\u003c/code> because threads touch them.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> \u003ccode>to_thread\u003c/code> submits to the default thread-pool executor and awaits the future, freeing the loop. A cancelled request raises \u003ccode>CancelledError\u003c/code>, which I re-raise so cleanup in \u003ccode>finally\u003c/code> runs and metrics still record.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> Running CPU work directly in the handler would freeze every other request; multiprocessing would complicate in-memory state.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s2-15-next-js-react-and-typescript\">15. Next.js, React and TypeScript\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> React is a UI library; Next.js a framework on top of it (routing, bundling); TypeScript adds static types.\u003c/p>\n\u003cp>\u003cstrong>Why.\u003c/strong> \u003ccode>web/\u003c/code> (Next ^16.4.6, React ^19.3.1, TS ^5.9.3) provides Ask, Metrics and Documents pages. Types in \u003ccode>lib/types.ts\u003c/code> mirror the API's event shapes so changes break the build, not production. CI runs \u003ccode>npm run typecheck\u003c/code> and \u003ccode>npm run build\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>How it works.\u003c/strong> The App Router maps \u003ccode>app/page.tsx\u003c/code>, \u003ccode>app/metrics/page.tsx\u003c/code> and \u003ccode>app/documents/page.tsx\u003c/code> to routes; client components keep shared state in a context (\u003ccode>AppContext\u003c/code>); \u003ccode>lib/api.ts\u003c/code> consumes the SSE stream with a \u003ccode>ReadableStream\u003c/code> reader.\u003c/p>\n\u003cp>\u003cstrong>Why not the alternative.\u003c/strong> The older static page (\u003ccode>frontend/index.html\u003c/code>, 134 lines, still served at \u003ccode>/ui\u003c/code>) has no types or components. \u003cem>Streamlit/Gradio\u003c/em> would be faster to build but harder to customise (clickable citation markers, source pane
