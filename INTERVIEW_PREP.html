──────────┘ ▼ validate manifest ▼ fingerprint == index? ──no──► \"run sync --force\" │yes ▼ parse (PyMuPDF) → normalize JSON → chunk (s0..s3) → embed (SQLite cache) ▼ upsert NEW chunks → delete STALE chunks → persist index ▼ summary: added / updated / skipped / removed / low-text / chunks Drawing order. (1) the folder at the top; (2) the \"known?\" fork; (3) the classify branch on the left; (4) the hash branch on the right; (5) validation and the fingerprint diamond; (6) the four processing boxes in a row; (7) the safe-order write; (8) the summary. Narration. \"I made ingestion idempotent and incremental. A file is processed only if it's new or its hash changed. A config fingerprint refuses to mix embedders. New chunks are written before stale ones are deleted, so a crash never leaves a document empty.\" ---"},{"id":"s4-diagram-4-data-model","heading":"Diagram 4: Data model","text":"manifest.yaml (source of truth) data/processed/\u003cdoc_id .json ┌───────────────────────────┐ ┌────────────────────────┐ │ doc_id (slug, PK) │ │ pages[ blocks[type,text]] │ title, doc_type, domain │──parse────► │ stats{low_text_pages} │ │ path, file_hash (sha256) │ │ source_file_hash │ │ status, superseded_by │ │ parser_version │ │ year, source_url, ... │ └───────────┬────────────┘ └─────────────┬─────────────┘ │ chunk │ metadata copied ▼ │ ┌──────────────────────────────────┐ └─────────────────────►│ Chunk │ │ chunk_id = doc:strategy:00042 │ │ text, embed_text (\"Title Sec\") │ │ metadata: section_or_article_no, │ │ heading_path, page_start/end, │ │ chunk_type, status, domain, │ │ file_hash, config_fingerprint │ │ vector (384-d) │ └───────────────┬──────────────────┘ │ index.json (memory) Qdrant: vectors {dense cosine, sparse IDF} payload indexes: domain, doc_type, status, doc_id, chunk_id, section_or_article_no data/cache/embeddings.sqlite: emb(model, key=sha256(text), vec) PK (model,key) Drawing order. (1) manifest box; (2) arrow to the normalized JSON; (3) arrow to the Chunk box; (4) list the six metadata fields that drive filters and citations; (5) the two storage backends; (6) the SQLite cache off to the side. Narration. \"The manifest is the source of truth and the index is derived. Every chunk carries the document's metadata plus its section and page, which is what makes filtering by status or domain and citing the exact page possible.\" ---"},{"id":"s4-diagram-5-scaling-path","heading":"Diagram 5: Scaling path","text":"TODAY 10x 100x / 1000x ┌───────────────┐ ┌──────────────────────┐ ┌────────────────────────────────┐ │ 1 process │ │ LB → API ×3 │ │ Gateway → API fleet (autoscale)│ │ memory index │──►│ Qdrant (1 node, HNSW)│──►│ Qdrant cluster (shard by domain)│ │ in-proc state │ │ Redis: sessions, │ │ Redis cluster │ │ MiniLM in-proc│ │ rate limit │ │ Embedding service (GPU/ONNX) │ └───────────────┘ │ worker: ingestion │ │ LLM gateway: queue, fallback, │ bottleneck: └──────────────────────┘ │ response cache │ O(N) scan, BM25 bottleneck: LLM └────────────────────────────────┘ rebuilt per query, latency + rate limits bottleneck: cost + provider limits state in memory Drawing order. Three columns left to right. Under each, write its bottleneck in one line. Add the fix arrow between columns. Narration. \"Today's limits are in the in-memory store and process-local state. First fix is Qdrant plus Redis, which my interfaces already allow. After that the bottleneck is the LLM: queueing, caching, fallback providers, and cost.\" ---"},{"id":"s4-diagram-6-failure-handling","heading":"Diagram 6: Failure handling","text":"LLM call ──► transient? (timeout, 429, 5xx) │yes │no (401/403/4xx) ▼ ▼ before first token? raise typed error │yes │no │ ▼ ▼ ▼ backoff+jitter abort, no retry SSE error LLM_ERROR (≤3 tries, (partial text (generic message + Retry-After) already shown) request_id) Startup ──► embedder/index load fails? ──► placeholders, /ready 503, /v1/ask 503 Request ──► rate 60/min/IP ──► 429 + Retry-After ──► body too large ──► 413 Upload ──► bad type/magic/size/pages/chunks ──► 415/413/422 (temp dir removed) Index ──► fingerprint mismatch at sync ──► refuse, \"run sync --force\" Drawing order. (1) the LLM decision tree first, since it's the interesting one; (2) add the four one-line guards beneath. Narration. \"Retries are conditional: only transient errors, only before the first token. After that I can't un-send text, so I surface an error event instead. Startup failures never crash the server; they flip readiness so an orchestrator stops routing traffic.\" ---"},{"id":"s4-diagram-7-trade-off-comparison","heading":"Diagram 7: Trade-off comparison","text":"RETRIEVAL STORE ┌────────┬────────┬────────┐ ┌──────────────┬──────────────┬───────────────┐ │ │ Dense │ BM25 │ │ │ In-memory │ Qdrant │ ├────────┼────────┼────────┤ ├──────────────┼──────────────┼───────────────┤ │Synonyms│ good │ poor │ │ Setup │ none │ service/local │ │Exact id│ poor │ good │ │ Search │ O(N) scan │ HNSW ANN │ │Acronym │ poor │ poor │ │ Filters │ Python loop │ payload index │ │Cost │ embed │ cheap │ │ Scale │ ~10^4-10^5 │ 10^6+ │ └────────┴────────┴────────┘ │ Persistence │ JSON file │ on disk/server│ Hybrid = both lists + RRF └──────────────┴──────────────┴───────────────┘ fixed by title-derived acronym expansion Drawing order. Draw the left table and fill the three rows; then the right table. Circle \"Hybrid = both + RRF\". Narration. \"Neither retrieval mode wins on its own, so I fuse them. For storage I defaulted to zero setup and kept the interface so Qdrant is a config change when scale or filter speed matters.\" ---"},{"id":"s4-diagram-8-chunking-decision-tree","heading":"Diagram 8: Chunking decision tree","text":"doc_type ├─ statute constitution rule scheme ─► s1: split at \"Section N\" / \"Article N\" ├─ judgment ───────────────────────────────► s2: group numbered paragraphs (≤ 800 chars) ├─ circular master_direction faq │ mapping_table report ─────────────────► s3: split at headings └─ anything else ──────────────────────────► s0: 800-char windows, 150 overlap every strategy: drop contents pages → cap 256 tokens → add prefix \"Title Section\" Drawing order. Root node doc_type , four branches, then the shared post-processing line. Narration. \"Chunk boundaries follow how lawyers cite: sections for statutes, numbered paragraphs for judgments, headings for directions and reports. If no markers are found, a strategy falls back to plain windows.\" ---"},{"id":"s4-diagram-9-rrf-worked-example","heading":"Diagram 9: RRF worked example","text":"dense list: A(1) B(2) C(3) D(4) sparse list: C(1) A(2) E(3) B(4) score(A) = 1/(60+1) + 1/(60+2) = 0.01639 + 0.01613 = 0.03252 score(C) = 1/(60+3) + 1/(60+1) = 0.01587 + 0.01639 = 0.03226 score(B) = 1/(60+2) + 1/(60+4) = 0.01613 + 0.01563 = 0.03176 score(D) = 1/(60+4) = 0.01563 score(E) = 1/(60+3) = 0.01587 fused: A, C, B, E, D → cap 3 per doc → top-5 Drawing order. Two ranked columns, then the formula, then the computed scores, then the fused order. Narration. \"A chunk in both lists beats one that's top in a single list, and I never compare a cosine score to a BM25 score.\""}]}];
(function clientMain(DATA) {
  var current = 0;
  var side = document.getElementById("side");
  var content = document.getElementById("content");
  var results = document.getElementById("results");
  var nav = document.getElementById("nav");
  var subtoc = document.getElementById("subtoc");
  var q = document.getElementById("q");

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  DATA.forEach(function (s, i) {
    var b = el("button", "navbtn", esc(s.title));
    b.addEventListener("click", function () { show(i); side.classList.remove("open"); });
    b.id = "nav" + i;
    nav.appendChild(b);
    var sec = el("section", "sec");
    sec.id = "sec" + i;
    var toc = el("details", "toc");
    toc.innerHTML = "<summary>Table of contents (" + s.toc.length + ")</summary><ul>" + s.toc.map(function (h) {
      return '<li class="l' + h.level + '"><a href="#' + h.id + '" data-id="' + h.id + '">' + esc(h.text) + "</a></li>";
    }).join("") + "</ul>";
    sec.appendChild(toc);
    var body = el("div", "md", s.html);
    sec.appendChild(body);
    content.appendChild(sec);
  });

  function show(i, anchor) {
    current = i;
    DATA.forEach(function (_, j) {
      document.getElementById("sec" + j).style.display = j === i ? "block" : "none";
      document.getElementById("nav" + j).classList.toggle("active", j === i);
    });
    subtoc.innerHTML = "";
    DATA[i].toc.filter(function (h) { return h.level === 2; }).forEach(function (h) {
      var a = el("a", "sub", esc(h.text));
      a.href = "#" + h.id;
      a.addEventListener("click", function (ev) { ev.preventDefault(); goto(h.id); side.classList.remove("open"); });
      subtoc.appendChild(a);
    });
    results.style.display = "none";
    content.style.display = "block";
    if (anchor) goto(anchor);
    else window.scrollTo(0, 0);
    history.replaceState(null, "", "#sec" + i);
  }

  function goto(id) {
    var t = document.getElementById(id);
    if (!t) return;
    t.scrollIntoView({ behavior: "smooth", block: "start" });
    t.classList.remove("flash");
    void t.offsetWidth;
    t.classList.add("flash");
  }

  content.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("a[data-id]");
    if (a) { ev.preventDefault(); goto(a.getAttribute("data-id")); }
  });

  // full-text search: every word must appear in a section entry
  var index = [];
  DATA.forEach(function (s, i) {
    s.entries.forEach(function (e) {
      index.push({ sec: i, id: e.id, heading: e.heading, text: e.text, low: (e.heading + " " + e.text).toLowerCase() });
    });
  });

  function snippet(text, words) {
    var low = text.toLowerCase();
    var pos = -1;
    for (var k = 0; k < words.length; k++) {
      var p = low.indexOf(words[k]);
      if (p >= 0 && (pos < 0 || p < pos)) pos = p;
    }
    var start = Math.max(0, pos - 60);
    var s = text.slice(start, start + 220);
    s = esc(s);
    words.forEach(function (w) {
      if (!w) return;
      var re = new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      s = s.replace(re, "<mark>$1</mark>");
    });
    return (start > 0 ? "… " : "") + s + (start + 220 < text.length ? " …" : "");
  }

  function search(term) {
    var words = term.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) { show(current); return; }
    var hits = index.filter(function (e) {
      return words.every(function (w) { return e.low.indexOf(w) >= 0; });
    });
    content.style.display = "none";
    results.style.display = "block";
    results.innerHTML = "";
    results.appendChild(el("h2", "", hits.length + " result" + (hits.length === 1 ? "" : "s") + " for “" + esc(term) + "”"));
    hits.slice(0, 60).forEach(function (h) {
      var r = el("div", "hit");
      r.innerHTML = '<div class="hs">' + esc(DATA[h.sec].title) + '</div><div class="hh">' + esc(h.heading) + '</div><div class="ht">' + snippet(h.text, words) + "</div>";
      r.addEventListener("click", function () { q.value = ""; show(h.sec, h.id); });
      results.appendChild(r);
    });
    if (hits.length > 60) results.appendChild(el("p", "muted", "Showing the first 60. Refine the search."));
  }

  var timer = null;
  q.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { search(q.value.trim()); }, 120);
  });
  document.addEventListener("keydown", function (ev) {
    var tag = (ev.target.tagName || "").toLowerCase();
    if (ev.key === "/" && tag !== "input") { ev.preventDefault(); q.focus(); }
    if (ev.key === "Escape") { q.value = ""; show(current); q.blur(); }
  });
  document.getElementById("burger").addEventListener("click", function () { side.classList.toggle("open"); });

  var m = location.hash.match(/^#sec(\d+)$/);
  show(m && DATA[Number(m[1])] ? Number(m[1]) : 0);
})(DATA);</script></body></html>
