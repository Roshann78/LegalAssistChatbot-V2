@media print{#side,#top{display:none}body{background:#fff;color:#000}}</style></head><body><div id="top"><button id="burger" type="button">Menu</button> <span class="muted">Interview Prep</span></div><div class="app"><aside id="side"><h1>Legal Assist RAG<br><span class="muted" style="font-weight:400;font-size:13px">Interview prep</span></h1><input id="q" type="search" placeholder="Search everything…" autocomplete="off"><div class="hint">Press / to search, Esc to clear</div><nav id="nav"></nav><div id="subtoc"></div></aside><main id="main"><div id="results" style="display:none"></div><article id="content"></article></main></div><script>var DATA = [{"title":"Master Guide","file":"INTERVIEW_GUIDE.md","html":"\u003ch1 id=\"s0-legal-assist-rag-interview-guide-master-document\">Legal Assist RAG: Interview Guide (Master Document)\u003c/h1>\n\u003cp>Everything here is taken from this repository. File and line references are to the code as committed (\u003ccode>src/legal_rag/...\u003c/code>). Where a number comes from a screenshot of a real run rather than from code, it says so.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s0-1-the-30-second-elevator-pitch-say-this-out-loud\">1. The 30-second elevator pitch (say this out loud)\u003c/h2>\n\u003cblockquote>\u003cp>\"I built a retrieval-augmented generation system for Indian legal and banking questions. You ask a question; it searches a corpus of statutes, judgments and RBI documents with hybrid dense-plus-keyword search, sends only the best passages to an LLM, and streams back an answer where every claim carries a numbered citation I can validate. If the evidence is missing it says so instead of guessing. It's a FastAPI service with server-sent-event streaming, a Next.js interface, a drop-in ingestion pipeline that classifies new PDFs and indexes only what changed, and an evaluation harness with a CI regression gate. About 6,500 lines of Python, 218 tests, 21 documents and roughly 27,000 indexed chunks on my real run.\"\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s0-2-system-architecture\">2. System architecture\u003c/h2>\n\u003cpre>\u003ccode class=\"lang-\">                         ┌─────────────────────────────┐\n                         │  Next.js UI (web/, :3010)   │   static UI /ui (frontend/index.html)\n                         │  fetch + ReadableStream SSE │\n                         └───────────────┬─────────────┘\n                                         │ POST /v1/ask   (SSE)    POST /v1/documents/upload\n                                         ▼\n┌───────────────────────────────────────────────────────────────────────────────────────────┐\n│ FastAPI app  (api/main.py: create_app + lifespan)                                         │\n│  RequestIDMiddleware ► AbuseControlMiddleware (rate limit, body size) ► CORS              │\n│  routes.py: ask / upload / delete session / stats / metrics / feedback / admin            │\n│  sessions.py (TTL+LRU)   uploads.py (ephemeral per-file index)   metrics   tracing        │\n└───────┬───────────────────────────────────────────┬───────────────────────────────────────┘\n        │ prepare() in a thread                     │ stream() async\n        ▼                                           ▼\n┌──────────────────────────────┐          ┌───────────────────────────────┐\n│ generation/pipeline.py       │          │ llm/resilience.py             │\n│  1 understand (query.py)     │          │  retry+backoff, no retry after│\n│  2 retrieve  (hybrid.py)     │          │  first token                  │\n│  3 pin exact sections        │          │ llm/groq_client.py (httpx)    │\n│  4 gate (abstain_threshold)  │─────────►│  Groq chat-completions, SSE   │\n│  5 build_messages (prompts)  │          └───────────────────────────────┘\n│  6 validate citations        │\n└───────┬──────────────────────┘\n        ▼\n┌──────────────────────────────────────────────────────────────┐\n│ retrieval/                                                   │\n│  Retriever: dense + sparse → RRF (k0=60) → per-doc cap 3     │\n│  → optional rerank (lexical | cross-encoder) → top-k (5)     │\n│  VectorStore interface: InMemoryVectorStore | QdrantVectorStore\n│  Embedder: SentenceTransformer (all-MiniLM-L6-v2) | Hashing-512\n└──────────────────────────────────────────────────────────────┘\n        ▲ index built by\n┌──────────────────────────────────────────────────────────────┐\n│ ingestion/  (CLI: python -m legal_rag.ingestion sync)        │\n│  data/raw/{legal,banking}/*.pdf ─► classify.py ─► manifest   │\n│  parser.py (PyMuPDF) ─► normalize.py (JSON) ─► chunking.py   │\n│  ─► embed via SQLite cache (cache.py) ─► store.upsert        │\n│  fingerprint check, safe-order replace, hash-based skipping  │\n└──────────────────────────────────────────────────────────────┘\n   data/manifest.yaml · data/processed/{&lt;doc&gt;.json,index.json} · data/cache/embeddings.sqlite\u003c/code>\u003c/pre>\n\u003cp>Request path in one line: \u003cstrong>question → understand → hybrid retrieve → (pin exact sections) → abstain gate → numbered prompt → streamed LLM tokens → citation validation → SSE \u003ccode>citations\u003c/code> + \u003ccode>done\u003c/code>.\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch2 id=\"s0-3-every-module-explained\">3. Every module, explained\u003c/h2>\n\u003ch3 id=\"s0-3-1-config-settings-py-248-lines\">3.1 \u003ccode>config/settings.py\u003c/code> (248 lines)\u003c/h3>\n\u003cul>\u003cli>One \u003ccode>Settings(BaseSettings)\u003c/code> class; ~70 fields, all overridable by environment variable or \u003ccode>.env\u003c/code>. \u003ccode>env_ignore_empty=True\u003c/code> so blank lines in \u003ccode>.env.example\u003c/code> do not override defaults.\u003c/li>\u003cli>\u003ccode>cors_origins\u003c/code> uses \u003ccode>Annotated[list[str], NoDecode]\u003c/code> plus a validator, so \u003ccode>CORS_ORIGINS=http://a,http://b\u003c/code> and a JSON list both work. This fixed a real startup crash; there is a regression test.\u003c/li>\u003cli>Secrets (\u003ccode>llm_api_key\u003c/code>, \u003ccode>admin_api_key\u003c/code>) are \u003ccode>SecretStr\u003c/code>, so model dumps print \u003ccode>**********\u003c/code>.\u003c/li>\u003cli>Notable defaults: \u003ccode>chunk_size 800\u003c/code>, \u003ccode>chunk_overlap 150\u003c/code>, \u003ccode>chunk_max_tokens 256\u003c/code>, \u003ccode>retrieval_top_k 5\u003c/code>, \u003ccode>retrieval_candidates 30\u003c/code>, \u003ccode>retrieval_per_doc_cap 3\u003c/code>, \u003ccode>abstain_threshold 0.0\u003c/code> (\u003ccode>settings.py:68-70\u003c/code>), \u003ccode>domain_router False\u003c/code>, \u003ccode>auto_sync_on_startup False\u003c/code>.\u003c/li>\u003cli>\u003ccode>get_settings()\u003c/code> is cached, so the app reads config once.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s0-3-2-ingestion-ingestion-pipeline\">3.2 \u003ccode>ingestion/\u003c/code> (ingestion pipeline)\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>File\u003c/th>\u003cth>Lines\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>schema.py\u003c/code>\u003c/td>\u003ctd>105\u003c/td>\u003ctd>Pydantic \u003ccode>DocumentRecord\u003c/code> (the manifest row) with enums \u003ccode>DocType\u003c/code> (10 values), \u003ccode>Domain\u003c/code>, \u003ccode>Status\u003c/code> (in_force/amended/superseded/repealed), \u003ccode>SourceType\u003c/code>, \u003ccode>TextQuality\u003c/code>; \u003ccode>check_consistency()\u003c/code> rules (superseded needs \u003ccode>superseded_by\u003c/code>; judgments need a court).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>manifest.py\u003c/code>\u003c/td>\u003ctd>75\u003c/td>\u003ctd>\u003ccode>load_manifest\u003c/code>, \u003ccode>validate_manifest\u003c/code> (duplicates, missing files, hash drift, \u003ccode>superseded_by\u003c/code> links), \u003ccode>sha256_file\u003c/code>, \u003ccode>draft_entries\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>manifest_edit.py\u003c/code>\u003c/td>\u003ctd>81\u003c/td>\u003ctd>Text-level edits: \u003ccode>append_entries\u003c/code>, \u003ccode>remove_entry\u003c/code>, \u003ccode>replace_file_hash\u003c/code>. The manifest is edited as text, not re-dumped, so comments and manual edits survive.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>classify.py\u003c/code>\u003c/td>\u003ctd>194\u003c/td>\u003ctd>Infers \u003ccode>doc_id\u003c/code>, \u003ccode>domain\u003c/code>, \u003ccode>doc_type\u003c/code>, \u003ccode>title\u003c/code>, \u003ccode>year\u003c/code> from folder, file name, PDF metadata and the first 3 pages (PyMuPDF). Ordered keyword rules (\u003ccode>_NAME_RULES\u003c/code>, \u003ccode>_TEXT_RULES\u003c/code>); defaults \u003ccode>statute\u003c/code> (legal) / \u003ccode>circular\u003c/code> (banking).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>parser.py\u003c/code>\u003c/td>\u003ctd>78\u003c/td>\u003ctd>\u003ccode>parse_pdf\u003c/code> (PyMuPDF per page, flags \u003ccode>low_text\u003c/code> pages under 50 chars), \u003ccode>parse_text\u003c/code>, \u003ccode>clean_pages\u003c/code> (removes repeated headers/footers, bare page numbers, de-hyphenates). \u003ccode>PARSER_VERSION = \"pymupdf-1\"\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>normalize.py\u003c/code>\u003c/td>\u003ctd>108\u003c/td>\u003ctd>Turns pages into typed blocks (heading / list / paragraph) saved as \u003ccode>data/processed/&lt;doc_id&gt;.json\u003c/code>; re-parsed only if file hash or parser version changes (\u003ccode>ensure_normalized\u003c/code>, atomic temp-file rename).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>chunking.py\u003c/code>\u003c/td>\u003ctd>253\u003c/td>\u003ctd>Four strategies. \u003cstrong>s0\u003c/strong> fixed windows (800 chars, 150 overlap, snapping to paragraph/sentence/space); \u003cstrong>s1\u003c/strong> per \u003ccode>Section N\u003c/code> / \u003ccode>Article N\u003c/code> (statutes, constitution, rules, schemes); \u003cstrong>s2\u003c/strong> numbered-paragraph grouping for judgments; \u003cstrong>s3\u003c/strong> heading-based (circulars, directions, FAQs, reports). \u003ccode>is_toc_page\u003c/code> drops contents pages; \u003ccode>_enforce_max\u003c/code> shrinks any chunk over 256 tokens. Chunk ID = \u003ccode>{doc_id}:{strategy_version}:{i:05d}\u003c/code>. Embedded text gets a contextual prefix \u003ccode>Title &gt; Section\u003c/code> (\u003ccode>chunking.py:251\u003c/code>).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cache.py\u003c/code>\u003c/td>\u003ctd>48\u003c/td>\u003ctd>SQLite embedding cache keyed \u003ccode>(model, sha256(text))\u003c/code>; batches of 500 on read.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>indexer.py\u003c/code>\u003c/td>\u003ctd>199\u003c/td>\u003ctd>\u003ccode>Indexer.index_document\u003c/code>: skip if stored hash equals file hash; chunk, embed through the cache in batches of 64, \u003ccode>upsert\u003c/code> new chunks first, then \u003ccode>delete_except\u003c/code> stale ones (\"safe order\"). \u003ccode>config_fingerprint()\u003c/code> hashes embedder, dim, strategy, sizes, prefix flag, sparse method and parser version.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sync.py\u003c/code>\u003c/td>\u003ctd>189\u003c/td>\u003ctd>\u003ccode>run_sync\u003c/code>: classify new files and append to manifest, refresh hash of modified files, validate, fingerprint check (refuse with \"run sync --force\"), index only new/changed, warn or prune deleted files, summary. \u003ccode>startup_sync\u003c/code> never raises.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cli.py\u003c/code>\u003c/td>\u003ctd>238\u003c/td>\u003ctd>Commands: \u003ccode>sync [--prune --force]\u003c/code>, \u003ccode>validate\u003c/code>, \u003ccode>draft\u003c/code>, \u003ccode>list\u003c/code>, \u003ccode>status\u003c/code>, \u003ccode>stats\u003c/code>, \u003ccode>verify\u003c/code>, \u003ccode>parse\u003c/code>, \u003ccode>add\u003c/code>, \u003ccode>update\u003c/code>, \u003ccode>remove\u003c/code>, \u003ccode>reindex --all\u003c/code>, \u003ccode>report\u003c/code>, \u003ccode>lookup\u003c/code>; global \u003ccode>--dry-run\u003c/code>, \u003ccode>--yes\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>report.py\u003c/code>\u003c/td>\u003ctd>88\u003c/td>\u003ctd>Writes \u003ccode>docs/ingestion_report.md\u003c/code> and a section lookup by metadata.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"s0-3-3-retrieval\">3.3 \u003ccode>retrieval/\u003c/code>\u003c/h3>\n\u003cul>\u003cli>\u003ccode>types.py\u003c/code> (59): frozen dataclasses \u003ccode>Chunk\u003c/code>, \u003ccode>SearchResult\u003c/code>, \u003ccode>Filters\u003c/code>. \u003ccode>Filters.matches()\u003c/code> defaults to \u003ccode>status=(\"in_force\",\"amended\")\u003c/code>.\u003c/li>\u003cli>\u003ccode>base.py\u003c/code> (120): abstract \u003ccode>Embedder\u003c/code> and \u003ccode>VectorStore\u003c/code> interfaces plus placeholder implementations for \"not ready\" states (so \u003ccode>/ready\u003c/code> can report honestly).\u003c/li>\u003cli>\u003ccode>embedder.py\u003c/code> (77): \u003ccode>HashingEmbedder\u003c/code> (signed bag-of-words hashing, 512-d, L2-normalised; used in tests and CI) and \u003ccode>SentenceTransformerEmbedder\u003c/code> (lazy import; \u003ccode>encode(..., normalize_embeddings=True, batch_size=32)\u003c/code>). \u003ccode>tokenize\u003c/code> lowercases and removes a stopword list.\u003c/li>\u003cli>\u003ccode>memory_store.py\u003c/code> (180): dense = dot product over normalised vectors (so cosine), full scan; sparse = BM25 with \u003ccode>k1=1.5, b=0.75\u003c/code> computed per query (\u003ccode>memory_store.py:121-143\u003c/code>); JSON persistence; \u003ccode>check_fingerprint\u003c/code> raises \u003ccode>FingerprintMismatchError\u003c/code>.\u003c/li>\u003cli>\u003ccode>qdrant_store.py\u003c/code> (232): named vectors \u003ccode>dense\u003c/code> (cosine) and \u003ccode>sparse\u003c/code> (hashed term counts, server-side IDF modifier); deterministic UUID5 point IDs from chunk IDs; keyword payload indexes on \u003ccode>domain, doc_type, status, doc_id, chunk_id, section_or_article_no\u003c/code>; fingerprint stored in collection metadata.\u003c/li>\u003cli>\u003ccode>hybrid.py\u003c/code> (106): \u003ccode>rrf_fuse\u003c/code> (\u003ccode>score = Σ weight/(60+rank)\u003c/code>, keeps the max dense score per chunk for the abstain gate), \u003ccode>cap_per_doc\u003c/code> (3), \u003ccode>Retriever.retrieve\u003c/code> (dense on \u003ccode>query + extra_terms\u003c/code>, sparse on the same), optional rerank, optional parent-child expansion (neighbouring chunks, 2,400-char cap, off by default).\u003c/li>\u003cli>\u003ccode>rerank.py\u003c/code> (66): \u003ccode>LexicalReranker\u003c/code> (query-term coverage), \u003ccode>CrossEncoderReranker\u003c/code> (sentence-transformers, lazy), strategy \u003ccode>none|lexical|cross_encoder\u003c/code>.\u003c/li>\u003cli>\u003ccode>query.py\u003c/code> (169): rule-based query understanding: follow-up rewrite, \u003ccode>Section/Article\u003c/code> detection, abbreviation table (IPC, BNS, CrPC, BNSS, IEA, BSA, RBI, KYC, RTI, PMJDY), \u003ccode>derive_aliases()\u003c/code> (title-derived acronyms such as \u003ccode>dpdp\u003c/code>, \u003ccode>pmla\u003c/code>, \u003ccode>it act\u003c/code>), verified old-to-new mapping (\u003ccode>MappingTable\u003c/code>), keyword \u003ccode>route_domain\u003c/code>.\u003c/li>\u003cli>\u003ccode>factory.py\u003c/code> (45): \u003ccode>build_store\u003c/code> (memory loads \u003ccode>index.json\u003c/code>; qdrant local path or URL) and \u003ccode>build_retriever\u003c/code> (single place that wires settings into \u003ccode>Retriever\u003c/code>, shared by API and eval).\u003c/li>\u003c/ul>\n\u003ch3 id=\"s0-3-4-generation\">3.4 \u003ccode>generation/\u003c/code>\u003c/h3>\n\u003cul>\u003cli>\u003ccode>pipeline.py\u003c/code> (173): \u003ccode>RAGPipeline.prepare()\u003c/code> (\u003ccode>pipeline.py:87-150\u003c/code>) is the heart: understand, status filter (\u003ccode>in_force\u003c/code>/\u003ccode>amended\u003c/code> unless the question mentions IPC, CrPC or IEA), optional domain routing with a no-filter retry, pin up to 2 exact-section chunks, abstain gate on the best \u003ccode>dense_score\u003c/code>, build messages, currency notes. \u003ccode>stream()\u003c/code> yields tokens; \u003ccode>answer()\u003c/code> is the non-streaming path used by the eval runner.\u003c/li>\u003cli>\u003ccode>prompts.py\u003c/code> (91): loads \u003ccode>config/prompts/answer_v{1,2}.txt\u003c/code>; \u003ccode>format_passage\u003c/code> renders \u003ccode>[i] Title | Section | p.N\u003c/code> and a \u003ccode>SUPERSEDED (current: ...)\u003c/code> tag; \u003ccode>_escape\u003c/code> neutralises \u003ccode>&lt;/passages&gt;\u003c/code>; Jaccard dedupe (0.9), budget 12,000 chars, optional \"edges\" ordering.\u003c/li>\u003cli>\u003ccode>citations.py\u003c/code> (59): \u003ccode>[n]\u003c/code> / \u003ccode>[n, m]\u003c/code> regex, \u003ccode>resolve_citations\u003c/code> returns valid citations and invalid numbers, \u003ccode>strip_invalid_citations\u003c/code> removes markers that point past the passage list.\u003c/li>\u003cli>Prompt v2 rules: answer only from numbered passages; cite every claim; say so when evidence is missing; treat passages as untrusted data; flag superseded sources; be concise.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s0-3-5-llm\">3.5 \u003ccode>llm/\u003c/code>\u003c/h3>\n\u003cul>\u003cli>\u003ccode>llm_client.py\u003c/code> (125): \u003ccode>LLMClient\u003c/code> ABC plus typed errors (\u003ccode>LLMAuthError\u003c/code>, \u003ccode>LLMRateLimitError(retry_after)\u003c/code>, \u003ccode>LLMTimeoutError\u003c/code>, \u003ccode>LLMProviderError(status_code)\u003c/code>).\u003c/li>\u003cli>\u003ccode>groq_client.py\u003c/code> (159): direct \u003ccode>httpx\u003c/code> calls to \u003ccode>https://api.groq.com/openai/v1\u003c/code> (no SDK dependency), maps HTTP status to typed errors, parses the streaming SSE body.\u003c/li>\u003cli>\u003ccode>resilience.py\u003c/code> (165): \u003ccode>ResilientLLMClient\u003c/code> wraps any client. Retries only timeouts, 429 and 5xx (\u003ccode>is_transient_error\u003c/code>, \u003ccode>resilience.py:25\u003c/code>); backoff \u003ccode>min(min_wait·2^attempt + jitter, max_wait)\u003c/code> honouring \u003ccode>Retry-After\u003c/code> (\u003ccode>calculate_backoff\u003c/code>, \u003ccode>resilience.py:43\u003c/code>); defaults 3 retries, 0.5 s to 8 s. \u003cstrong>Streaming is never retried once a token has been yielded\u003c/strong> (\u003ccode>resilience.py:123-136\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch3 id=\"s0-3-6-api\">3.6 \u003ccode>api/\u003c/code>\u003c/h3>\n\u003cul>\u003cli>\u003ccode>main.py\u003c/code> (326): \u003ccode>create_app()\u003c/code> factory with dependency injection (settings, llm, embedder, store, session store, pipeline) for tests. \u003ccode>lifespan\u003c/code> builds the shared \u003ccode>httpx.AsyncClient\u003c/code>, wraps the LLM, loads index/embedder (a failure marks components \"not ready\" instead of crashing), optionally runs \u003ccode>startup_sync\u003c/code> in a thread, builds the pipeline (with title aliases), session store plus a 60 s cleanup task, metrics, tracer, upload store. Global handlers return a uniform \u003ccode>ErrorResponse\u003c/code>. \u003ccode>/health\u003c/code> (liveness), \u003ccode>/ready\u003c/code> (503 until llm+embedder+store are ready; no network calls).\u003c/li>\u003cli>\u003ccode>routes.py\u003c/code> (265): \u003ccode>POST /v1/ask\u003c/code> (SSE: \u003ccode>token\u003c/code>, \u003ccode>citations\u003c/code>, \u003ccode>abstained\u003c/code>, \u003ccode>done\u003c/code>, \u003ccode>error\u003c/code>), upload, delete upload, stats, metrics, feedback, two admin routes.\u003c/li>\u003cli>\u003ccode>security.py\u003c/code> (88): \u003ccode>AbuseControlMiddleware\u003c/code> (pure ASGI): \u003ccode>Content-Length\u003c/code> check (413), sliding 60 s window per client IP (429 + \u003ccode>Retry-After\u003c/code>); \u003ccode>require_admin\u003c/code> uses \u003ccode>secrets.compare_digest\u003c/code>, returns 403 when no key is configured.\u003c/li>\u003cli>\u003ccode>middleware.py\u003c/code> (79): request ID via \u003ccode>contextvars\u003c/code>, validated \u003ccode>X-Request-ID\u003c/code>.\u003c/li>\u003cli>\u003ccode>sessions.py\u003c/code> (169): \u003ccode>InMemorySessionStore\u003c/code> with TTL (3600 s), cap 1000, LRU eviction, \u003ccode>asyncio.Lock\u003c/code>, injectable clock for instant tests.\u003c/li>\u003cli>\u003ccode>uploads.py\u003c/code> (140): ephemeral per-file index: \u003ccode>.pdf\u003c/code>/\u003ccode>.txt\u003c/code> only, \u003ccode>%PDF-\u003c/code> magic check, 5 MB, 100 pages, 2,000 chunks, temp dir with a fixed file name, \u003ccode>s0\u003c/code> chunking, \u003ccode>secrets.token_urlsafe(24)\u003c/code> ID, TTL 1800 s, max 50 sessions.\u003c/li>\u003cli>\u003ccode>streaming.py\u003c/code> (100): \u003ccode>format_sse\u003c/code>, SSE response headers.\u003c/li>\u003c/ul>\n\u003ch3 id=\"s0-3-7-observability-eval-scripts-web\">3.7 \u003ccode>observability/\u003c/code>, \u003ccode>eval/\u003c/code>, \u003ccode>scripts/\u003c/code>, \u003ccode>web/\u003c/code>\u003c/h3>\n\u003cul>\u003cli>\u003ccode>observability/\u003c/code>: \u003ccode>Metrics\u003c/code> (bounded deques, p50/p95 per stage), \u003ccode>FileTracer\u003c/code> (opt-in JSONL, no prompt text), JSON logging with \u003ccode>SecretScrubber\u003c/code>.\u003c/li>\u003cli>\u003ccode>eval/\u003c/code>: golden-set schema (\u003ccode>golden.py\u003c/code>), metrics (\u003ccode>hit_at_k, recall_at_k, mrr, ndcg_at_k, percentile, location_hit\u003c/code>), LLM judge (\u003ccode>faithfulness\u003c/code>, \u003ccode>relevance\u003c/code>, \u003ccode>citation_support\u003c/code>), experiment configs \u003ccode>B0_baseline ... G1_prompt_v2, C3/C5/C8\u003c/code> as dicts of settings overrides so the eval runs the production code path, \u003ccode>tune_abstain\u003c/code>, \u003ccode>bakeoff\u003c/code>, \u003ccode>freeze\u003c/code> (hashes the test split), \u003ccode>author.py\u003c/code> (LLM-assisted question drafting with human review).\u003c/li>\u003cli>\u003ccode>scripts/\u003c/code>: \u003ccode>demo_server.py\u003c/code> (fake LLM, 4-document fixture), \u003ccode>load_test.py\u003c/code>, \u003ccode>check_staged.py\u003c/code> (pre-commit guard that blocks \u003ccode>.env\u003c/code>), \u003ccode>check_api_keys.py\u003c/code>.\u003c/li>\u003cli>\u003ccode>web/\u003c/code> (1,253 lines TS/TSX): Next.js 16 / React 19 app: \u003ccode>app/page.tsx\u003c/code> (Ask), \u003ccode>app/metrics\u003c/code>, \u003ccode>app/documents\u003c/code>, \u003ccode>components/\u003c/code> (\u003ccode>Shell\u003c/code>, \u003ccode>Sidebar\u003c/code>, \u003ccode>UploadCard\u003c/code>, \u003ccode>AnswerPreview\u003c/code>, \u003ccode>AppContext\u003c/code>), \u003ccode>lib/api.ts\u003c/code> (SSE parsing over \u003ccode>fetch\u003c/code> + \u003ccode>ReadableStream\u003c/code>, not \u003ccode>EventSource\u003c/code>, because the request is a POST).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"s0-4-tech-stack\">4. Tech stack\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technology\u003c/th>\u003cth>Role\u003c/th>\u003cth>Why this over the alternative\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Python 3.11\u003c/td>\u003ctd>Backend language\u003c/td>\u003ctd>\u003ccode>requires-python = \"&gt;=3.11,&lt;3.12\"\u003c/code>; modern typing, \u003ccode>asyncio\u003c/code> TaskGroup-era stdlib\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FastAPI + Uvicorn\u003c/td>\u003ctd>HTTP/SSE API\u003c/td>\u003ctd>Async streaming, Pydantic validation, OpenAPI docs for free (vs Flask: no native async streaming)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pydantic v2 / pydantic-settings\u003c/td>\u003ctd>Schemas, config\u003c/td>\u003ctd>One typed source for manifest, requests, settings; \u003ccode>SecretStr\u003c/code> masks keys\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PyMuPDF\u003c/td>\u003ctd>PDF text extraction\u003c/td>\u003ctd>Fast, page-aware, no system deps (vs pdfminer: slower; vs OCR stacks: out of scope)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>sentence-transformers \u003ccode>all-MiniLM-L6-v2\u003c/code>\u003c/td>\u003ctd>Dense embeddings (384-d)\u003c/td>\u003ctd>Small, CPU-friendly, strong baseline; swappable behind \u003ccode>Embedder\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hashing embedder (512-d)\u003c/td>\u003ctd>Test/CI embedder\u003c/td>\u003ctd>Deterministic, dependency-free, so CI needs no model download\u003c/td>\u003c/tr>\u003ctr>\u003ctd>In-memory store (JSON)\u003c/td>\u003ctd>Default vector store\u003c/td>\u003ctd>Zero infrastructure; honest about scale limits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qdrant\u003c/td>\u003ctd>Optional vector DB\u003c/td>\u003ctd>Named dense+sparse vectors, payload filters, local or server mode\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BM25 / hashed TF-IDF\u003c/td>\u003ctd>Sparse retrieval\u003c/td>\u003ctd>Exact identifiers (\"Section 66A\") that embeddings blur\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reciprocal Rank Fusion\u003c/td>\u003ctd>Fusion\u003c/td>\u003ctd>No score calibration between cosine and BM25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Groq (llama-3.3-70b-versatile)\u003c/td>\u003ctd>LLM\u003c/td>\u003ctd>OpenAI-compatible, fast streaming, free tier; direct \u003ccode>httpx\u003c/code> keeps the dependency surface small\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQLite\u003c/td>\u003ctd>Embedding cache\u003c/td>\u003ctd>Stdlib, durable, keyed by model + content hash\u003c/td>\u003c/tr>\u003ctr>\u003ctd>YAML manifest\u003c/td>\u003ctd>Document registry\u003c/td>\u003ctd>Human-editable source of truth\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Next.js 16 / React 19 / TypeScript\u003c/td>\u003ctd>UI\u003c/td>\u003ctd>Streaming UI with type-checked API client\u003c/td>\u003c/tr>\u003ctr>\u003ctd>pytest (+asyncio), ruff, pre-commit, detect-secrets\u003c/td>\u003ctd>Quality\u003c/td>\u003ctd>218 tests, lint, secret scanning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GitHub Actions\u003c/td>\u003ctd>CI\u003c/td>\u003ctd>3 jobs: test (with eval gate), web, docker\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Docker / compose\u003c/td>\u003ctd>Packaging\u003c/td>\u003ctd>Written, never built here (see weaknesses)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"s0-5-storage-and-schemas\">5. Storage and schemas\u003c/h2>\n\u003cp>\u003cstrong>Manifest row (\u003ccode>data/manifest.yaml\u003c/code>, \u003ccode>ingestion/schema.py:50\u003c/code>)\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Type\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>doc_id\u003c/code>\u003c/td>\u003ctd>str, \u003ccode>^[a-z0-9][a-z0-9_\\-]*$\u003c/code>\u003c/td>\u003ctd>stable slug\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>title\u003c/code>\u003c/td>\u003ctd>str\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>doc_type\u003c/code>\u003c/td>\u003ctd>enum\u003c/td>\u003ctd>statute, constitution, judgment, rule, circular, master_direction, scheme, faq, mapping_table, report\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>domain\u003c/code>\u003c/td>\u003ctd>enum\u003c/td>\u003ctd>legal, banking\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>path\u003c/code>\u003c/td>\u003ctd>str\u003c/td>\u003ctd>relative to \u003ccode>data/\u003c/code> (e.g. \u003ccode>raw/legal/x.pdf\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>jurisdiction, authority_or_court, year, date, case_citation, act_name\u003c/code>\u003c/td>\u003ctd>optional\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>status\u003c/code>\u003c/td>\u003ctd>enum\u003c/td>\u003ctd>in_force, amended, superseded, repealed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>effective_from, superseded_by, version, language, source_url, source_type\u003c/code>\u003c/td>\u003ctd>optional\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>file_hash\u003c/code>\u003c/td>\u003ctd>64 hex\u003c/td>\u003ctd>SHA-256 of the file\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>page_count, text_quality\u003c/code>\u003c/td>\u003ctd>int, enum\u003c/td>\u003ctd>good, fair, poor, needs_ocr, unknown\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Chunk (\u003ccode>retrieval/types.py:10\u003c/code>)\u003c/strong>: \u003ccode>chunk_id\u003c/code>, \u003ccode>doc_id\u003c/code>, \u003ccode>text\u003c/code>, \u003ccode>embed_text\u003c/code> (prefix + text), \u003ccode>metadata\u003c/code> = manifest fields plus \u003ccode>section_or_article_no, heading_path[], page_start, page_end, paragraph_no, chunk_type, token_count, strategy_id, strategy_version, file_hash, config_fingerprint, ingest_run\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Files\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Path\u003c/th>\u003cth>Content\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>data/manifest.yaml\u003c/code>\u003c/td>\u003ctd>document registry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>data/processed/&lt;doc_id&gt;.json\u003c/code>\u003c/td>\u003ctd>normalized pages and blocks (parse cache)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>data/processed/index.json\u003c/code>\u003c/td>\u003ctd>memory index: \u003ccode>{fingerprint, chunks:[{chunk_id, doc_id, text, embed_text, metadata, vector}]}\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>data/cache/embeddings.sqlite\u003c/code>\u003c/td>\u003ctd>table \u003ccode>emb(model, key, vec)\u003c/code>, PK \u003ccode>(model, key)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>data/processed/feedback.jsonl\u003c/code>\u003c/td>\u003ctd>one JSON line per feedback\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qdrant collection \u003ccode>legal_rag\u003c/code>\u003c/td>\u003ctd>vectors \u003ccode>dense\u003c/code> (cosine), \u003ccode>sparse\u003c/code> (IDF); payload indexes on 6 keyword fields\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"s0-6-api-contracts\">6. API contracts\u003c/h2>\n\u003cp>\u003cstrong>\u003ccode>POST /v1/ask\u003c/code>\u003c/strong> → \u003ccode>text/event-stream\u003c/code>\u003c/p>\n\u003cpre>\u003ccode class=\"lang-json\">// request\n{\"question\": \"What is the punishment for theft?\", \"domain\": \"legal\",\n \"conversation_id\": null, \"upload_id\": null}\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"lang-\">event: token      data: {\"content\": \"Theft is ...\"}\nevent: citations  data: {\"citations\":[{\"index\":1,\"doc_id\":\"...\",\"title\":\"...\",\"section_or_article\":\"Section 4\",\n                                         \"page\":3,\"status\":\"in_force\",\"snippet\":\"...\"}],\n                         \"invalid\":[], \"answer\":\"&lt;sanitised text&gt;\", \"notes\":[]}\nevent: done       data: {\"conversation_id\":\"...\",\"request_id\":\"...\",\"finish_reason\":\"stop\",\n                         \"disclaimer\":\"Informational only; not legal advice.\",\n                         \"latency_ms\":1144,\"understand_ms\":0,\"retrieve_ms\":38,\"rerank_ms\":0,\"generate_ms\":1105}\nevent: abstained  data: {\"conversation_id\":\"...\",\"request_id\":\"...\",\"message\":\"...\",\"disclaimer\":\"...\"}\nevent: error      data: {\"code\":\"LLM_ERROR\",\"request_id\":\"...\",\"message\":\"The language model is unavailable.\"}\u003c/code>\u003c/pre>\n\u003cp>Validation: \u003ccode>question\u003c/code> 1 to 1,000 chars (422 beyond), \u003ccode>domain\u003c/code> is \u003ccode>legal|banking\u003c/code>, upload ID unknown or expired → 404, no index → 503.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>POST /v1/documents/upload?filename=x.pdf\u003c/code>\u003c/strong> (raw body) → \u003ccode>201\u003c/code>\u003c/p>\n\u003cpre>\u003ccode class=\"lang-json\">{\"upload_id\":\"&lt;token_urlsafe(24)&gt;\",\"filename\":\"x.pdf\",\"pages\":21,\"chunks\":108,\"expires_in_seconds\":1800}\u003c/code>\u003c/pre>\n\u003cp>Errors: 415 (type or magic), 413 (size/pages/chunks), 422 (empty or unreadable or no text), 503 (embedder not ready).\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>DELETE /v1/documents/session/{upload_id}\u003c/code>\u003c/strong> → \u003ccode>204\u003c/code> or \u003ccode>404\u003c/code>. \u003cstrong>\u003ccode>GET /v1/stats\u003c/code>\u003c/strong> → \u003ccode>{\"documents\":21,\"chunks\":26974}\u003c/code>. \u003cstrong>\u003ccode>GET /v1/metrics\u003c/code>\u003c/strong> → \u003ccode>{\"requests\":3,\"answered\":3,\"abstained\":0,\"errors\":0,\"error_rate\":0.0,\"abstention_rate\":0.0,\"approx_output_tokens_per_request\":..,\"latency_ms\":{\"retrieve_ms\":{\"p50\":..,\"p95\":..,\"n\":3},...}}\u003c/code>. \u003cstrong>\u003ccode>POST /v1/feedback\u003c/code>\u003c/strong> \u003ccode>{\"request_id\":\"&lt;8-64 chars&gt;\",\"rating\":\"up|down\",\"comment\":\"&lt;=1000\"}\u003c/code> → \u003ccode>202 {\"status\":\"recorded\"}\u003c/code>. \u003cstrong>\u003ccode>GET /v1/admin/traces/{request_id}\u003c/code>\u003c/strong>, \u003cstrong>\u003ccode>DELETE /v1/admin/documents/{doc_id}\u003c/code>\u003c/strong> need header \u003ccode>X-API-Key\u003c/code>; \u003ccode>403\u003c/code> if no admin key is configured, \u003ccode>401\u003c/code> if wrong; delete returns \u003ccode>{\"doc_id\":..., \"chunks_removed\":N}\u003c/code>. \u003cstrong>\u003ccode>GET /health\u003c/code>\u003c/strong> → \u003ccode>{\"status\":\"ok\"}\u003c/code>. \u003cstrong>\u003ccode>GET /ready\u003c/code>\u003c/strong> → \u003ccode>{\"status\":\"ready|not_ready\",\"components\":{\"llm\":\"ready\",\"embedder\":\"ready (all-MiniLM-L6-v2)\",\"vector_store\":\"ready (memory, 26974 chunks)\"}}\u003c/code>, \u003ccode>503\u003c/code> if any is not ready. All errors: \u003ccode>{\"code\",\"message\",\"request_id\"}\u003c/code>; every response carries \u003ccode>X-Request-ID\u003c/code>.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s0-7-key-design-decisions\">7. Key design decisions\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Decision\u003c/th>\u003cth>Why\u003c/th>\u003cth>Alternative considered\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Hybrid dense + sparse with RRF\u003c/td>\u003ctd>Legal queries mix concepts and exact identifiers; RRF needs no score calibration\u003c/td>\u003ctd>Weighted score sum (needs normalising cosine vs BM25)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Structure-aware chunking (s1/s2/s3)\u003c/td>\u003ctd>A legal answer lives in one section or paragraph group; fixed windows cut provisos from their sections\u003c/td>\u003ctd>Single recursive character splitter\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contextual prefix \u003ccode>Title &gt; Section\u003c/code> in the embedded text\u003c/td>\u003ctd>Disambiguates \"Section 3\" across Acts\u003c/td>\u003ctd>Embed raw text only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Store the manifest as source of truth, index as derived\u003c/td>\u003ctd>Index can always be rebuilt; edits are reviewable\u003c/td>\u003ctd>Index as the only record\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Config fingerprint on the index\u003c/td>\u003ctd>Prevents silently mixing vectors from two embedders\u003c/td>\u003ctd>Trust the operator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Safe-order replacement (upsert new, then delete stale)\u003c/td>\u003ctd>A crash mid-update never leaves a document with no chunks\u003c/td>\u003ctd>Delete then insert\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Abstention gate before calling the LLM\u003c/td>\u003ctd>No tokens spent, no hallucination on empty evidence\u003c/td>\u003ctd>Always call the LLM and rely on the prompt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Validate citation numbers server-side\u003c/td>\u003ctd>The model can cite \u003ccode>[9]\u003c/code> when only 5 passages exist; those markers are stripped\u003c/td>\u003ctd>Trust the model\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Never retry a stream after the first token\u003c/td>\u003ctd>A retry would duplicate or corrupt text already shown\u003c/td>\u003ctd>Retry everything\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pure ASGI abuse middleware\u003c/td>\u003ctd>No dependency, runs before routing\u003c/td>\u003ctd>slowapi / Redis rate limiter\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ephemeral in-memory upload index with unguessable ID\u003c/td>\u003ctd>Per-user isolation without a database\u003c/td>\u003ctd>Persist uploads in the main corpus\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Eval configs are settings dicts\u003c/td>\u003ctd>Experiments and production share one code path\u003c/td>\u003ctd>A separate eval pipeline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Direct \u003ccode>httpx\u003c/code> to Groq\u003c/td>\u003ctd>One less SDK; easy to mock with \u003ccode>httpx.MockTransport\u003c/code>\u003c/td>\u003ctd>\u003ccode>groq\u003c/code> or \u003ccode>openai\u003c/code> SDK\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Text-level manifest editing\u003c/td>\u003ctd>Keeps comments and manual edits\u003c/td>\u003ctd>\u003ccode>yaml.dump\u003c/code> the whole file\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"s0-8-how-to-present-this-project-script-about-2-min-15-s\">8. \"How to present this project\" script (about 2 min 15 s)\u003c/h2>\n\u003cp>\u003cstrong>Opening (30 s).\u003c/strong> \"This is Legal Assist, a RAG system for Indian legal and banking documents. Users ask in plain English and get a streamed answer with numbered citations they can click to see the source passage, a note when a law has been superseded, and an explicit refusal when the corpus does not support an answer.\"\u003c/p>\n\u003cp>\u003cstrong>Problem (15 s).\u003c/strong> \"General LLMs state legal conclusions with confidence and no source. Statutes and judgments are long and structured, so naive chunking breaks provisos away from their sections. I wanted answers that are grounded, checkable and honest about gaps.\"\u003c/p>\n\u003cp>\u003cstrong>Architecture (45 s).\u003c/strong> \"Ingestion turns PDFs into structure-aware chunks, three of four strategies split on sections, numbered paragraphs or headings, and indexes them with a dense embedding plus BM25. At query time I rewrite and expand the question, retrieve with both, fuse with reciprocal rank fusion, cap per document, and pin exact section matches. A gate checks the best dense score; if it passes, a numbered-passage prompt goes to Groq and tokens stream to the browser over SSE. After generation I validate every citation number against the passages actually supplied.\"\u003c/p>\n\u003cp>\u003cstrong>Hard parts (30 s).\u003c/strong> \"Three things. First, making ingestion safe and incremental: file hashes, an embedding cache, a config fingerprint that refuses mixed vectors, and a sync command that classifies new files automatically without overwriting my manual manifest edits. Second, streaming resilience: retry only before the first token. Third, finding that acronym queries like 'DPDP Act' failed because the Act never spells the acronym; I fixed it by deriving acronyms from manifest titles and embedding the expansion.\"\u003c/p>\n\u003cp>\u003cstrong>Impact (15 s).\u003c/strong> \"218 tests, a CI gate on a fixture corpus, 21 documents and about 27,000 chunks in my real run, plus honest limits: I have not yet measured retrieval quality on the real corpus.\"\u003c/p>\n\u003chr>\n\u003ch2 id=\"s0-9-weakness-awareness-what-i-would-say\">9. Weakness awareness (what I would say)\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Weakness\u003c/th>\u003cth>What I'd say\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>No real-corpus quality numbers (\u003ccode>eval/runs/\u003c/code> empty, \u003ccode>eval/experiment_log.md\u003c/code> blank)\u003c/td>\u003ctd>\"The harness, golden-set schema and CI gate exist and run on a fixture corpus; I have not frozen a real golden set yet. I won't quote Hit@5 on the real corpus because I haven't measured it.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>abstain_threshold\u003c/code> defaults to \u003ccode>0.0\u003c/code> (\u003ccode>settings.py:68\u003c/code>)\u003c/td>\u003ctd>\"Out of the box it only abstains on an empty result. There's a \u003ccode>tune-abstain\u003c/code> command to pick a threshold on a dev split; I haven't run it on real data.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>In-memory store scans every vector, and BM25 statistics are rebuilt per query (\u003ccode>memory_store.py:126-129\u003c/code>)\u003c/td>\u003ctd>\"Fine at 27k chunks for a demo, it's O(N) per query. At scale I'd cache the BM25 index or move to Qdrant, which is already supported.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retrieval latency spread in my 3-request sample (median 38 ms, p95 2.5 s)\u003c/td>\u003ctd>\"Three samples prove nothing. I'd profile before explaining it.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duplicate documents in the real corpus (Companies Act, DPDP, PMLA appear twice; Constitution twice with different counts)\u003c/td>\u003ctd>\"Sync classifies by file; it doesn't deduplicate by content. A hash or title duplicate check is the next fix.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Process-local state: sessions, uploads, metrics, rate limit\u003c/td>\u003ctd>\"Single-process by design; for replicas these move to Redis.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>data/mappings/ipc_to_bns.json\u003c/code> is not in the repo, so the old-to-new mapping returns nothing\u003c/td>\u003ctd>\"The mechanism and tests exist; the verified mapping data is a to-do.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Docker and compose written but never built; the Dockerfile installs without the \u003ccode>embeddings\u003c/code> extra\u003c/td>\u003ctd>\"Unverified. First fix is adding the extra and running the build in CI.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No OCR in this repository; scanned pages are flagged (\u003ccode>low_text\u003c/code>) and uploads with no text are rejected\u003c/td>\u003ctd>\"OCR isn't in the code. If a report or slide says otherwise, be ready to show the commit.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No agentic layer in this repository (pipeline is linear)\u003c/td>\u003ctd>\"The implemented system is a single-pass RAG pipeline with limited query understanding. Do not describe an agent loop unless you can point to the code.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Citation check is structural, not semantic\u003c/td>\u003ctd>\"I check that \u003ccode>[n]\u003c/code> exists, not that passage n supports the sentence. The judge in \u003ccode>eval/judge.py\u003c/code> does that offline.\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UI renders model markdown as literal \u003ccode>**\u003c/code>\u003c/td>\u003ctd>\"Cosmetic; render markdown in \u003ccode>AnswerPreview\u003c/code>.\"\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"s0-10-numbers-to-memorise\">10. Numbers to memorise\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Value\u003c/th>\u003cth>Where\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Python in \u003ccode>src/legal_rag\u003c/code>\u003c/td>\u003ctd>about 6,500 lines, 55 files\u003c/td>\u003ctd>\u003ccode>wc -l\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tests\u003c/td>\u003ctd>218 in 16 files, about 3,600 lines\u003c/td>\u003ctd>\u003ccode>pytest --collect-only\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Web (TS/TSX/CSS)\u003c/td>\u003ctd>about 1,250 lines\u003c/td>\u003ctd>\u003ccode>web/\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tracked project lines (py/ts/js/html/yml/toml/md)\u003c/td>\u003ctd>12,758\u003c/td>\u003ctd>git-tracked files\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Real run (your machine, MiniLM)\u003c/td>\u003ctd>21 documents, 26,974 chunks\u003c/td>\u003ctd>Documents page screenshot\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Repo manifest (hashing embedder test)\u003c/td>\u003ctd>10 documents, 12,828 chunks\u003c/td>\u003ctd>\u003ccode>docs/ingestion_report.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chunk size / overlap / max tokens\u003c/td>\u003ctd>800 chars / 150 / 256\u003c/td>\u003ctd>\u003ccode>settings.py:72-74\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Observed chunk length\u003c/td>\u003ctd>avg 75 to 169 tokens, max 200\u003c/td>\u003ctd>ingestion \u003ccode>stats\u003c/code> screenshot\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Top-k / candidates / per-doc cap\u003c/td>\u003ctd>5 / 30 / 3\u003c/td>\u003ctd>\u003ccode>settings.py:63-67\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RRF constant\u003c/td>\u003ctd>60\u003c/td>\u003ctd>\u003ccode>hybrid.py:14\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BM25\u003c/td>\u003ctd>k1 1.5, b 0.75\u003c/td>\u003ctd>\u003ccode>memory_store.py:130\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Embedding dims\u003c/td>\u003ctd>MiniLM 384, hashing 512\u003c/td>\u003ctd>model, \u003ccode>embedder.py:31\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Context budget / dedupe\u003c/td>\u003ctd>12,000 chars / Jaccard 0.9\u003c/td>\u003ctd>\u003ccode>settings.py\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LLM\u003c/td>\u003ctd>llama-3.3-70b-versatile, temp 0.1, max 2,048 tokens, 30 s timeout\u003c/td>\u003ctd>\u003ccode>settings.py:29-39\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retry\u003c/td>\u003ctd>3 attempts, 0.5 to 8 s backoff, 0.5×min jitter\u003c/td>\u003ctd>\u003ccode>resilience.py:43\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rate limit / body / question\u003c/td>\u003ctd>60 req/min per IP / 1 MB / 1,000 chars\u003c/td>\u003ctd>\u003ccode>settings.py\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Upload limits\u003c/td>\u003ctd>5 MB, 100 pages, 2,000 chunks, 30 min TTL, 50 sessions\u003c/td>\u003ctd>\u003ccode>settings.py\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sessions\u003c/td>\u003ctd>TTL 3,600 s, max 1,000, history 4 turns\u003c/td>\u003ctd>\u003ccode>settings.py\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API routes\u003c/td>\u003ctd>8 under \u003ccode>/v1\u003c/code> plus \u003ccode>/health\u003c/code>, \u003ccode>/ready\u003c/code>\u003c/td>\u003ctd>\u003ccode>routes.py\u003c/code>, \u003ccode>main.py\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Strategy map\u003c/td>\u003ctd>statute, constitution, rule, scheme → s1; judgment → s2; circular, master_direction, faq, mapping_table, report → s3\u003c/td>\u003ctd>\u003ccode>chunking.py:15-26\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Eval configs\u003c/td>\u003ctd>16 (\u003ccode>B0_baseline\u003c/code> ... \u003ccode>C5_edges\u003c/code>)\u003c/td>\u003ctd>\u003ccode>eval/runner.py:70-143\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Smoke golden set\u003c/td>\u003ctd>8 questions, 6 categories\u003c/td>\u003ctd>\u003ccode>eval/golden/smoke.jsonl\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CI gate\u003c/td>\u003ctd>hit@5 ≥ 0.9, mrr ≥ 0.8, abstention_acc ≥ 0.9, citation_valid ≥ 0.9\u003c/td>\u003ctd>\u003ccode>.github/workflows/ci.yml\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Load test (fake LLM, 4-doc fixture)\u003c/td>\u003ctd>398 requests, 0 errors, about 8.8 req/s, retrieve p50 2.5 ms\u003c/td>\u003ctd>\u003ccode>docs/load_test.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metrics page (3 real requests)\u003c/td>\u003ctd>total p50 1,144 ms, generation p50 1,105 ms, retrieval p50 38 ms\u003c/td>\u003ctd>screenshot\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","toc":[{"level":2,"text":"1. The 30-second elevator pitch (say this out loud)","id":"s0-1-the-30-second-elevator-pitch-say-this-out-loud"},{"level":2,"text":"2. System architecture","id":"s0-2-system-architecture"},{"level":2,"text":"3. Every module, explained","id":"s0-3-every-module-explained"},{"level":3,"text":"3.1 config/settings.py (248 lines)","id":"s0-3-1-config-settings-py-248-lines"},{"level":3,"text":"3.2 ingestion/ (ingestion pipeline)","id":"s0-3-2-ingestion-ingestion-pipeline"},{"level":3,"text":"3.3 retrieval/","id":"s0-3-3-retrieval"},{"level":3,"text":"3.4 generation/","id":"s0-3-4-generation"},{"level":3,"text":"3.5 llm/","id":"s0-3-5-llm"},{"level":3,"text":"3.6 api/","id":"s0-3-6-api"},{"level":3,"text":"3.7 observability/, eval/, scripts/, web/","id":"s0-3-7-observability-eval-scripts-web"},{"level":2,"text":"4. Tech stack","id":"s0-4-tech-stack"},{"level":2,"text":"5. Storage and schemas","id":"s0-5-storage-and-schemas"},{"level":2,"text":"6. API contracts","id":"s0-6-api-contracts"},{"level":2,"text":"7. Key design decisions","id":"s0-7-key-design-decisions"},{"level":2,"text":"8. \"How to present this project\" script (about 2 min 15 s)","id":"s0-8-how-to-present-this-project-script-about-2-min-15-s"},{"level":2,"text":"9. Weakness awareness (what I would say)","id":"s0-9-weakness-awareness-what-i-would-say"},{"level":2,"text":"10. Numbers to memorise","id":"s0-10-numbers-to-memorise"}],"entries":[{"id":"s0-legal-assist-rag-interview-guide-master-document","heading":"Legal Assist RAG: Interview Guide (Master Document)","text":"Everything here is taken from this repository. File and line references are to the code as committed ( src/legal_rag/... ). Where a number comes from a screenshot of a real run rather than from code, it says so. ---"},{"id":"s0-1-the-30-second-elevator-pitch-say-this-out-loud","heading":"1. The 30-second elevator pitch (say this out loud)","text":"\"I built a retrieval-augmented generation system for Indian legal and banking questions. You ask a question; it searches a corpus of statutes, judgments and RBI documents with hybrid dense-plus-keyword search, sends only the best passages to an LLM, and streams back an answer where every claim carries a numbered citation I can validate. If the evidence is missing it says so instead of guessing. It's a FastAPI service with server-sent-event streaming, a Next.js interface, a drop-in ingestion pipeline that classifies new PDFs and indexes only what changed, and an evaluation harness with a CI regression gate. About 6,500 lines of Python, 218 tests, 21 documents and roughly 27,000 indexed chunks on my real run.\" ---"},{"id":"s0-2-system-architecture","heading":"2. System architecture","text":"┌─────────────────────────────┐ │ Next.js UI (web/, :3010) │ static UI /ui (frontend/index.html) │ fetch + ReadableStream SSE │ └───────────────┬─────────────┘ │ POST /v1/ask (SSE) POST /v1/documents/upload ▼ ┌───────────────────────────────────────────────────────────────────────────────────────────┐ │ FastAPI app (api/main.py: create_app + lifespan) │ │ RequestIDMiddleware ► AbuseControlMiddleware (rate limit, body size) ► CORS │ │ routes.py: ask / upload / delete session / stats / metrics / feedback / admin │ │ sessions.py (TTL+LRU) uploads.py (ephemeral per-file index) metrics tracing │ └───────┬───────────────────────────────────────────┬───────────────────────────────────────┘ │ prepare() in a thread │ stream() async ▼ ▼ ┌──────────────────────────────┐ ┌───────────────────────────────┐ │ generation/pipeline.py │ │ llm/resilience.py │ │ 1 understand (query.py) │ │ retry+backoff, no retry after│ │ 2 retrieve (hybrid.py) │ │ first token │ │ 3 pin exact sections │ │ llm/groq_client.py (httpx) │ │ 4 gate (abstain_threshold) │─────────►│ Groq chat-completions, SSE │ │ 5 build_messages (prompts) │ └───────────────────────────────┘ │ 6 validate citations │ └───────┬──────────────────────┘ ▼ ┌──────────────────────────────────────────────────────────────┐ │ retrieval/ │ │ Retriever: dense + sparse → RRF (k0=60) → per-doc cap 3 │ │ → optional rerank (lexical cross-encoder) → top-k (5) │ │ VectorStore interface: InMemoryVectorStore QdrantVectorStore │ Embedder: SentenceTransformer (all-MiniLM-L6-v2) Hashing-512 └──────────────────────────────────────────────────────────────┘ ▲ index built by ┌──────────────────────────────────────────────────────────────┐ │ ingestion/ (CLI: python -m legal_rag.ingestion sync) │ │ data/raw/{legal,banking}/ .pdf ─► classify.py ─► manifest │ │ parser.py (PyMuPDF) ─► normalize.py (JSON) ─► chunking.py │ │ ─► embed via SQLite cache (cache.py) ─► store.upsert │ │ fingerprint check, safe-order replace, hash-based skipping │ └──────────────────────────────────────────────────────────────┘ data/manifest.yaml · data/processed/{\u003cdoc .json,index.json} · data/cache/embeddings.sqlite Request path in one line: question → understand → hybrid retrieve → (pin exact sections) → abstain gate → numbered prompt → streamed LLM tokens → citation validation → SSE citations + done . ---"},{"id":"s0-3-1-config-settings-py-248-lines","heading":"3.1 config/settings.py (248 lines)","text":"- One Settings(BaseSettings) class; ~70 fields, all overridable by environment variable or .env . env_ignore_empty=True so blank lines in .env.example do not override defaults. - cors_origins uses Annotated[list[str], NoDecode] plus a validator, so CORS_ORIGINS=http://a,http://b and a JSON list both work. This fixed a real startup crash; there is a regression test. - Secrets ( llm_api_key , admin_api_key ) are SecretStr , so model dumps print . - Notable defaults: chunk_size 800 , chunk_overlap 150 , chunk_max_tokens 256 , retrieval_top_k 5 , retrieval_candidates 30 , retrieval_per_doc_cap 3 , abstain_threshold 0.0 ( settings.py:68-70 ), domain_router False , auto_sync_on_startup False . - get_settings() is cached, so the app reads config once."},{"id":"s0-3-2-ingestion-ingestion-pipeline","heading":"3.2 ingestion/ (ingestion pipeline)","text":"File Lines What it does --- --- --- schema.py 105 Pydantic DocumentRecord (the manifest row) with enums DocType (10 values), Domain , Status (in_force/amended/superseded/repealed), SourceType , TextQuality ; check_consistency() rules (superseded needs superseded_by ; judgments need a court). manifest.py 75 load_manifest , validate_manifest (duplicates, missing files, hash drift, superseded_by links), sha256_file , draft_entries . manifest_edit.py 81 Text-level edits: append_entries , remove_entry , replace_file_hash . The manifest is edited as text, not re-dumped, so comments and manual edits survive. classify.py 194 Infers doc_id , domain , doc_type , title , year from folder, file name, PDF metadata and the first 3 pages (PyMuPDF). Ordered keyword rules ( _NAME_RULES , _TEXT_RULES ); defaults statute (legal) / circular (banking). parser.py 78 parse_pdf (PyMuPDF per page, flags low_text pages under 50 chars), parse_text , clean_pages (removes repeated headers/footers, bare page numbers, de-hyphenates). PARSER_VERSION = \"pymupdf-1\" . normalize.py 108 Turns pages into typed blocks (heading / list / paragraph) saved as data/processed/\u003cdoc_id .json ; re-parsed only if file hash or parser version changes ( ensure_normalized , atomic temp-file rename). chunking.py 253 Four strategies. s0 fixed windows (800 chars, 150 overlap, snapping to paragraph/sentence/space); s1 per Section N / Article N (statutes, constitution, rules, schemes); s2 numbered-paragraph grouping for judgments; s3 heading-based (circulars, directions, FAQs, reports). is_toc_page drops contents pages; _enforce_max shrinks any chunk over 256 tokens. Chunk ID = {doc_id}:{strategy_version}:{i:05d} . Embedded text gets a contextual prefix Title Section ( chunking.py:251 ). cache.py 48 SQLite embedding cache keyed (model, sha256(text)) ; batches of 500 on read. indexer.py 199 Indexer.index_document : skip if stored hash equals file hash; chunk, embed through the cache in batches of 64, upsert new chunks first, then delete_except stale ones (\"safe order\"). config_fingerprint() hashes embedder, dim, strategy, sizes, prefix flag, sparse method and parser version. sync.py 189 run_sync : classify new files and append to manifest, refresh hash of modified files, validate, fingerprint check (refuse with \"run sync --force\"), index only new/changed, warn or prune deleted files, summary. startup_sync never raises. cli.py 238 Commands: sync [--prune --force] , validate , draft , list , status , stats , verify , parse , add , update , remove , reindex --all , report , lookup ; global --dry-run , --yes . report.py 88 Writes docs/ingestion_report.md and a section lookup by metadata."},{"id":"s0-3-3-retrieval","heading":"3.3 retrieval/","text":"- types.py (59): frozen dataclasses Chunk , SearchResult , Filters . Filters.matches() defaults to status=(\"in_force\",\"amended\") . - base.py (120): abstract Embedder and VectorStore interfaces plus placeholder implementations for \"not ready\" states (so /ready can report honestly). - embedder.py (77): HashingEmbedder (signed bag-of-words hashing, 512-d, L2-normalised; used in tests and CI) and SentenceTransformerEmbedder (lazy import; encode(..., normalize_embeddings=True, batch_size=32) ). tokenize lowercases and removes a stopword list. - memory_store.py (180): dense = dot product over normalised vectors (so cosine), full scan; sparse = BM25 with k1=1.5, b=0.75 computed per query ( memory_store.py:121-143 ); JSON persistence; check_fingerprint raises FingerprintMismatchError . - qdrant_store.py (232): named vectors dense (cosine) and sparse (hashed term counts, server-side IDF modifier); deterministic UUID5 point IDs from chunk IDs; keyword payload indexes on domain, doc_type, status, doc_id, chunk_id, section_or_article_no ; fingerprint stored in collection metadata. - hybrid.py (106): rrf_fuse ( score = Σ weight/(60+rank) , keeps the max dense score per chunk for the abstain gate), cap_per_doc (3), Retriever.retrieve (dense on query + extra_terms , sparse on the same), optional rerank, optional parent-child expansion (neighbouring chunks, 2,400-char cap, off by default). - rerank.py (66): LexicalReranker (query-term coverage), CrossEncoderReranker (sentence-transformers, lazy), strategy none lexical cross_encoder . - query.py (169): rule-based query understanding: follow-up rewrite, Section/Article detection, abbreviation table (IPC, BNS, CrPC, BNSS, IEA, BSA, RBI, KYC, RTI, PMJDY), derive_aliases() (title-derived acronyms such as dpdp , pmla , it act ), verified old-to-new mapping ( MappingTable ), keyword route_domain . - factory.py (45): build_store (memory loads index.json ; qdrant local path or URL) and build_retriever (single place that wires settings into Retriever , shared by API and eval)."},{"id":"s0-3-4-generation","heading":"3.4 generation/","text":"- pipeline.py (173): RAGPipeline.prepare() ( pipeline.py:87-150 ) is the heart: understand, status filter ( in_force / amended unless the question mentions IPC, CrPC or IEA), optional domain routing with a no-filter retry, pin up to 2 exact-section chunks, abstain gate on the best dense_score , build messages, currency notes. stream() yields tokens; answer() is the non-streaming path used by the eval runner. - prompts.py (91): loads config/prompts/answer_v{1,2}.txt ; format_passage renders [i] Title Section p.N and a SUPERSEDED (current: ...) tag; _escape neutralises \u003c/passages ; Jaccard dedupe (0.9), budget 12,000 chars, optional \"edges\" ordering. - citations.py (59): [n] / [n, m] regex, resolve_citations returns valid citations and invalid numbers, strip_invalid_citations removes markers that point past the passage list. - Prompt v2 rules: answer only from numbered passages; cite every claim; say so when evidence is missing; treat passages as untrusted data; flag superseded sources; be concise."},{"id":"s0-3-5-llm","heading":"3.5 llm/","text":"- llm_client.py (125): LLMClient ABC plus typed errors ( LLMAuthError , LLMRateLimitError(retry_after) , LLMTimeoutError , LLMProviderError(status_code) ). - groq_client.py (159): direct httpx calls to https://api.groq.com/openai/v1 (no SDK dependency), maps HTTP status to typed errors, parses the streaming SSE body. - resilience.py (165): ResilientLLMClient wraps any client. Retries only timeouts, 429 and 5xx ( is_transient_error , resilience.py:25 ); backoff min(min_wait·2^attempt + jitter, max_wait) honouring Retry-After ( calculate_backoff , resilience.py:43 ); defaults 3 retries, 0.5 s to 8 s. Streaming is never retried once a token has been yielded ( resilience.py:123-136 )."},{"id":"s0-3-6-api","heading":"3.6 api/","text":"- main.py (326): create_app() factory with dependency injection (settings, llm, embedder, store, session store, pipeline) for tests. lifespan builds the shared httpx.AsyncClient , wraps the LLM, loads index/embedder (a failure marks components \"not ready\" instead of crashing), optionally runs startup_sync in a thread, builds the pipeline (with title aliases), session store plus a 60 s cleanup task, metrics, tracer, upload store. Global handlers return a uniform ErrorResponse . /health (liveness), /ready (503 until llm+embedder+store are ready; no network calls). - routes.py (265): POST /v1/ask (SSE: token , citations , abstained , done , error ), upload, delete upload, stats, metrics, feedback, two admin routes. - security.py (88): AbuseControlMiddleware (pure ASGI): Content-Length check (413), sliding 60 s window per client IP (429 + Retry-After ); require_admin uses secrets.compare_digest , returns 403 when no key is configured. - middleware.py (79): request ID via contextvars , validated X-Request-ID . - sessions.py (169): InMemorySessionStore with TTL (3600 s), cap 1000, LRU eviction, asyncio.Lock , injectable clock for instant tests. - uploads.py (140): ephemeral per-file index: .pdf / .txt only, %PDF- magic check, 5 MB, 100 pages, 2,000 chunks, temp dir with a fixed file name, s0 chunking, secrets.token_urlsafe(24) ID, TTL 1800 s, max 50 sessions. - streaming.py (100): format_sse , SSE response headers."},{"id":"s0-3-7-observability-eval-scripts-web","heading":"3.7 observability/, eval/, scripts/, web/","text":"- observability/ : Metrics (bounded deques, p50/p95 per stage), FileTracer (opt-in JSONL, no prompt text), JSON logging with SecretScrubber . - eval/ : golden-set schema ( golden.py ), metrics ( hit_at_k, recall_at_k, mrr, ndcg_at_k, percentile, location_hit ), LLM judge ( faithfulness , relevance , citation_support ), experiment configs B0_baseline ... G1_prompt_v2, C3/C5/C8 as dicts of settings overrides so the eval runs the production code path, tune_abstain , bakeoff , freeze (hashes the test split), author.py (LLM-assisted question drafting with human review). - scripts/ : demo_server.py (fake LLM, 4-document fixture), load_test.py , check_staged.py (pre-commit guard that blocks .env ), check_api_keys.py . - web/ (1,253 lines TS/TSX): Next.js 16 / React 19 app: app/page.tsx (Ask), app/metrics , app/documents , components/ ( Shell , Sidebar , UploadCard , AnswerPreview , AppContext ), lib/api.ts (SSE parsing over fetch + ReadableStream , not EventSource , because the request is a POST). ---"},{"id":"s0-4-tech-stack","heading":"4. Tech stack","text":"Technology Role Why this over the alternative --- --- --- Python 3.11 Backend language requires-python = \" =3.11,\u003c3.12\" ; modern typing, asyncio TaskGroup-era stdlib FastAPI + Uvicorn HTTP/SSE API Async streaming, Pydantic validation, OpenAPI docs for free (vs Flask: no native async streaming) Pydantic v2 / pydantic-settings Schemas, config One typed source for manifest, requests, settings; SecretStr masks keys PyMuPDF PDF text extraction Fast, page-aware, no system deps (vs pdfminer: slower; vs OCR stacks: out of scope) sentence-transformers all-MiniLM-L6-v2 Dense embeddings (384-d) Small, CPU-friendly, strong baseline; swappable behind Embedder Hashing embedder (512-d) Test/CI embedder Deterministic, dependency-free, so CI needs no model download In-memory store (JSON) Default vector store Zero infrastructure; honest about scale limits Qdrant Optional vector DB Named dense+sparse vectors, payload filters, local or server mode BM25 / hashed TF-IDF Sparse retrieval Exact identifiers (\"Section 66A\") that embeddings blur Reciprocal Rank Fusion Fusion No score calibration between cosine and BM25 Groq (llama-3.3-70b-versatile) LLM OpenAI-compatible, fast streaming, free tier; direct httpx keeps the dependency surface small SQLite Embedding cache Stdlib, durable, keyed by model + content hash YAML manifest Document registry Human-editable source of truth Next.js 16 / React 19 / TypeScript UI Streaming UI with type-checked API client pytest (+asyncio), ruff, pre-commit, detect-secrets Quality 218 tests, lint, secret scanning GitHub Actions CI 3 jobs: test (with eval gate), web, docker Docker / compose Packaging Written, never built here (see weaknesses) ---"},{"id":"s0-5-storage-and-schemas","heading":"5. Storage and schemas","text":"Manifest row ( data/manifest.yaml , ingestion/schema.py:50 ) Field Type Notes --- --- --- doc_id str, ^[a-z0-9][a-z0-9_\\-] $ stable slug title str doc_type enum statute, constitution, judgment, rule, circular, master_direction, scheme, faq, mapping_table, report domain enum legal, banking path str relative to data/ (e.g. raw/legal/x.pdf ) jurisdiction, authority_or_court, year, date, case_citation, act_name optional status enum in_force, amended, superseded, repealed effective_from, superseded_by, version, language, source_url, source_type optional file_hash 64 hex SHA-256 of the file page_count, text_quality int, enum good, fair, poor, needs_ocr, unknown Chunk ( retrieval/types.py:10 ) : chunk_id , doc_id , text , embed_text (prefix + text), metadata = manifest fields plus section_or_article_no, heading_path[], page_start, page_end, paragraph_no, chunk_type, token_count, strategy_id, strategy_version, file_hash, config_fingerprint, ingest_run . Files Path Content --- --- data/manifest.yaml document registry data/processed/\u003cdoc_id .json normalized pages and blocks (parse cache) data/processed/index.json memory index: {fingerprint, chunks:[{chunk_id, doc_id, text, embed_text, metadata, vector}]} data/cache/embeddings.sqlite table emb(model, key, vec) , PK (model, key) data/processed/feedback.jsonl one JSON line per feedback Qdrant collection legal_rag vectors dense (cosine), sparse (IDF); payload indexes on 6 keyword fields ---"},{"id":"s0-6-api-contracts","heading":"6. API contracts","text":"POST /v1/ask → text/event-stream // request {\"question\": \"What is the punishment for theft?\", \"domain\": \"legal\", \"conversation_id\": null, \"upload_id\": null} event: token data: {\"content\": \"Theft is ...\"} event: citations data: {\"citations\":[{\"index\":1,\"doc_id\":\"...\",\"title\":\"...\",\"section_or_article\":\"Section 4\", \"page\":3,\"status\":\"in_force\",\"snippet\":\"...\"}], \"invalid\":[], \"answer\":\"\u003csanitised text \", \"notes\":[]} event: done data: {\"conversation_id\":\"...\",\"request_id\":\"...\",\"finish_reason\":\"stop\", \"disclaimer\":\"Informational only; not legal advice.\", \"latency_ms\":1144,\"understand_ms\":0,\"retrieve_ms\":38,\"rerank_ms\":0,\"generate_ms\":1105} event: abstained data: {\"conversation_id\":\"...\",\"request_id\":\"...\",\"message\":\"...\",\"disclaimer\":\"...\"} event: error data: {\"code\":\"LLM_ERROR\",\"request_id\":\"...\",\"message\":\"The language model is unavailable.\"} Validation: question 1 to 1,000 chars (422 beyond), domain is legal banking , upload ID unknown or expired → 404, no index → 503. POST /v1/documents/upload?filename=x.pdf (raw body) → 201 {\"upload_id\":\"\u003ctoken_urlsafe(24) \",\"filename\":\"x.pdf\",\"pages\":21,\"chunks\":108,\"expires_in_seconds\":1800} Errors: 415 (type or magic), 413 (size/pages/chunks), 422 (empty or unreadable or no text), 503 (embedder not ready). DELETE /v1/documents/session/{upload_id} → 204 or 404 . GET /v1/stats → {\"documents\":21,\"chunks\":26974} . GET /v1/metrics → {\"requests\":3,\"answered\":3,\"abstained\":0,\"errors\":0,\"error_rate\":0.0,\"abstention_rate\":0.0,\"approx_output_tokens_per_request\":..,\"latency_ms\":{\"retrieve_ms\":{\"p50\":..,\"p95\":..,\"n\":3},...}} . POST /v1/feedback {\"request_id\":\"\u003c8-64 chars \",\"rating\":\"up down\",\"comment\":\"\u003c=1000\"} → 202 {\"status\":\"recorded\"} . GET /v1/admin/traces/{request_id} , DELETE /v1/admin/documents/{doc_id} need header X-API-Key ; 403 if no admin key is configured, 401 if wrong; delete returns {\"doc_id\":..., \"chunks_removed\":N} . GET /health → {\"status\":\"ok\"} . GET /ready → {\"status\":\"ready not_ready\",\"components\":{\"llm\":\"ready\",\"embedder\":\"ready (all-MiniLM-L6-v2)\",\"vector_store\":\"ready (memory, 26974 chunks)\"}} , 503 if any is not ready. All errors: {\"code\",\"message\",\"request_id\"} ; every response carries X-Request-ID . ---"},{"id":"s0-7-key-design-decisions","heading":"7. Key design decisions","text":"Decision Why Alternative considered --- --- --- Hybrid dense + sparse with RRF Legal queries mix concepts and exact identifiers; RRF needs no score calibration Weighted score sum (needs normalising cosine vs BM25) Structure-aware chunking (s1/s2/s3) A legal answer lives in one section or paragraph group; fixed windows cut provisos from their sections Single recursive character splitter Contextual prefix Title Section in the embedded text Disambiguates \"Section 3\" across Acts Embed raw text only Store the manifest as source of truth, index as derived Index can always be rebuilt; edits are reviewable Index as the only record Config fingerprint on the index Prevents silently mixing vectors from two embedders Trust the operator Safe-order replacement (upsert new, then delete stale) A crash mid-update never leaves a document with no chunks Delete then insert Abstention gate before calling the LLM No tokens spent, no hallucination on empty evidence Always call the LLM and rely on the prompt Validate citation numbers server-side The model can cite [9] when only 5 passages exist; those markers are stripped Trust the model Never retry a stream after the first token A retry would duplicate or corrupt text already shown Retry everything Pure ASGI abuse middleware No dependency, runs before routing slowapi / Redis rate limiter Ephemeral in-memory upload index with unguessable ID Per-user isolation without a database Persist uploads in the main corpus Eval configs are settings dicts Experiments and production share one code path A separate eval pipeline Direct httpx to Groq One less SDK; easy to mock with httpx.MockTransport groq or openai SDK Text-level manifest editing Keeps comments and manual edits yaml.dump the whole file ---"},{"id":"s0-8-how-to-present-this-project-script-about-2-min-15-s","heading":"8. \"How to present this project\" script (about 2 min 15 s)","text":"Opening (30 s). \"This is Legal Assist, a RAG system for Indian legal and banking documents. Users ask in plain English and get a streamed answer with numbered citations they can click to see the source passage, a note when a law has been superseded, and an explicit refusal when the corpus does not support an answer.\" Problem (15 s). \"General LLMs state legal conclusions with confidence and no source. Statutes and judgments are long and structured, so naive chunking breaks provisos away from their sections. I wanted answers that are grounded, checkable and honest about gaps.\" Architecture (45 s). \"Ingestion turns PDFs into structure-aware chunks, three of four strategies split on sections, numbered paragraphs or headings, and indexes them with a dense embedding plus BM25. At query time I rewrite and expand the question, retrieve with both, fuse with reciprocal rank fusion, cap per document, and pin exact section matches. A gate checks the best dense score; if it passes, a numbered-passage prompt goes to Groq and tokens stream to the browser over SSE. After generation I validate every citation number against the passages actually supplied.\" Hard parts (30 s). \"Three things. First, making ingestion safe and incremental: file hashes, an embedding cache, a config fingerprint that refuses mixed vectors, and a sync command that classifies new files automatically without overwriting my manual manifest edits. Second, streaming resilience: retry only before the first token. Third, finding that acronym queries like 'DPDP Act' failed because the Act never spells the acronym; I fixed it by deriving acronyms from manifest titles and embedding the expansion.\" Impact (15 s). \"218 tests, a CI gate on a fixture corpus, 21 documents and about 27,000 chunks in my real run, plus honest limits: I have not yet measured retrieval quality on the real corpus.\" ---"},{"id":"s0-9-weakness-awareness-what-i-would-say","heading":"9. Weakness awareness (what I would say)","text":"Weakness What I'd say --- --- No real-corpus quality numbers ( eval/runs/ empty, eval/experiment_log.md blank) \"The harness, golden-set schema and CI gate exist and run on a fixture corpus; I have not frozen a real golden set yet. I won't quote Hit@5 on the real corpus because I haven't measured it.\" abstain_threshold defaults to 0.0 ( settings.py:68 ) \"Out of the box it only abstains on an empty result. There's a tune-abstain command to pick a threshold on a dev split; I haven't run it on real data.\" In-memory store scans every vector, and BM25 statistics are rebuilt per query ( memory_store.py:126-129 ) \"Fine at 27k chunks for a demo, it's O(N) per query. At scale I'd cache the BM25 index or move to Qdrant, which is already supported.\" Retrieval latency spread in my 3-request sample (median 38 ms, p95 2.5 s) \"Three samples prove nothing. I'd profile before explaining it.\" Duplicate documents in the real corpus (Companies Act, DPDP, PMLA appear twice; Constitution twice with different counts) \"Sync classifies by file; it doesn't deduplicate by content. A hash or title duplicate check is the next fix.\" Process-local state: sessions, uploads, metrics, rate limit \"Single-process by design; for replicas these move to Redis.\" data/mappings/ipc_to_bns.json is not in the repo, so the old-to-new mapping returns nothing \"The mechanism and tests exist; the verified mapping data is a to-do.\" Docker and compose written but never built; the Dockerfile installs without the embeddings extra \"Unverified. First fix is adding the extra and running the build in CI.\" No OCR in this repository; scanned pages are flagged ( low_text ) and uploads with no text are rejected \"OCR isn't in the code. If a report or slide says otherwise, be ready to show the commit.\" No agentic layer in this repository (pipeline is linear) \"The implemented system is a single-pass RAG pipeline with limited query understanding. Do not describe an agent loop unless you can point to the code.\" Citation check is structural, not semantic \"I check that [n] exists, not that passage n supports the sentence. The judge in eval/judge.py does that offline.\" UI renders model markdown as literal \"Cosmetic; render markdown in AnswerPreview .\" ---"},{"id":"s0-10-numbers-to-memorise","heading":"10. Numbers to memorise","text":"Item Value Where --- --- --- Python in src/legal_rag about 6,500 lines, 55 files wc -l Tests 218 in 16 files, about 3,600 lines pytest --collect-only Web (TS/TSX/CSS) about 1,250 lines web/ Tracked project lines (py/ts/js/html/yml/toml/md) 12,758 git-tracked files Real run (your machine, MiniLM) 21 documents, 26,974 chunks Documents page screenshot Repo manifest (hashing embedder test) 10 documents, 12,828 chunks docs/ingestion_report.md Chunk size / overlap / max tokens 800 chars / 150 / 256 settings.py:72-74 Observed chunk length avg 75 to 169 tokens, max 200 ingestion stats screenshot Top-k / candidates / per-doc cap 5 / 30 / 3 settings.py:63-67 RRF constant 60 hybrid.py:14 BM25 k1 1.5, b 0.75 memory_store.py:130 Embedding dims MiniLM 384, hashing 512 model, embedder.py:31 Context budget / dedupe 12,000 chars / Jaccard 0.9 settings.py LLM llama-3.3-70b-versatile, temp 0.1, max 2,048 tokens, 30 s timeout settings.py:29-39 Retry 3 attempts, 0.5 to 8 s backoff, 0.5×min jitter resilience.py:43 Rate limit / body / question 60 req/min per IP / 1 MB / 1,000 chars settings.py Upload limits 5 MB, 100 pages, 2,000 chunks, 30 min TTL, 50 sessions settings.py Sessions TTL 3,600 s, max 1,000, history 4 turns settings.py API routes 8 under /v1 plus /health , /ready routes.py , main.py Strategy map statute, constitution, rule, scheme → s1; judgment → s2; circular, master_direction, faq, mapping_table, report → s3 chunking.py:15-26 Eval configs 16 ( B0_baseline ... C5_edges ) eval/runner.py:70-143 Smoke golden set 8 questions, 6 categories eval/golden/smoke.jsonl CI gate hit@5 ≥ 0.9, mrr ≥ 0.8, abstention_acc ≥ 0.9, citation_valid ≥ 0.9 .github/workflows/ci.yml Load test (fake LLM, 4-doc fixture) 398 requests, 0 errors, about 8.8 req/s, retrieve p50 2.5 ms docs/load_test.md Metrics page (3 real requests) total p50 1,144 ms, generation p50 1,105 ms, retrieval p50 38 ms screenshot"}]},{"title":"Q&A","file":"INTERVIEW_QA.md","html":"\u003ch1 id=\"s1-interview-q-a-78-questions-answers-ready-to-speak\">Interview Q&amp;A (78 questions, answers ready to speak)\u003c/h1>\n\u003cp>All answers are first person and match the code in this repository. Where a limitation is real, the answer says so.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s1-a-project-overview\">A. Project overview\u003c/h2>\n\u003cp>\u003cstrong>A1. What is this project?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>I built Legal Assist, a retrieval-augmented generation system for Indian legal and banking questions. It searches a corpus of statutes, judgments and RBI material, passes the best passages to an LLM, and streams back an answer with numbered citations. If the corpus doesn't support an answer, the system is designed to say so rather than guess.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>A2. Why did you build it? What problem does it solve?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Plain LLMs answer legal questions confidently with no source, and Indian statutes and judgments are long and structured, so people struggle to find the exact provision. I wanted answers that are grounded, checkable through citations, and honest about gaps and about superseded law.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>A3. Who is it for?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>Non-lawyers who want a first, sourced pointer to the right provision. The prompt says \"plain language,\" the interface shows the source passage for every citation, and every response carries \"Informational only; not legal advice.\"\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>A4. What is the end-to-end flow of a question?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>The browser POSTs to \u003ccode>/v1/ask\u003c/code>. I rewrite and expand the question, retrieve with dense and BM25 search, fuse the lists with reciprocal rank fusion, cap results per document, and pin exact section matches. A gate checks the best dense score; if it passes I build a numbered-passage prompt and stream Groq's tokens back over server-sent events. At the end I validate the citation numbers against the passages I actually supplied and send a \u003ccode>citations\u003c/code> event and a \u003ccode>done\u003c/code> event.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>A5. What's the scale of the project?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>About 6,500 lines of Python across 55 files in \u003ccode>src/legal_rag\u003c/code>, around 1,250 lines of TypeScript in the Next.js app, and 218 tests in 16 files. On my real run it indexed 21 documents into about 27,000 chunks.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>A6. What was your role?\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>I designed and built the pipeline end to end: ingestion, retrieval, generation, the API, the evaluation harness, the CI, and the interface. I can walk through any module in detail.\u003c/p>\u003
