services:
  api:
    build: .
    env_file: .env
    environment:
      INDEX_PATH: /app/data/processed/index.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - index-data:/app/data/processed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 3s
      retries: 3

  # One-shot ingestion: docker compose run --rm ingest reindex --all
  ingest:
    build: .
    profiles: ["tools"]
    env_file: .env
    entrypoint: ["python", "-m", "legal_rag.ingestion"]
    volumes:
      - index-data:/app/data/processed

volumes:
  index-data:
